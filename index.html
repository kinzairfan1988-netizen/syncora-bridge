<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Syncora Voice Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #09090b;
            --surface-card: #121215;
            --surface-hover: #18181b;
            --border-graphite: #27272a;
            --border-subtle: rgba(255, 255, 255, 0.05);
            --accent-amber: #f59e0b;
            --accent-amber-dim: rgba(245, 158, 11, 0.12);
            --accent-amber-glow: rgba(245, 158, 11, 0.25);
            --danger-red: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.25);
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --online-green: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: var(--bg-obsidian);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .app-viewport {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 920px;
            background-color: var(--bg-obsidian);
            border: 1px solid var(--border-graphite);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (max-width: 480px) {
            .app-viewport { max-height: 100vh; border: none; }
        }

        .top-navbar {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(9, 9, 11, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            z-index: 10;
        }

        .brand-cluster { display: flex; align-items: center; gap: 8px; }
        .brand-title { font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700; color: var(--text-primary); }
        .brand-title span { color: var(--accent-amber); }

        .status-pill {
            display: flex; align-items: center; gap: 5px; font-size: 11px;
            color: var(--text-muted); background: var(--surface-card);
            padding: 3px 8px; border-radius: 12px; border: 1px solid var(--border-subtle);
        }
        .dot-indicator { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
        .dot-indicator.live { background: var(--online-green); box-shadow: 0 0 6px var(--online-green); }

        .icon-btn {
            background: var(--surface-card); border: 1px solid var(--border-graphite);
            color: var(--text-primary); padding: 6px 12px; border-radius: 10px;
            cursor: pointer; font-size: 12px; font-weight: 600;
        }

        .directory-container { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); }

        .contact-card {
            background: var(--surface-card); border: 1px solid var(--border-graphite);
            border-radius: 14px; padding: 16px; display: flex; align-items: center; justify-content: space-between;
        }
        .user-identity { display: flex; align-items: center; gap: 14px; }
        .avatar-box {
            width: 44px; height: 44px; border-radius: 12px; background: #1c1c21;
            border: 1px solid var(--border-subtle); display: flex; align-items: center;
            justify-content: center; font-weight: 700; color: var(--accent-amber);
        }

        .contact-name { font-size: 14px; font-weight: 600; }
        .contact-sub { font-size: 12px; color: var(--text-muted); }

        .call-trigger-btn {
            background: var(--accent-amber-dim); border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--accent-amber); width: 44px; height: 44px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer;
        }

        /* INCOMING CALL MODAL */
        .incoming-modal-backdrop {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(10px); z-index: 200; display: none;
            flex-direction: column; align-items: center; justify-content: center; padding: 24px;
        }
        .incoming-dialog {
            background: var(--surface-card); border: 1px solid var(--border-graphite);
            border-radius: 24px; padding: 28px 24px; width: 100%; text-align: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }
        .incoming-avatar {
            width: 70px; height: 70px; border-radius: 50%; background: #18181b;
            border: 2px solid var(--accent-amber); margin: 0 auto 16px auto;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: 700; color: var(--accent-amber);
        }
        .incoming-actions { display: flex; gap: 16px; margin-top: 24px; }
        .btn-call-action {
            flex: 1; padding: 14px 0; border-radius: 14px; font-size: 14px;
            font-weight: 700; border: none; cursor: pointer;
        }
        .btn-accept { background: var(--online-green); color: white; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .btn-decline { background: var(--danger-red); color: white; box-shadow: 0 0 15px var(--danger-glow); }

        /* IN-CALL OVERLAY */
        .call-screen-overlay {
            position: absolute; inset: 0; background: var(--bg-obsidian); z-index: 100;
            display: none; flex-direction: column; justify-content: space-between; padding: 40px 24px 34px 24px;
        }
        .call-header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .security-badge {
            font-size: 11px; color: var(--text-muted); background: var(--surface-card);
            padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border-subtle);
        }
        .caller-title { font-size: 22px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
        .call-duration { font-size: 14px; font-weight: 600; color: var(--accent-amber); font-variant-numeric: tabular-nums; }

        .call-stage-center {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; position: relative; margin: 20px 0;
        }
        .pulse-wave-ring {
            width: 140px; height: 140px; border-radius: 50%; background: var(--accent-amber-dim);
            border: 1px solid rgba(245, 158, 11, 0.2); position: absolute; animation: ripple 2s infinite ease-out;
        }
        @keyframes ripple {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .caller-large-avatar {
            width: 108px; height: 108px; border-radius: 50%; background: #18181b;
            border: 2px solid var(--accent-amber); display: flex; align-items: center;
            justify-content: center; font-size: 36px; font-weight: 700; color: var(--accent-amber);
            position: relative; z-index: 2; box-shadow: 0 0 30px var(--accent-amber-glow);
        }

        .subtitles-box {
            background: var(--surface-card); border: 1px solid var(--border-graphite);
            border-radius: 14px; padding: 14px; min-height: 80px; display: flex;
            flex-direction: column; justify-content: center; gap: 4px; font-size: 13px; text-align: center;
        }
        .sub-text { color: var(--online-green); font-weight: 600; }

        .call-controls-row { display: flex; align-items: center; justify-content: space-around; }
        .ctrl-btn-circle {
            width: 54px; height: 54px; border-radius: 50%; border: 1px solid var(--border-graphite);
            background: var(--surface-card); color: var(--text-primary); font-size: 18px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .ctrl-btn-circle.active { background: var(--text-primary); color: #000; }
        .ctrl-btn-circle.hangup { background: var(--danger-red); border-color: var(--danger-red); color: white; }
    </style>
</head>
<body>

    <div class="app-viewport">
        <header class="top-navbar">
            <div class="brand-cluster">
                <div class="brand-title">Syncora <span>Terminal</span></div>
                <div class="status-pill">
                    <span class="dot-indicator" id="status-dot"></span>
                    <span id="conn-status">Connecting</span>
                </div>
            </div>
            <button class="icon-btn" onclick="copyInviteLink()" id="copy-btn">📋 Share Link</button>
        </header>

        <main class="directory-container">
            <div class="section-label">Direct Voice Line</div>

            <div class="contact-card">
                <div class="user-identity">
                    <div class="avatar-box">P2</div>
                    <div class="user-meta">
                        <div class="contact-name">Direct Voice Partner</div>
                        <div class="contact-sub" id="room-sub">Room: Syncing...</div>
                    </div>
                </div>
                <button class="call-trigger-btn" onclick="initiateCall()" title="Call">📞</button>
            </div>
        </main>

        <!-- INCOMING CALL MODAL -->
        <div class="incoming-modal-backdrop" id="incoming-modal">
            <div class="incoming-dialog">
                <div class="incoming-avatar">P2</div>
                <h3 style="font-size: 19px; margin-bottom: 6px;">Incoming Voice Call</h3>
                <p style="font-size: 13px; color: var(--text-secondary);">Direct Encrypted Channel</p>
                <div class="incoming-actions">
                    <button class="btn-call-action btn-decline" onclick="declineCall()">Decline</button>
                    <button class="btn-call-action btn-accept" onclick="acceptCall()">Accept</button>
                </div>
            </div>
        </div>

        <!-- ACTIVE CALL SCREEN -->
        <section class="call-screen-overlay" id="call-screen">
            <div class="call-header">
                <div class="security-badge">🔒 Live Audio Line Active</div>
                <div class="caller-title" id="call-status-label">Direct Partner</div>
                <div class="call-duration" id="call-timer">00:00</div>
            </div>

            <div class="call-stage-center">
                <div class="pulse-wave-ring"></div>
                <div class="caller-large-avatar">P2</div>
            </div>

            <div class="subtitles-box">
                <div class="sub-text" id="sub-caption">Connecting audio...</div>
            </div>

            <div class="call-controls-row">
                <button class="ctrl-btn-circle" id="mute-btn" onclick="toggleMute()">🎙️</button>
                <button class="ctrl-btn-circle hangup" onclick="endCall(true)">🛑</button>
            </div>
        </section>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room') || ('call-' + Math.random().toString(36).substring(2, 7));
        if (!urlParams.get('room')) {
            window.history.replaceState(null, '', window.location.pathname + '?room=' + roomId);
        }
        document.getElementById("room-sub").innerText = `Room: ${roomId}`;

        let socket = null;
        let audioContext = null;
        let mediaStream = null;
        let scriptNode = null;
        let isCallActive = false;
        let isMuted = false;
        let timerInterval = null;
        let elapsedSeconds = 0;
        let playbackTime = 0;

        function copyInviteLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const btn = document.getElementById("copy-btn");
                btn.innerText = "✅ Done";
                setTimeout(() => { btn.innerText = "📋 Share Link"; }, 1500);
            });
        }

        function initSocket() {
            const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
            socket = new WebSocket(`${wsProtocol}${window.location.host}/ws/${roomId}`);
            socket.binaryType = "arraybuffer";

            socket.onopen = () => {
                document.getElementById("status-dot").classList.add("live");
                document.getElementById("conn-status").innerText = "Online";
            };

            socket.onmessage = (event) => {
                if (typeof event.data === "string") {
                    const data = JSON.parse(event.data);
                    if (data.type === "call_invite") {
                        document.getElementById("incoming-modal").style.display = "flex";
                    } else if (data.type === "call_accepted") {
                        document.getElementById("call-status-label").innerText = "Direct Partner";
                        document.getElementById("sub-caption").innerText = "Call Connected • Speak Naturally";
                        startCallTimer();
                        startContinuousAudioCapture();
                    } else if (data.type === "call_declined" || data.type === "call_ended") {
                        endCall(false);
                    }
                } else if (event.data instanceof ArrayBuffer) {
                    playRawAudio(event.data);
                }
            };

            socket.onclose = () => {
                document.getElementById("status-dot").classList.remove("live");
                document.getElementById("conn-status").innerText = "Offline";
                setTimeout(initSocket, 1500);
            };
        }

        async function ensureAudioContext() {
            if (!audioContext || audioContext.state === "closed") {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioCtx({ sampleRate: 16000 });
            }
            if (audioContext.state === "suspended") {
                await audioContext.resume();
            }
        }

        async function startContinuousAudioCapture() {
            await ensureAudioContext();

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    },
                    video: false
                });

                const source = audioContext.createMediaStreamSource(mediaStream);
                // Increased to 4096 to prevent stutter and network packet drops
                scriptNode = audioContext.createScriptProcessor(4096, 1, 1);

                scriptNode.onaudioprocess = (e) => {
                    if (!isCallActive || isMuted || !socket || socket.readyState !== WebSocket.OPEN) return;
                    const channelData = e.inputBuffer.getChannelData(0);

                    const pcmData = new Int16Array(channelData.length);
                    for (let i = 0; i < channelData.length; i++) {
                        const s = Math.max(-1, Math.min(1, channelData[i]));
                        pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    socket.send(pcmData.buffer);
                };

                source.connect(scriptNode);
                const silentGain = audioContext.createGain();
                silentGain.gain.value = 0;
                scriptNode.connect(silentGain);
                silentGain.connect(audioContext.destination);

            } catch (err) {
                alert("Microphone permission required: " + err.message);
            }
        }

        function playRawAudio(arrayBuffer) {
            if (!audioContext || !isCallActive) return;

            const pcmData = new Int16Array(arrayBuffer);
            const floatData = new Float32Array(pcmData.length);
            for (let i = 0; i < pcmData.length; i++) {
                floatData[i] = pcmData[i] / 32768.0;
            }

            const audioBuf = audioContext.createBuffer(1, floatData.length, 16000);
            audioBuf.copyToChannel(floatData, 0);

            const source = audioContext.createBufferSource();
            source.buffer = audioBuf;
            source.connect(audioContext.destination);

            const currentTime = audioContext.currentTime;
            // Add 40ms jitter buffer margin to eliminate choppy gaps
            if (playbackTime < currentTime) {
                playbackTime = currentTime + 0.04;
            }
            source.start(playbackTime);
            playbackTime += audioBuf.duration;
        }

        async function initiateCall() {
            await ensureAudioContext();
            isCallActive = true;
            document.getElementById("call-screen").style.display = "flex";
            document.getElementById("call-status-label").innerText = "Ringing...";
            document.getElementById("sub-caption").innerText = "Waiting for partner to answer...";

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: "call_invite" }));
            }
        }

        async function acceptCall() {
            await ensureAudioContext();
            document.getElementById("incoming-modal").style.display = "none";
            isCallActive = true;
            document.getElementById("call-screen").style.display = "flex";
            document.getElementById("call-status-label").innerText = "Direct Partner";
            document.getElementById("sub-caption").innerText = "Call Connected • Speak Naturally";

            startCallTimer();
            startContinuousAudioCapture();

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: "call_accepted" }));
            }
        }

        function declineCall() {
            document.getElementById("incoming-modal").style.display = "none";
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: "call_declined" }));
            }
        }

        function startCallTimer() {
            elapsedSeconds = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                elapsedSeconds++;
                const mins = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
                const secs = String(elapsedSeconds % 60).padStart(2, '0');
                document.getElementById("call-timer").innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function endCall(sendSignal = true) {
            isCallActive = false;
            clearInterval(timerInterval);
            document.getElementById("call-timer").innerText = "00:00";

            if (scriptNode) {
                scriptNode.disconnect();
                scriptNode = null;
            }

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }

            playbackTime = 0;
            document.getElementById("incoming-modal").style.display = "none";
            document.getElementById("call-screen").style.display = "none";

            if (sendSignal && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: "call_ended" }));
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            const btn = document.getElementById("mute-btn");
            if (isMuted) {
                btn.classList.add("active");
                btn.innerText = "🔇";
            } else {
                btn.classList.remove("active");
                btn.innerText = "🎙️";
            }
        }

        window.onload = () => {
            initSocket();
        };
    </script>
</body>
</html>
