<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncora Live Voice Call</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #090d16;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .call-card {
            width: 100%;
            max-width: 480px;
            background: #131d2e;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            border: 1px solid #1e293b;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 0 0 6px 0;
            color: #38bdf8;
            font-size: 20px;
            letter-spacing: 0.5px;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #0f172a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #94a3b8;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
        }
        .dot.active {
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }
        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
            background: #0b111c;
            padding: 12px;
            border-radius: 16px;
        }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .field-group label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: bold;
        }
        select, input {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            width: 100%;
        }
        .call-visualizer {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px 0;
            margin: 10px 0;
        }
        .avatar-wrap {
            text-align: center;
        }
        .avatar {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            margin: auto;
            border: 3px solid #334155;
            transition: 0.3s;
        }
        .avatar.speaking {
            border-color: #22c55e;
            transform: scale(1.06);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }
        .avatar-label {
            margin-top: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #cbd5e1;
        }
        .live-captions {
            background: #0b111c;
            border-radius: 14px;
            height: 180px;
            overflow-y: auto;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .transcript-item {
            font-size: 13px;
            line-height: 1.4;
            padding: 8px 10px;
            border-radius: 10px;
            background: #131d2e;
        }
        .transcript-item .user {
            color: #38bdf8;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .transcript-item .orig {
            color: #94a3b8;
        }
        .transcript-item .trans {
            color: #22c55e;
            font-weight: 500;
            margin-top: 2px;
        }
        .call-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .call-btn {
            border: none;
            border-radius: 50px;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            color: white;
            flex: 1;
            justify-content: center;
        }
        .start-btn {
            background: #22c55e;
        }
        .start-btn:hover {
            background: #16a34a;
        }
        .end-btn {
            background: #ef4444;
            display: none;
        }
        .end-btn:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

<div class="call-card">
    <div class="header">
        <h2>⚡ Syncora Live Call</h2>
        <div class="status-badge">
            <span class="dot" id="status-dot"></span>
            <span id="call-status">Call Disconnected</span>
        </div>
    </div>

    <div class="config-grid">
        <div class="field-group">
            <label>Name</label>
            <input type="text" id="username" value="Ali">
        </div>
        <div class="field-group">
            <label>Gender Voice</label>
            <select id="gender">
                <option value="male" selected>👨 Male</option>
                <option value="female">👩 Female</option>
            </select>
        </div>
        <div class="field-group">
            <label>My Language</label>
            <select id="my-lang">
                <option value="ur-PK" selected>🇵🇰 Urdu</option>
                <option value="en-US">🇬🇧 English</option>
                <option value="zh-CN">🇨🇳 Chinese</option>
                <option value="ms-MY">🇲🇾 Malay</option>
                <option value="ar-SA">🇸🇦 Arabic</option>
                <option value="es-ES">🇪🇸 Spanish</option>
                <option value="ru-RU">🇷🇺 Russian</option>
                <option value="tr-TR">🇹🇷 Turkish</option>
                <option value="de-DE">🇩🇪 German</option>
                <option value="ja-JP">🇯🇵 Japanese</option>
            </select>
        </div>
        <div class="field-group">
            <label>Translate To</label>
            <select id="target-lang">
                <option value="ms-MY" selected>🇲🇾 Malay</option>
                <option value="ur-PK">🇵🇰 Urdu</option>
                <option value="en-US">🇬🇧 English</option>
                <option value="zh-CN">🇨🇳 Chinese</option>
                <option value="ar-SA">🇸🇦 Arabic</option>
                <option value="es-ES">🇪🇸 Spanish</option>
                <option value="ru-RU">🇷🇺 Russian</option>
                <option value="tr-TR">🇹🇷 Turkish</option>
                <option value="de-DE">🇩🇪 German</option>
                <option value="ja-JP">🇯🇵 Japanese</option>
            </select>
        </div>
    </div>

    <div class="call-visualizer">
        <div class="avatar-wrap">
            <div class="avatar" id="local-avatar">🎙️</div>
            <div class="avatar-label">You (Speaking)</div>
        </div>
        <div style="color: #64748b; font-size: 20px;">➔</div>
        <div class="avatar-wrap">
            <div class="avatar" id="remote-avatar">🔊</div>
            <div class="avatar-label">Partner (Receiver)</div>
        </div>
    </div>

    <div class="live-captions" id="captions">
        <div style="text-align: center; color: #475569; font-size: 12px; margin: auto;">
            Call connect karein aur hands-free baat cheet shuru karein.
        </div>
    </div>

    <div class="call-actions">
        <button class="call-btn start-btn" id="start-call-btn" onclick="startCall()">
            📞 Start Voice Call
        </button>
        <button class="call-btn end-btn" id="end-call-btn" onclick="endCall()">
            🛑 End Call
        </button>
    </div>
</div>

<script>
    const wsUrl = (window.location.protocol === "https:" ? "wss://" : "ws://") + window.location.host + "/ws/room";
    let socket = null;
    let recognition = null;
    let isCallActive = false;
    let isPlayingAudio = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function initSocket() {
        socket = new WebSocket(wsUrl);

        socket.onopen = () => {
            document.getElementById("status-dot").classList.add("active");
            document.getElementById("call-status").innerText = "Call Connected (Hands-Free)";
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            appendCaption(data.sender, data.original, data.translated);
            playLiveSpeech(data.translated, data.target_lang, data.gender);
        };

        socket.onclose = () => {
            document.getElementById("status-dot").classList.remove("active");
            document.getElementById("call-status").innerText = "Call Disconnected";
        };
    }

    function appendCaption(sender, orig, trans) {
        const captions = document.getElementById("captions");
        const item = document.createElement("div");
        item.className = "transcript-item";
        item.innerHTML = `
            <div class="user">${sender}</div>
            <div class="orig">${orig}</div>
            <div class="trans">👉 ${trans}</div>
        `;
        captions.appendChild(item);
        captions.scrollTop = captions.scrollHeight;
    }

    function playLiveSpeech(text, lang, gender) {
        if (!text || text.startsWith("[Groq Error")) return;
        
        isPlayingAudio = true;
        const remoteAvatar = document.getElementById("remote-avatar");
        remoteAvatar.classList.add("speaking");

        const url = `/tts?text=${encodeURIComponent(text)}&lang=${encodeURIComponent(lang)}&gender=${encodeURIComponent(gender)}`;
        const audio = new Audio(url);

        audio.onended = () => {
            isPlayingAudio = false;
            remoteAvatar.classList.remove("speaking");
        };

        audio.onerror = () => {
            isPlayingAudio = false;
            remoteAvatar.classList.remove("speaking");
        };

        audio.play().catch(() => {
            isPlayingAudio = false;
            remoteAvatar.classList.remove("speaking");
        });
    }

    function setupSpeechRecognition() {
        if (!SpeechRecognition) {
            alert("Please use Chrome or Edge browser for continuous voice calls.");
            return;
        }

        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            if (isPlayingAudio) return; // Ignore echo during playback

            const lastIndex = event.results.length - 1;
            const transcript = event.results[lastIndex][0].transcript.trim();

            if (!transcript) return;

            const localAvatar = document.getElementById("local-avatar");
            localAvatar.classList.add("speaking");
            setTimeout(() => localAvatar.classList.remove("speaking"), 1000);

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    sender: document.getElementById("username").value || "Ali",
                    gender: document.getElementById("gender").value,
                    source_lang: document.getElementById("my-lang").value,
                    target_lang: document.getElementById("target-lang").value,
                    text: transcript
                }));
            }
        };

        recognition.onerror = (e) => {
            console.log("Speech Recognition Status:", e.error);
        };

        recognition.onend = () => {
            // Auto restart to keep call alive
            if (isCallActive) {
                try {
                    recognition.lang = document.getElementById("my-lang").value;
                    recognition.start();
                } catch(e) {}
            }
        };
    }

    function startCall() {
        isCallActive = true;
        document.getElementById("start-call-btn").style.display = "none";
        document.getElementById("end-call-btn").style.display = "flex";

        initSocket();
        setupSpeechRecognition();

        recognition.lang = document.getElementById("my-lang").value;
        try {
            recognition.start();
        } catch(e) {}
    }

    function endCall() {
        isCallActive = false;
        document.getElementById("start-call-btn").style.display = "flex";
        document.getElementById("end-call-btn").style.display = "none";

        if (recognition) {
            try { recognition.stop(); } catch(e) {}
        }
        if (socket) {
            socket.close();
        }
    }
</script>

</body>
</html>
