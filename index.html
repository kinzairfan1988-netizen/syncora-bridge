<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Syncora Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #09090b;
            --surface-card: #121215;
            --surface-hover: #18181b;
            --border-graphite: #27272a;
            --border-subtle: rgba(255, 255, 255, 0.05);
            --accent-amber: #f59e0b;
            --accent-amber-dim: rgba(245, 158, 11, 0.12);
            --accent-amber-glow: rgba(245, 158, 11, 0.25);
            --danger-red: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.25);
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --online-green: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: var(--bg-obsidian);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .app-viewport {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 920px;
            background-color: var(--bg-obsidian);
            border: 1px solid var(--border-graphite);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (max-width: 480px) {
            .app-viewport { max-height: 100vh; border: none; }
        }

        /* 1. DIRECTORY SCREEN */
        .view-directory {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .top-navbar {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(9, 9, 11, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            z-index: 10;
        }

        .brand-cluster { display: flex; align-items: center; gap: 8px; }
        .brand-title { font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700; color: var(--text-primary); }
        .brand-title span { color: var(--accent-amber); }

        .status-pill {
            display: flex; align-items: center; gap: 5px; font-size: 11px;
            color: var(--text-muted); background: var(--surface-card);
            padding: 3px 8px; border-radius: 12px; border: 1px solid var(--border-subtle);
        }
        .dot-indicator { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
        .dot-indicator.live { background: var(--online-green); box-shadow: 0 0 6px var(--online-green); }

        .btn-add-contact {
            background: var(--accent-amber-dim);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--accent-amber);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .directory-container {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .contact-card {
            background: var(--surface-card);
            border: 1px solid var(--border-graphite);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .contact-card:hover {
            border-color: var(--accent-amber);
            background: var(--surface-hover);
        }

        .user-identity { display: flex; align-items: center; gap: 14px; }
        .avatar-box {
            width: 48px; height: 48px; border-radius: 14px; background: #1c1c21;
            border: 1px solid var(--border-subtle); display: flex; align-items: center;
            justify-content: center; font-weight: 700; color: var(--accent-amber);
            text-transform: uppercase; font-size: 16px;
        }

        .contact-name { font-size: 15px; font-weight: 700; color: var(--text-primary); }
        .contact-sub { font-size: 12px; color: var(--text-muted); font-family: 'Space Grotesk', monospace; }

        .card-trailing {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-mini-chat {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        /* FLOATING ACTION BUTTON (+) */
        .fab-add {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 18px;
            background: var(--accent-amber);
            color: #000;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--accent-amber-glow);
            transition: all 0.2s ease;
            z-index: 20;
        }
        .fab-add:active { transform: scale(0.92); }

        /* ADD CONTACT MODAL POPUP */
        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-card {
            background: var(--surface-card);
            border: 1px solid var(--border-graphite);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-title { font-size: 16px; font-weight: 700; color: var(--accent-amber); }
        .modal-close { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-field {
            background: var(--bg-obsidian);
            border: 1px solid var(--border-graphite);
            color: var(--text-primary);
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
        }
        .input-field:focus { border-color: var(--accent-amber); }

        .btn-modal-save {
            background: var(--accent-amber);
            color: #000;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-modal-wa {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: var(--online-green);
            padding: 11px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        /* 2. DIRECT CHAT VIEW */
        .view-chat-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-obsidian);
        }

        .chat-top-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(18, 18, 21, 0.95);
            border-bottom: 1px solid var(--border-graphite);
            z-index: 10;
        }

        .chat-contact-meta { display: flex; align-items: center; gap: 10px; }
        .btn-back-arrow {
            background: transparent; border: none; color: var(--text-muted);
            font-size: 20px; cursor: pointer; padding: 4px;
        }

        .chat-action-cluster { display: flex; align-items: center; gap: 8px; }
        .chat-header-btn {
            background: var(--surface-card); border: 1px solid var(--border-graphite);
            color: var(--text-primary); padding: 7px 11px; border-radius: 10px;
            font-size: 12px; font-weight: 700; display: flex; align-items: center;
            gap: 5px; cursor: pointer;
        }
        .chat-header-btn.translate-call {
            background: var(--accent-amber-dim); color: var(--accent-amber);
            border-color: rgba(245, 158, 11, 0.4);
        }

        .chat-translate-toggle-bar {
            padding: 6px 16px; background: rgba(245, 158, 11, 0.05);
            border-bottom: 1px solid var(--border-subtle); display: flex;
            align-items: center; justify-content: space-between; font-size: 11px;
        }
        .toggle-switch-label {
            display: flex; align-items: center; gap: 6px; color: var(--accent-amber);
            font-weight: 600; cursor: pointer;
        }

        .chat-messages-area {
            flex: 1; padding: 16px 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
        }

        .chat-bubble {
            max-width: 82%; padding: 10px 14px; border-radius: 14px;
            font-size: 13px; line-height: 1.4; word-break: break-word;
        }
        .chat-bubble.sent {
            align-self: flex-end; background: var(--accent-amber);
            color: #000; font-weight: 500; border-bottom-right-radius: 4px;
        }
        .chat-bubble.received {
            align-self: flex-start; background: var(--surface-card);
            color: var(--text-primary); border: 1px solid var(--border-graphite);
            border-bottom-left-radius: 4px;
        }

        .bubble-translation {
            font-size: 11px; margin-top: 4px; padding-top: 4px;
            border-top: 1px dashed rgba(0, 0, 0, 0.2); font-style: italic;
        }
        .chat-bubble.received .bubble-translation {
            border-top-color: var(--border-graphite); color: var(--online-green);
        }
        .chat-time { font-size: 9px; opacity: 0.6; margin-top: 4px; text-align: right; }

        .chat-input-bar {
            padding: 12px 16px 20px 16px; display: flex; gap: 8px;
            background: var(--bg-obsidian); border-top: 1px solid var(--border-subtle);
        }
        .chat-input {
            flex: 1; background: var(--surface-card); border: 1px solid var(--border-graphite);
            color: var(--text-primary); border-radius: 12px; padding: 12px 14px;
            font-size: 13px; outline: none;
        }
        .chat-input:focus { border-color: var(--accent-amber); }

        .chat-send-btn {
            background: var(--accent-amber); border: none; color: #000;
            width: 44px; height: 44px; border-radius: 12px; display: flex;
            align-items: center; justify-content: center; font-size: 16px;
            font-weight: 700; cursor: pointer;
        }

        /* 3. INCOMING CALL MODAL */
        .incoming-modal-backdrop {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px); z-index: 200; display: none;
            flex-direction: column; align-items: center; justify-content: center; padding: 24px;
        }
        .incoming-dialog {
            background: var(--surface-card); border: 1px solid var(--accent-amber);
            border-radius: 24px; padding: 32px 24px; width: 100%; text-align: center;
            box-shadow: 0 0 50px var(--accent-amber-glow);
            animation: ringPulse 1.2s infinite ease-in-out;
        }
        @keyframes ringPulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .incoming-avatar {
            width: 76px; height: 76px; border-radius: 50%; background: #18181b;
            border: 2px solid var(--accent-amber); margin: 0 auto 16px auto;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; font-weight: 700; color: var(--accent-amber);
            box-shadow: 0 0 20px var(--accent-amber-glow); text-transform: uppercase;
        }
        .incoming-actions { display: flex; gap: 16px; margin-top: 24px; }
        .btn-call-action {
            flex: 1; padding: 14px 0; border-radius: 14px; font-size: 14px;
            font-weight: 700; border: none; cursor: pointer;
        }
        .btn-accept { background: var(--online-green); color: white; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .btn-decline { background: var(--danger-red); color: white; box-shadow: 0 0 15px var(--danger-glow); }

        /* 4. ACTIVE CALL OVERLAY */
        .call-screen-overlay {
            position: absolute; inset: 0; background: var(--bg-obsidian); z-index: 100;
            display: none; flex-direction: column; justify-content: space-between; padding: 30px 24px 30px 24px;
        }
        .call-header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }

        .call-mode-pill {
            font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 20px;
            background: var(--surface-card); border: 1px solid var(--border-graphite);
            color: var(--text-muted);
        }
        .call-mode-pill.live-ai {
            background: var(--accent-amber-dim); border-color: rgba(245, 158, 11, 0.3);
            color: var(--accent-amber);
        }

        .caller-title { font-size: 22px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
        .call-duration { font-size: 14px; font-weight: 600; color: var(--accent-amber); font-variant-numeric: tabular-nums; }

        .call-stage-center {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; position: relative; margin: 10px 0;
        }
        .pulse-wave-ring {
            width: 140px; height: 140px; border-radius: 50%; background: var(--accent-amber-dim);
            border: 1px solid rgba(245, 158, 11, 0.2); position: absolute; animation: ripple 2s infinite ease-out;
        }
        @keyframes ripple { 0% { transform: scale(0.9); opacity: 0.8; } 100% { transform: scale(1.4); opacity: 0; } }

        .caller-large-avatar {
            width: 108px; height: 108px; border-radius: 50%; background: #18181b;
            border: 2px solid var(--accent-amber); display: flex; align-items: center;
            justify-content: center; font-size: 36px; font-weight: 700; color: var(--accent-amber);
            position: relative; z-index: 2; box-shadow: 0 0 30px var(--accent-amber-glow);
            text-transform: uppercase;
        }

        .subtitles-box {
            background: var(--surface-card); border: 1px solid var(--border-graphite);
            border-radius: 14px; padding: 12px 14px; min-height: 80px; display: flex;
            flex-direction: column; justify-content: center; gap: 4px; text-align: center;
        }
        .sub-original { font-size: 11px; color: var(--text-muted); }
        .sub-translated { font-size: 14px; color: var(--online-green); font-weight: 600; }

        .call-controls-row { display: flex; align-items: center; justify-content: space-around; }
        .ctrl-btn-circle {
            width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--border-graphite);
            background: var(--surface-card); color: var(--text-primary); font-size: 18px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .ctrl-btn-circle.active { background: var(--accent-amber); color: #000; border-color: var(--accent-amber); }
        .ctrl-btn-circle.muted-state { background: var(--text-primary); color: #000; }
        .ctrl-btn-circle.hangup { background: var(--danger-red); border-color: var(--danger-red); color: white; }
    </style>
</head>
<body>

    <div class="app-viewport">
        
        <!-- 1. DIRECTORY SCREEN (CONTACT LIST) -->
        <div class="view-directory" id="view-dir">
            <header class="top-navbar">
                <div class="brand-cluster">
                    <div class="brand-title">Syncora <span>Terminal</span></div>
                    <div class="status-pill">
                        <span class="dot-indicator" id="status-dot"></span>
                        <span id="conn-status">Online</span>
                    </div>
                </div>
                <button class="btn-add-contact" onclick="openAddModal()">＋ Add Contact</button>
            </header>

            <main class="directory-container">
                <div class="section-label">Saved Contacts</div>

                <!-- CONTACT CARD -->
                <div class="contact-card" onclick="openContactChat()">
                    <div class="user-identity">
                        <div class="avatar-box" id="active-avatar-initials">AF</div>
                        <div class="user-meta">
                            <div class="contact-name" id="active-line-title">Ahmad Farman TBT</div>
                            <div class="contact-sub" id="room-sub">03488674051</div>
                        </div>
                    </div>
                    <div class="card-trailing">
                        <div class="btn-mini-chat">💬</div>
                    </div>
                </div>
            </main>

            <!-- FLOATING ACTION BUTTON (+) -->
            <button class="fab-add" onclick="openAddModal()" title="Add New Contact">＋</button>

            <!-- ADD CONTACT MODAL POPUP -->
            <div class="modal-backdrop" id="add-modal">
                <div class="modal-card">
                    <div class="modal-header">
                        <div class="modal-title">New Contact</div>
                        <button class="modal-close" onclick="closeAddModal()">✕</button>
                    </div>
                    <div class="input-group">
                        <input type="text" id="modal-name-input" class="input-field" placeholder="Contact Name">
                        <input type="tel" id="modal-phone-input" class="input-field" placeholder="Mobile Number (e.g. 03488674051)">
                    </div>
                    <button class="btn-modal-save" onclick="saveContactFromModal()">Save Contact</button>
                    <button class="btn-modal-wa" onclick="openDirectWhatsApp()">💬 Open in WhatsApp Directly</button>
                </div>
            </div>
        </div>

        <!-- 2. DIRECT CHAT VIEW -->
        <div class="view-chat-screen" id="view-chat-screen">
            <header class="chat-top-header">
                <div class="chat-contact-meta">
                    <button class="btn-back-arrow" onclick="closeContactChat()">←</button>
                    <div class="avatar-box" id="chat-header-avatar" style="width: 36px; height: 36px; font-size: 13px;">AF</div>
                    <div>
                        <div style="font-size: 14px; font-weight: 700;" id="chat-header-title">Ahmad Farman TBT</div>
                        <div style="font-size: 11px; color: var(--online-green);">Direct Line</div>
                    </div>
                </div>

                <div class="chat-action-cluster">
                    <button class="chat-header-btn" onclick="initiateCall(false)" title="Normal Voice Call">
                        📞 Call
                    </button>
                    <button class="chat-header-btn translate-call" onclick="initiateCall(true)" title="AI Live Translate Call">
                        🌐 AI Translate
                    </button>
                </div>
            </header>

            <div class="chat-translate-toggle-bar">
                <span>Auto-Translate Chat (Urdu ⇄ English)</span>
                <label class="toggle-switch-label">
                    <input type="checkbox" id="chat-translate-toggle" checked>
                    <span>Active</span>
                </label>
            </div>

            <div class="chat-messages-area" id="chat-msgs-box"></div>

            <div class="chat-input-bar">
                <input type="text" class="chat-input" id="chat-input-field" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendChatMessage()">
                <button class="chat-send-btn" onclick="sendChatMessage()">➤</button>
            </div>
        </div>

        <!-- 3. INCOMING CALL MODAL -->
        <div class="incoming-modal-backdrop" id="incoming-modal">
            <div class="incoming-dialog">
                <div class="incoming-avatar" id="incoming-caller-avatar">AF</div>
                <h3 style="font-size: 20px; margin-bottom: 6px;" id="incoming-caller-name">Incoming Call...</h3>
                <p style="font-size: 13px; color: var(--accent-amber);" id="incoming-call-type-label">Voice Line</p>
                <div class="incoming-actions">
                    <button class="btn-call-action btn-decline" onclick="declineCall()">Decline</button>
                    <button class="btn-call-action btn-accept" onclick="acceptCall()">Accept</button>
                </div>
            </div>
        </div>

        <!-- 4. ACTIVE CALL OVERLAY -->
        <section class="call-screen-overlay" id="call-screen">
            <div class="call-header">
                <div class="call-mode-pill" id="call-mode-badge">Direct Voice Line</div>
                <div class="caller-title" id="call-status-label">Ahmad Farman TBT</div>
                <div class="call-duration" id="call-timer">00:00</div>
            </div>

            <div class="call-stage-center">
                <div class="pulse-wave-ring"></div>
                <div class="caller-large-avatar" id="active-call-avatar">AF</div>
            </div>

            <div class="subtitles-box" id="call-subtitle-box">
                <div class="sub-original" id="sub-original">Speak naturally...</div>
                <div class="sub-translated" id="sub-translated">Voice Channel Ready</div>
            </div>

            <div class="call-controls-row">
                <button class="ctrl-btn-circle" id="mute-btn" onclick="toggleMute()" title="Mute Mic">🎙️</button>
                <button class="ctrl-btn-circle" id="speaker-btn" onclick="toggleSpeaker()" title="Loudspeaker">🔊</button>
                <button class="ctrl-btn-circle hangup" onclick="endCall(true)" title="End Call">🛑</button>
            </div>
        </section>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let phoneParam = urlParams.get('phone');
        let nameParam = urlParams.get('name') ? decodeURIComponent(urlParams.get('name')) : null;

        let savedContactName = localStorage.getItem("syncora_contact_name") || nameParam || "Ahmad Farman TBT";
        let savedPhone = localStorage.getItem("syncora_contact_phone") || phoneParam || "03488674051";

        let currentRoom = phoneParam ? ('num-' + phoneParam.replace(/[^0-9]/g, '')) : (savedPhone ? ('num-' + savedPhone.replace(/[^0-9]/g, '')) : 'call-syncora');

        const myId = "usr-" + Math.random().toString(36).substring(2, 8);
        let socket = null;
        let audioContext = null;
        let mediaStream = null;
        let scriptNode = null;
        let speechRecognition = null;
        let isCallActive = false;
        let isTranslationCall = false;
        let isMuted = false;
        let isSpeakerOn = false;
        let timerInterval = null;
        let elapsedSeconds = 0;
        let playbackTime = 0;
        let ringInterval = null;
        let gainNode = null;

        function getInitials(name) {
            if (!name) return "AF";
            const parts = name.trim().split(" ");
            if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
            return name.substring(0, 2).toUpperCase();
        }

        function updateUI() {
            const initials = getInitials(savedContactName);
            document.getElementById("active-line-title").innerText = savedContactName;
            document.getElementById("room-sub").innerText = savedPhone;
            document.getElementById("active-avatar-initials").innerText = initials;
            document.getElementById("chat-header-avatar").innerText = initials;
            document.getElementById("chat-header-title").innerText = savedContactName;
            document.getElementById("active-call-avatar").innerText = initials;
            document.getElementById("call-status-label").innerText = savedContactName;
            document.getElementById("incoming-caller-avatar").innerText = initials;
            document.getElementById("incoming-caller-name").innerText = `${savedContactName} is calling...`;
        }

        function openAddModal() {
            document.getElementById("modal-name-input").value = savedContactName;
            document.getElementById("modal-phone-input").value = savedPhone;
            document.getElementById("add-modal").style.display = "flex";
        }

        function closeAddModal() {
            document.getElementById("add-modal").style.display = "none";
        }

        function saveContactFromModal() {
            const nameInput = document.getElementById("modal-name-input").value.trim() || "Ahmad Farman TBT";
            const phoneInput = document.getElementById("modal-phone-input").value.trim() || "03488674051";
            const cleanPhone = phoneInput.replace(/[^0-9]/g, '');

            localStorage.setItem("syncora_contact_name", nameInput);
            localStorage.setItem("syncora_contact_phone", cleanPhone);

            window.location.href = `${window.location.pathname}?phone=${cleanPhone}&name=${encodeURIComponent(nameInput)}`;
        }

        function openContactChat() {
            document.getElementById("view-dir").style.display = "none";
            document.getElementById("view-chat-screen").style.display = "flex";
            fetchOfflineHistory();
        }

        function closeContactChat() {
            document.getElementById("view-chat-screen").style.display = "none";
            document.getElementById("view-dir").style.display = "flex";
        }

        function openDirectWhatsApp() {
            let num = document.getElementById("modal-phone-input").value.trim().replace(/[^0-9]/g, '') || savedPhone;
            const contactName = document.getElementById("modal-name-input").value.trim() || savedContactName;
            if (num.startsWith("03")) num = "92" + num.substring(1);

            const shareUrl = `${window.location.origin}${window.location.pathname}?phone=${encodeURIComponent(num || 'partner')}&name=${encodeURIComponent(contactName)}`;
            const msg = encodeURIComponent(`Assalam o Alaikum ${contactName}! Please click this direct link to connect with me: ${shareUrl}`);

            window.location.href = num ? `whatsapp://send?phone=${num}&text=${msg}` : `whatsapp://send?text=${msg}`;
        }

        async function fetchOfflineHistory() {
            try {
                const res = await fetch(`/messages/${currentRoom}`);
                const data = await res.json();
                const box = document.getElementById("chat-msgs-box");
                box.innerHTML = "";
                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(msg => {
                        const type = (msg.sender === myId) ? 'sent' : 'received';
                        appendChatMessage(msg.text, type, msg.translated, msg.time);
                    });
                }
            } catch (e) {}
        }

        async function sendChatMessage() {
            const input = document.getElementById("chat-input-field");
            const text = input.value.trim();
            if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            let translated = "";

            const isAutoTranslate = document.getElementById("chat-translate-toggle").checked;
            if (isAutoTranslate) {
                try {
                    const isUrdu = /[\u0600-\u06FF]/.test(text);
                    const res = await fetch("/translate", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            text: text,
                            source_lang: isUrdu ? "ur" : "en",
                            target_lang: isUrdu ? "en" : "ur"
                        })
                    });
                    const data = await res.json();
                    translated = data.translated_text || "";
                } catch (e) {}
            }

            socket.send(JSON.stringify({
                type: "text_message",
                text: text,
                translated: translated,
                sender: myId,
                time: timeStr
            }));

            appendChatMessage(text, 'sent', translated, timeStr);
            input.value = "";
        }

        function appendChatMessage(text, type, translated = "", timeStr = "") {
            const box = document.getElementById("chat-msgs-box");
            const bubble = document.createElement("div");
            bubble.className = `chat-bubble ${type}`;

            let content = `<div>${text}</div>`;
            if (translated && translated !== text) {
                content += `<div class="bubble-translation">AI: ${translated}</div>`;
            }
            content += `<div class="chat-time">${timeStr || 'now'}</div>`;

            bubble.innerHTML = content;
            box.appendChild(bubble);
            box.scrollTop = box.scrollHeight;
        }

        function startIncomingRingtone() {
            stopIncomingRingtone();
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            const ringCtx = new AudioCtx();

            function playBeep() {
                if (!document.getElementById("incoming-modal").style.display || document.getElementById("incoming-modal").style.display === "none") return;
                const osc1 = ringCtx.createOscillator();
                const osc2 = ringCtx.createOscillator();
                const gain = ringCtx.createGain();

                osc1.type = "sine"; osc2.type = "sine";
                osc1.frequency.setValueAtTime(440, ringCtx.currentTime);
                osc2.frequency.setValueAtTime(480, ringCtx.currentTime);

                gain.gain.setValueAtTime(0.3, ringCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ringCtx.currentTime + 1.8);

                osc1.connect(gain); osc2.connect(gain); gain.connect(ringCtx.destination);
                osc1.start(); osc2.start();
                osc1.stop(ringCtx.currentTime + 1.8); osc2.stop(ringCtx.currentTime + 1.8);

                if (navigator.vibrate) navigator.vibrate([400, 200, 400, 1000]);
            }
            playBeep();
            ringInterval = setInterval(playBeep, 3000);
        }

        function stopIncomingRingtone() {
            if (ringInterval) { clearInterval(ringInterval); ringInterval = null; }
            if (navigator.vibrate) navigator.vibrate(0);
        }

        function initSocket() {
            const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
            socket = new WebSocket(`${wsProtocol}${window.location.host}/ws/${currentRoom}`);
            socket.binaryType = "arraybuffer";

            socket.onopen = () => {
                document.getElementById("status-dot").classList.add("live");
                document.getElementById("conn-status").innerText = "Online";
            };

            socket.onmessage = (event) => {
                if (typeof event.data === "string") {
                    const data = JSON.parse(event.data);
                    if (data.type === "call_invite") {
                        isTranslationCall = data.is_translation || false;
                        document.getElementById("incoming-call-type-label").innerText = isTranslationCall ? "🌐 AI Live Translation Call" : "📞 Voice Call";
                        document.getElementById("incoming-modal").style.display = "flex";
                        startIncomingRingtone();
                    } else if (data.type === "call_accepted") {
                        stopIncomingRingtone();
                        isTranslationCall = data.is_translation || false;
                        setupActiveCallUI();
                        startCallTimer();
                        startContinuousAudioCapture();
                        if (isTranslationCall) startSpeechEngine();
                    } else if (data.type === "call_declined" || data.type === "call_ended") {
                        stopIncomingRingtone();
                        endCall(false);
                    } else if (data.type === "text_message") {
                        appendChatMessage(data.text, 'received', data.translated, data.time);
                    } else if (data.type === "live_subtitle") {
                        document.getElementById("sub-original").innerText = `Partner said: "${data.original}"`;
                        document.getElementById("sub-translated").innerText = `AI: ${data.translated}`;
                    }
                } else if (event.data instanceof ArrayBuffer) {
                    playRawAudio(event.data);
                }
            };

            socket.onclose = () => {
                document.getElementById("status-dot").classList.remove("live");
                document.getElementById("conn-status").innerText = "Offline";
                setTimeout(initSocket, 1500);
            };
        }

        function setupActiveCallUI() {
            const badge = document.getElementById("call-mode-badge");
            const subBox = document.getElementById("call-subtitle-box");
            if (isTranslationCall) {
                badge.className = "call-mode-pill live-ai";
                badge.innerText = "🌐 AI Live Translation Mode";
                subBox.style.display = "flex";
                document.getElementById("sub-translated").innerText = "Speak in Urdu or English...";
            } else {
                badge.className = "call-mode-pill";
                badge.innerText = "🔒 Clear Voice Line Active";
                subBox.style.display = "none";
            }
        }

        function initSpeechEngine() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) return;

            speechRecognition = new SpeechRec();
            speechRecognition.continuous = true;
            speechRecognition.interimResults = false;
            speechRecognition.lang = "ur-PK";

            speechRecognition.onresult = async (event) => {
                if (!isCallActive || !isTranslationCall || isMuted) return;
                const lastIdx = event.results.length - 1;
                const originalText = event.results[lastIdx][0].transcript.trim();

                if (originalText.length > 0) {
                    document.getElementById("sub-original").innerText = `You: "${originalText}"`;
                    document.getElementById("sub-translated").innerText = "Translating...";

                    const isUrdu = /[\u0600-\u06FF]/.test(originalText);
                    try {
                        const res = await fetch("/translate", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                text: originalText,
                                source_lang: isUrdu ? "ur" : "en",
                                target_lang: isUrdu ? "en" : "ur"
                            })
                        });
                        const data = await res.json();
                        const translatedText = data.translated_text || originalText;
                        document.getElementById("sub-translated").innerText = `AI: ${translatedText}`;

                        if (socket && socket.readyState === WebSocket.OPEN) {
                            socket.send(JSON.stringify({
                                type: "live_subtitle",
                                original: originalText,
                                translated: translatedText
                            }));
                        }
                    } catch (e) {}
                }
            };

            speechRecognition.onend = () => {
                if (isCallActive && isTranslationCall && !isMuted) {
                    try { speechRecognition.start(); } catch (e) {}
                }
            };
        }

        function startSpeechEngine() {
            if (speechRecognition && isCallActive) {
                try { speechRecognition.start(); } catch (e) {}
            }
        }

        async function ensureAudioContext() {
            if (!audioContext || audioContext.state === "closed") {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioCtx({ sampleRate: 16000 });
                gainNode = audioContext.createGain();
                gainNode.gain.value = 1.0;
                gainNode.connect(audioContext.destination);
            }
            if (audioContext.state === "suspended") await audioContext.resume();
        }

        async function startContinuousAudioCapture() {
            await ensureAudioContext();
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
                    video: false
                });

                const source = audioContext.createMediaStreamSource(mediaStream);
                scriptNode = audioContext.createScriptProcessor(4096, 1, 1);

                scriptNode.onaudioprocess = (e) => {
                    if (!isCallActive || isMuted || !socket || socket.readyState !== WebSocket.OPEN) return;
                    const channelData = e.inputBuffer.getChannelData(0);
                    const pcmData = new Int16Array(channelData.length);
                    for (let i = 0; i < channelData.length; i++) {
                        const s = Math.max(-1, Math.min(1, channelData[i]));
                        pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    socket.send(pcmData.buffer);
                };

                source.connect(scriptNode);
                const silentGain = audioContext.createGain();
                silentGain.gain.value = 0;
                scriptNode.connect(silentGain);
                silentGain.connect(audioContext.destination);
            } catch (err) {
                alert("Microphone required: " + err.message);
            }
        }

        function playRawAudio(arrayBuffer) {
            if (!audioContext || !isCallActive) return;
            const pcmData = new Int16Array(arrayBuffer);
            const floatData = new Float32Array(pcmData.length);
            for (let i = 0; i < pcmData.length; i++) floatData[i] = pcmData[i] / 32768.0;

            const audioBuf = audioContext.createBuffer(1, floatData.length, 16000);
            audioBuf.copyToChannel(floatData, 0);

            const source = audioContext.createBufferSource();
            source.buffer = audioBuf;
            source.connect(gainNode);

            const currentTime = audioContext.currentTime;
            if (playbackTime < currentTime) playbackTime = currentTime + 0.04;
            source.start(playbackTime);
            playbackTime += audioBuf.duration;
        }

        async function initiateCall(withTranslation = false) {
            await ensureAudioContext();
            isCallActive = true;
            isTranslationCall = withTranslation;
            setupActiveCallUI();

            document.getElementById("call-screen").style.display = "flex";
            document.getElementById("sub-translated").innerText = "Waiting for partner to answer...";

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: "call_invite",
                    is_translation: withTranslation
                }));
            }
        }

        async function acceptCall() {
            stopIncomingRingtone();
            await ensureAudioContext();
            document.getElementById("incoming-modal").style.display = "none";
            isCallActive = true;
            setupActiveCallUI();

            document.getElementById("call-screen").style.display = "flex";
            startCallTimer();
            startContinuousAudioCapture();
            if (isTranslationCall) startSpeechEngine();

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: "call_accepted",
                    is_translation: isTranslationCall
                }));
            }
        }

        function declineCall() {
            stopIncomingRingtone();
            document.getElementById("incoming-modal").style.display = "none";
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: "call_declined" }));
            }
        }

        function startCallTimer() {
            elapsedSeconds = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                elapsedSeconds++;
                const mins = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
                const secs = String(elapsedSeconds % 60).padStart(2, '0');
                document.getElementById("call-timer").innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function endCall(sendSignal = true) {
            stopIncomingRingtone();
            isCallActive = false;
            isTranslationCall = false;
            clearInterval(timerInterval);
            document.getElementById("call-timer").innerText = "00:00";

            if (scriptNode) { scriptNode.disconnect(); scriptNode = null; }
            if (speechRecognition) { try { speechRecognition.stop(); } catch (e) {} }
            if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }

            playbackTime = 0;
            document.getElementById("incoming-modal").style.display = "none";
            document.getElementById("call-screen").style.display = "none";

            if (sendSignal && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: "call_ended" }));
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            const btn = document.getElementById("mute-btn");
            btn.classList.toggle("muted-state", isMuted);
            btn.innerText = isMuted ? "🔇" : "🎙️";
        }

        function toggleSpeaker() {
            isSpeakerOn = !isSpeakerOn;
            const btn = document.getElementById("speaker-btn");
            btn.classList.toggle("active", isSpeakerOn);
            if (gainNode) gainNode.gain.value = isSpeakerOn ? 2.5 : 1.0;
        }

        window.onload = () => {
            updateUI();
            initSocket();
            initSpeechEngine();
        };
    </script>
