<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Syncora Voice Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #09090b;
            --surface-card: #121215;
            --surface-hover: #18181b;
            --border-graphite: #27272a;
            --border-subtle: rgba(255, 255, 255, 0.05);
            --accent-amber: #f59e0b;
            --accent-amber-dim: rgba(245, 158, 11, 0.12);
            --accent-amber-glow: rgba(245, 158, 11, 0.25);
            --danger-red: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.25);
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --online-green: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: var(--bg-obsidian);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .app-viewport {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 920px;
            background-color: var(--bg-obsidian);
            border: 1px solid var(--border-graphite);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (max-width: 480px) {
            .app-viewport { max-height: 100vh; border: none; }
        }

        .top-navbar {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(9, 9, 11, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            z-index: 10;
        }

        .brand-cluster { display: flex; align-items: center; gap: 8px; }
        .brand-title { font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700; color: var(--text-primary); }
        .brand-title span { color: var(--accent-amber); }

        .status-pill {
            display: flex; align-items: center; gap: 5px; font-size: 11px;
            color: var(--text-muted); background: var(--surface-card);
            padding: 3px 8px; border-radius: 12px; border: 1px solid var(--border-subtle);
        }
        .dot-indicator { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
        .dot-indicator.live { background: var(--online-green); box-shadow: 0 0 6px var(--online-green); }

        .nav-actions { display: flex; gap: 8px; }
        .icon-btn {
            background: var(--surface-card); border: 1px solid var(--border-graphite);
            color: var(--text-primary); padding: 6px 12px; border-radius: 10px;
            cursor: pointer; font-size: 12px; font-weight: 600;
        }

        .tab-segmented-bar {
            display: flex;
            padding: 10px 20px 0 20px;
            gap: 8px;
            background: var(--bg-obsidian);
        }

        .tab-pill {
            flex: 1;
            padding: 8px 0;
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .tab-pill.active {
            background: var(--accent-amber-dim);
            color: var(--accent-amber);
            border-color: rgba(245, 158, 11, 0.3);
        }

        .content-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .directory-container {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        /* DIAL NUMBER BAR */
        .dial-bar-card {
            background: var(--surface-card);
            border: 1px solid var(--border-graphite);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dial-input-row {
            display: flex;
            gap: 8px;
        }

        .dial-input {
            flex: 1;
            background: var(--bg-obsidian);
            border: 1px solid var(--border-graphite);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Space Grotesk', sans-serif;
            outline: none;
        }
        .dial-input:focus { border-color: var(--accent-amber); }

        .btn-set-target {
            background: var(--accent-amber);
            color: #000;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            padding: 0 16px;
            font-size: 13px;
            cursor: pointer;
        }

        .quick-wa-btn {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--online-green);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .contact-card {
            background: var(--surface-card);
            border: 1px solid var(--border-graphite);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .user-identity { display: flex; align-items: center; gap: 14px; }
        .avatar-box {
            width: 44px; height: 44px; border-radius: 12px; background: #1c1c21;
            border: 1px solid var(--border-subtle); display: flex; align-items: center;
            justify-content: center; font-weight: 700; color: var(--accent-amber);
        }

        .contact-name { font-size: 14px; font-weight: 600; }
        .contact-sub { font-size: 12px; color: var(--text-muted); }

        .call-trigger-btn {
            background: var(--accent-amber-dim); border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--accent-amber); width: 44px; height: 44px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer;
        }

        /* CHAT VIEW */
        .chat-view-container {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-obsidian);
        }

        .chat-messages-area {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-word;
        }

        .chat-bubble.sent {
            align-self: flex-end;
            background: var(--accent-amber);
            color: #000;
            font-weight: 500;
            border-bottom-right-radius: 4px;
        }

        .chat-bubble.received {
            align-self: flex-start;
            background: var(--surface-card);
            color: var(--text-primary);
            border: 1px solid var(--border-graphite);
            border-bottom-left-radius: 4px;
        }

        .chat-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
        }

        .chat-input-bar {
            padding: 12px 20px 20px 20px;
            display: flex;
            gap: 8px;
            background: var(--bg-obsidian);
            border-top: 1px solid var(--border-subtle);
        }

        .chat-input {
            flex: 1;
            background: var(--surface-card);
            border: 1px solid var(--border-graphite);
            color: var(--text-primary);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 13px;
            outline: none;
        }
        .chat-input:focus { border-color: var(--accent-amber); }

        .chat-send-btn {
            background: var(--accent-amber);
            border: none;
            color: #000;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        /* INCOMING CALL MODAL */
        .incoming-modal-backdrop {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px); z-index: 200; display: none;
            flex-direction: column; align-items: center; justify-content: center; padding: 24px;
        }
        .incoming-dialog {
            background: var(--surface-card); border: 1px solid var(--accent-amber);
            border-radius: 24px; padding: 32px 24px; width: 100%; text-align: center;
            box-shadow: 0 0 50px var(--accent-amber-glow);
            animation: ringPulse 1.2s infinite ease-in-out;
        }

        @keyframes ringPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .incoming-avatar {
            width: 76px; height: 76px; border-radius: 50%; background: #18181b;
            border: 2px solid var(--accent-amber); margin: 0 auto 16px auto;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; font-weight: 700; color: var(--accent-amber);
            box-shadow: 0 0 20px var(--accent-amber-glow);
        }
        .incoming-actions { display: flex; gap: 16px; margin-top: 24px; }
        .btn-call-action {
            flex: 1; padding: 14px 0; border-radius: 14px; font-size: 14px;
            font-weight: 700; border: none; cursor: pointer;
        }
        .btn-accept { background: var(--online-green); color: white; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .btn-decline { background: var(--danger-red); color: white; box-shadow: 0 0 15px var(--danger-glow); }

        /* ACTIVE CALL SCREEN */
        .call-screen-overlay {
            position: absolute; inset: 0; background: var(--bg-obsidian); z-index: 100;
            display: none; flex-direction: column; justify-content: space-between; padding: 40px 24px 34px 24px;
        }
        .call-header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .security-badge {
            font-size: 11px; color: var(--text-muted); background: var(--surface-card);
            padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border-subtle);
        }
        .caller-title { font-size: 22px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
        .call-duration { font-size: 14px; font-weight: 600; color: var(--accent-amber); font-variant-numeric: tabular-nums; }

        .call-stage-center {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; position: relative; margin: 20px 0;
        }
        .pulse-wave-ring {
            width: 140px; height: 140px; border-radius: 50%; background: var(--accent-amber-dim);
            border: 1px solid rgba(245, 158, 11, 0.2); position: absolute; animation: ripple 2s infinite ease-out;
        }
        @keyframes ripple {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .caller-large-avatar {
            width: 108px; height: 108px; border-radius: 50%; background: #18181b;
            border: 2px solid var(--accent-amber); display: flex; align-items: center;
            justify-content: center; font-size: 36px; font-weight: 700; color: var(--accent-amber);
            position: relative; z-index: 2; box-shadow: 0 0 30px var(--accent-amber-glow);
        }

        .subtitles-box {
            background: var(--surface-card); border: 1px solid var(--border-graphite);
            border-radius: 14px; padding: 14px; min-height: 70px; display: flex;
            flex-direction: column; justify-content: center; gap: 4px; font-size: 13px; text-align: center;
        }
        .sub-text { color: var(--online-green); font-weight: 600; }

        .call-controls-row { display: flex; align-items: center; justify-content: space-around; }
        .ctrl-btn-circle {
            width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--border-graphite);
            background: var(--surface-card); color: var(--text-primary); font-size: 18px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .ctrl-btn-circle.active { background: var(--accent-amber); color: #000; border-color: var(--accent-amber); }
        .ctrl-btn-circle.muted-state { background: var(--text-primary); color: #000; }
        .ctrl-btn-circle.hangup { background: var(--danger-red); border-color: var(--danger-red); color: white; }

        /* IN-CALL SLIDE-UP CHAT DRAWER */
        .in-call-chat-drawer {
            position: absolute; bottom: 0; left: 0; right: 0; height: 60%;
            background: rgba(18, 18, 21, 0.96); backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-graphite); border-radius: 24px 24px 0 0;
            display: none; flex-direction: column; z-index: 150;
            animation: slideDrawer 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideDrawer { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .drawer-header {
            padding: 12px 20px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid var(--border-subtle);
        }
        .drawer-header span { font-size: 14px; font-weight: 700; color: var(--accent-amber); }
        .drawer-close-btn { background: transparent; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-viewport">
        <!-- TOP NAV -->
        <header class="top-navbar">
            <div class="brand-cluster">
                <div class="brand-title">Syncora <span>Terminal</span></div>
                <div class="status-pill">
                    <span class="dot-indicator" id="status-dot"></span>
                    <span id="conn-status">Connecting</span>
                </div>
            </div>
            <div class="nav-actions">
                <button class="icon-btn" onclick="copyInviteLink()" id="copy-btn">📋 Link</button>
            </div>
        </header>

        <!-- TABS -->
        <div class="tab-segmented-bar">
            <div class="tab-pill active" id="tab-call" onclick="switchView('call')">Voice Line</div>
            <div class="tab-pill" id="tab-chat" onclick="switchView('chat')">Chat Box</div>
        </div>

        <!-- VIEW 1: DIRECTORY / DIAL NUMBER -->
        <div class="content-view" id="view-call">
            <main class="directory-container">
                <!-- DIAL NUMBER SECTION -->
                <div class="dial-bar-card">
                    <div style="font-size: 12px; font-weight: 700; color: var(--accent-amber);">DIRECT PHONE CALL / SMS LINE</div>
                    <div class="dial-input-row">
                        <input type="tel" id="target-phone" class="dial-input" placeholder="Enter Phone (e.g. 03001234567)">
                        <button class="btn-set-target" onclick="switchTargetNumber()">Connect</button>
                    </div>
                    <a id="wa-invite-link" href="#" target="_blank" class="quick-wa-btn">💬 Send Invite Link on WhatsApp</a>
                </div>

                <div class="section-label">Active Connection Target</div>

                <div class="contact-card">
                    <div class="user-identity">
                        <div class="avatar-box" id="active-avatar-initials">#</div>
                        <div class="user-meta">
                            <div class="contact-name" id="active-line-title">Direct Partner</div>
                            <div class="contact-sub" id="room-sub">Line: Initializing...</div>
                        </div>
                    </div>
                    <button class="call-trigger-btn" onclick="initiateCall()" title="Call Now">📞</button>
                </div>
            </main>
        </div>

        <!-- VIEW 2: FULL CHAT VIEW WITH PERSISTENT INBOX -->
        <div class="content-view chat-view-container" id="view-chat">
            <div class="chat-messages-area" id="main-chat-msgs"></div>
            <div class="chat-input-bar">
                <input type="text" class="chat-input" id="main-chat-input" placeholder="Leave a message for this number..." onkeypress="handleEnter(event, 'main')">
                <button class="chat-send-btn" onclick="sendChatMessage('main')">➤</button>
            </div>
        </div>

        <!-- INCOMING CALL MODAL -->
        <div class="incoming-modal-backdrop" id="incoming-modal">
            <div class="incoming-dialog">
                <div class="incoming-avatar" id="incoming-caller-avatar">📞</div>
                <h3 style="font-size: 20px; margin-bottom: 6px;">Incoming Call...</h3>
                <p style="font-size: 13px; color: var(--text-secondary);" id="incoming-line-label">Direct Voice Channel</p>
                <div class="incoming-actions">
                    <button class="btn-call-action btn-decline" onclick="declineCall()">Decline</button>
                    <button class="btn-call-action btn-accept" onclick="acceptCall()">Accept</button>
                </div>
            </div>
        </div>

        <!-- ACTIVE CALL OVERLAY -->
        <section class="call-screen-overlay" id="call-screen">
            <div class="call-header">
                <div class="security-badge">🔒 Direct Line Active</div>
                <div class="caller-title" id="call-status-label">Direct Partner</div>
                <div class="call-duration" id="call-timer">00:00</div>
            </div>

            <div class="call-stage-center">
                <div class="pulse-wave-ring"></div>
                <div class="caller-large-avatar" id="active-call-avatar">#</div>
            </div>

            <div class="subtitles-box">
                <div class="sub-text" id="sub-caption">Connecting audio...</div>
            </div>

            <div class="call-controls-row">
                <button class="ctrl-btn-circle" id="mute-btn" onclick="toggleMute()" title="Mute Mic">🎙️</button>
                <button class="ctrl-btn-circle" id="speaker-btn" onclick="toggleSpeaker()" title="Loudspeaker">🔊</button>
                <button class="ctrl-btn-circle" onclick="toggleCallDrawer()" title="In-Call Chat">💬</button>
                <button class="ctrl-btn-circle hangup" onclick="endCall(true)" title="End Call">🛑</button>
            </div>

            <!-- IN-CALL CHAT DRAWER -->
            <div class="in-call-chat-drawer" id="call-drawer">
                <div class="drawer-header">
                    <span>Live In-Call Chat</span>
                    <button class="drawer-close-btn" onclick="toggleCallDrawer()">✕</button>
                </div>
                <div class="chat-messages-area" id="drawer-chat-msgs"></div>
                <div class="chat-input-bar">
                    <input type="text" class="chat-input" id="drawer-chat-input" placeholder="Type inside call..." onkeypress="handleEnter(event, 'drawer')">
                    <button class="chat-send-btn" onclick="sendChatMessage('drawer')">➤</button>
                </div>
            </div>
        </section>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let phoneParam = urlParams.get('phone');
        let currentRoom = phoneParam ? ('num-' + phoneParam.replace(/[^0-9]/g, '')) : (urlParams.get('room') || ('call-' + Math.random().toString(36).substring(2, 7)));

        if (!phoneParam && !urlParams.get('room')) {
            window.history.replaceState(null, '', window.location.pathname + '?room=' + currentRoom);
        }

        const myId = "usr-" + Math.random().toString(36).substring(2, 8);
        let socket = null;
        let audioContext = null;
        let mediaStream = null;
        let scriptNode = null;
        let isCallActive = false;
        let isMuted = false;
        let isSpeakerOn = false;
        let timerInterval = null;
        let elapsedSeconds = 0;
        let playbackTime = 0;
        let ringInterval = null;
        let gainNode = null;

        function updateUIForCurrentRoom() {
            document.getElementById("room-sub").innerText = `Target Line: ${currentRoom}`;
            const targetPhoneInput = document.getElementById("target-phone");
            if (phoneParam) {
                targetPhoneInput.value = phoneParam;
                document.getElementById("active-line-title").innerText = `Phone: ${phoneParam}`;
                document.getElementById("active-avatar-initials").innerText = phoneParam.slice(-2);
                document.getElementById("active-call-avatar").innerText = phoneParam.slice(-2);
            } else {
                document.getElementById("active-avatar-initials").innerText = "P2";
                document.getElementById("active-call-avatar").innerText = "P2";
            }

            // Setup WhatsApp invite link
            const shareUrl = window.location.origin + window.location.pathname + `?phone=${encodeURIComponent(targetPhoneInput.value || 'partner')}`;
            const waText = encodeURIComponent(`Assalam o Alaikum! Please click this secure link to join my direct voice call and message line on Syncora: ${shareUrl}`);
            document.getElementById("wa-invite-link").href = `https://api.whatsapp.com/send?phone=${encodeURIComponent(targetPhoneInput.value)}&text=${waText}`;
        }

        function switchTargetNumber() {
            const num = document.getElementById("target-phone").value.trim();
            if (!num) return;
            const cleanNum = num.replace(/[^0-9]/g, '');
            window.location.href = `${window.location.pathname}?phone=${cleanNum}`;
        }

        function copyInviteLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const btn = document.getElementById("copy-btn");
                btn.innerText = "✅ Done";
                setTimeout(() => { btn.innerText = "📋 Link"; }, 1500);
            });
        }

        function switchView(view) {
            document.getElementById("tab-call").classList.toggle("active", view === 'call');
            document.getElementById("tab-chat").classList.toggle("active", view === 'chat');
            document.getElementById("view-call").style.display = (view === 'call') ? 'flex' : 'none';
            document.getElementById("view-chat").style.display = (view === 'chat') ? 'flex' : 'none';
        }

        // --- FETCH SAVED OFFLINE MESSAGES ---
        async function fetchOfflineHistory() {
            try {
                const res = await fetch(`/messages/${currentRoom}`);
                const data = await res.json();
                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(msg => {
                        const type = (msg.sender === myId) ? 'sent' : 'received';
                        appendChatMessage(msg.text, type, msg.time);
                    });
                }
            } catch (e) {
                console.log("No previous messages:", e);
            }
        }

        // --- RINGTONE & VIBRATION ---
        function startIncomingRingtone() {
            stopIncomingRingtone();
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            const ringCtx = new AudioCtx();

            function playBeep() {
                if (!document.getElementById("incoming-modal").style.display || document.getElementById("incoming-modal").style.display === "none") return;
                const osc1 = ringCtx.createOscillator();
                const osc2 = ringCtx.createOscillator();
                const gain = ringCtx.createGain();

                osc1.type = "sine"; osc2.type = "sine";
                osc1.frequency.setValueAtTime(440, ringCtx.currentTime);
                osc2.frequency.setValueAtTime(480, ringCtx.currentTime);

                gain.gain.setValueAtTime(0.3, ringCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ringCtx.currentTime + 1.8);

                osc1.connect(gain); osc2.connect(gain); gain.connect(ringCtx.destination);
                osc1.start(); osc2.start();
                osc1.stop(ringCtx.currentTime + 1.8); osc2.stop(ringCtx.currentTime + 1.8);

                if (navigator.vibrate) navigator.vibrate([400, 200, 400, 1000]);
            }
            playBeep();
            ringInterval = setInterval(playBeep, 3000);
        }

        function stopIncomingRingtone() {
            if (ringInterval) { clearInterval(ringInterval); ringInterval = null; }
            if (navigator.vibrate) navigator.vibrate(0);
        }

        function initSocket() {
            const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
            socket = new WebSocket(`${wsProtocol}${window.location.host}/ws/${currentRoom}`);
            socket.binaryType = "arraybuffer";

            socket.onopen = () => {
                document.getElementById("status-dot").classList.add("live");
                document.getElementById("conn-status").innerText = "Online";
            };

            socket.onmessage = (event) => {
                if (typeof event.data === "string") {
                    const data = JSON.parse(event.data);
                    if (data.type === "call_invite") {
                        document.getElementById("incoming-modal").style.display = "flex";
                        startIncomingRingtone();
                    } else if (data.type === "call_accepted") {
                        stopIncomingRingtone();
                        document.getElementById("sub-caption").innerText = "Call Connected • Speak Naturally";
                        startCallTimer();
                        startContinuousAudioCapture();
                    } else if (data.type === "call_declined" || data.type === "call_ended") {
                        stopIncomingRingtone();
                        endCall(false);
                    } else if (data.type === "text_message") {
                        appendChatMessage(data.text, 'received', data.time);
                    }
                } else if (event.data instanceof ArrayBuffer) {
                    playRawAudio(event.data);
                }
            };

            socket.onclose = () => {
                document.getElementById("status-dot").classList.remove("live");
                document.getElementById("conn-status").innerText = "Offline";
                setTimeout(initSocket, 1500);
            };
        }

        // --- CHAT MESSAGING ---
        function sendChatMessage(source) {
            const inputEl = document.getElementById(source === 'drawer' ? "drawer-chat-input" : "main-chat-input");
            const text = inputEl.value.trim();
            if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            socket.send(JSON.stringify({
                type: "text_message",
                text: text,
                sender: myId,
                time: timeStr
            }));

            appendChatMessage(text, 'sent', timeStr);
            inputEl.value = "";
        }

        function handleEnter(e, source) {
            if (e.key === 'Enter') sendChatMessage(source);
        }

        function appendChatMessage(text, type, timeStr = "") {
            const createBubble = () => {
                const bubble = document.createElement("div");
                bubble.className = `chat-bubble ${type}`;
                bubble.innerHTML = `<div>${text}</div><div class="chat-time">${timeStr || 'now'}</div>`;
                return bubble;
            };

            const mainBox = document.getElementById("main-chat-msgs");
            const drawerBox = document.getElementById("drawer-chat-msgs");

            mainBox.appendChild(createBubble());
            drawerBox.appendChild(createBubble());

            mainBox.scrollTop = mainBox.scrollHeight;
            drawerBox.scrollTop = drawerBox.scrollHeight;
        }

        function toggleCallDrawer() {
            const drawer = document.getElementById("call-drawer");
            drawer.style.display = (drawer.style.display === "flex") ? "none" : "flex";
        }

        // --- AUDIO ENGINE ---
        async function ensureAudioContext() {
            if (!audioContext || audioContext.state === "closed") {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioCtx({ sampleRate: 16000 });
                gainNode = audioContext.createGain();
                gainNode.gain.value = 1.0;
                gainNode.connect(audioContext.destination);
            }
            if (audioContext.state === "suspended") await audioContext.resume();
        }

        async function startContinuousAudioCapture() {
            await ensureAudioContext();
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
                    video: false
                });

                const source = audioContext.createMediaStreamSource(mediaStream);
                scriptNode = audioContext.createScriptProcessor(4096, 1, 1);

                scriptNode.onaudioprocess = (e) => {
                    if (!isCallActive || isMuted || !socket || socket.readyState !== WebSocket.OPEN) return;
                    const channelData = e.inputBuffer.getChannelData(0);
                    const pcmData = new Int16Array(channelData.length);
                    for (let i = 0; i < channelData.length; i++) {
                        const s = Math.max(-1, Math.min(1, channelData[i]));
                        pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    socket.send(pcmData.buffer);
                };

                source.connect(scriptNode);
                const silentGain = audioContext.createGain();
                silentGain.gain.value = 0;
                scriptNode.connect(silentGain);
                silentGain.connect(audioContext.destination);
            } catch (err) {
                alert("Microphone required: " + err.message);
            }
        }

        function playRawAudio(arrayBuffer) {
            if (!audioContext || !isCallActive) return;
            const pcmData = new Int16Array(arrayBuffer);
            const floatData = new Float32Array(pcmData.length);
            for (let i = 0; i < pcmData.length; i++) floatData[i] = pcmData[i] / 32768.0;

            const audioBuf = audioContext.createBuffer(1, floatData.length, 16000);
            audioBuf.copyToChannel(floatData, 0);

            const source = audioContext.createBufferSource();
            source.buffer = audioBuf;
            source.connect(gainNode);

            const currentTime = audioContext.currentTime;
            if (playbackTime < currentTime) playbackTime = currentTime + 0.04;
            source.start(playbackTime);
            playbackTime += audioBuf.duration;
        }

        async function initiateCall() {
            await ensureAudioContext();
            isCallActive = true;
            document.getElementById("call-screen").style.display = "flex";
            document.getElementById("call-status-label").innerText = "Ringing...";
            document.getElementById("sub-caption").innerText = "Waiting for partner to answer...";

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: "call_invite" }));
            }
        }

        async function acceptCall() {
            stopIncomingRingtone();
            await ensureAudioContext();
            document.getElementById("incoming-modal").style.display = "none";
            isCallActive = true;
            document.getElementById("call-screen").style.display = "flex";
            document.getElementById("sub-caption").innerText = "Call Connected • Speak Naturally";

            startCallTimer();
            startContinuousAudioCapture();

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: "call_accepted" }));
            }
        }

        function declineCall() {
            stopIncomingRingtone();
            document.getElementById("incoming-modal").style.display = "none";
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: "call_declined" }));
            }
        }

        function startCallTimer() {
            elapsedSeconds = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                elapsedSeconds++;
                const mins = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
                const secs = String(elapsedSeconds % 60).padStart(2, '0');
                document.getElementById("call-timer").innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function endCall(sendSignal = true) {
            stopIncomingRingtone();
            isCallActive = false;
            clearInterval(timerInterval);
            document.getElementById("call-timer").innerText = "00:00";

            if (scriptNode) { scriptNode.disconnect(); scriptNode = null; }
            if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }

            playbackTime = 0;
            document.getElementById("incoming-modal").style.display = "none";
            document.getElementById("call-screen").style.display = "none";
            document.getElementById("call-drawer").style.display = "none";

            if (sendSignal && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: "call_ended" }));
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            const btn = document.getElementById("mute-btn");
            btn.classList.toggle("muted-state", isMuted);
            btn.innerText = isMuted ? "🔇" : "🎙️";
        }

        function toggleSpeaker() {
            isSpeakerOn = !isSpeakerOn;
            const btn = document.getElementById("speaker-btn");
            btn.classList.toggle("active", isSpeakerOn);
            if (gainNode) gainNode.gain.value = isSpeakerOn ? 2.5 : 1.0;
        }

        window.onload = () => {
            updateUIForCurrentRoom();
            initSocket();
            fetchOfflineHistory();
        };
    </script>
</body>
</html>
