<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Syncora - Audio Call & Realtime Translation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Auth Screen */
        #auth-overlay { position: fixed; inset: 0; background: #0f172a; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        .auth-card h2 { margin-bottom: 20px; color: #38bdf8; }
        .input-box { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 15px; font-size: 16px; }
        .btn-primary { width: 100%; padding: 14px; border-radius: 10px; background: #2563eb; color: white; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-primary:active { background: #1d4ed8; }

        /* Main App Header */
        header { background: #1e293b; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
        .header-title { font-weight: 700; color: #38bdf8; font-size: 18px; }
        .user-badge { font-size: 13px; color: #22c55e; }

        /* App Layout */
        .container { flex: 1; display: flex; height: calc(100vh - 60px); }
        .sidebar { width: 280px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
        .chat-section { flex: 1; display: flex; flex-direction: column; background: #090d16; }

        /* Chat List */
        .contact-item { padding: 14px; border-bottom: 1px solid #334155; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .contact-item.active { background: #334155; font-weight: bold; }
        
        /* Chat Header & Calling */
        .chat-header { padding: 12px 16px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .call-btn { background: #16a34a; border: none; color: white; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .call-btn:active { background: #15803d; }

        /* Messages Area */
        .messages-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg-bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; word-break: break-word; }
        .msg-mine { align-self: flex-end; background: #2563eb; color: white; border-bottom-right-radius: 2px; }
        .msg-partner { align-self: flex-start; background: #334155; color: white; border-bottom-left-radius: 2px; }
        .msg-trans { font-size: 12px; color: #fde047; margin-top: 4px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 4px; }

        /* Input Controls */
        .chat-input-bar { padding: 12px; background: #1e293b; display: flex; align-items: center; gap: 8px; border-top: 1px solid #334155; }
        .chat-input-bar input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; }
        .icon-btn { background: #334155; border: none; color: white; width: 42px; height: 42px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .icon-btn.recording { background: #dc2626; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Call Modal */
        #call-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .call-card { background: #1e293b; padding: 30px; border-radius: 20px; width: 100%; max-width: 380px; text-align: center; border: 1px solid #475569; }
        .call-status { font-size: 18px; margin: 15px 0; color: #38bdf8; }
        .subtitles-box { min-height: 80px; background: #0f172a; border-radius: 12px; padding: 12px; font-size: 15px; color: #fde047; margin: 15px 0; border: 1px dashed #475569; }
        .call-actions { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .end-call-btn { background: #dc2626; border: none; color: white; padding: 12px 24px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Authentication Modal -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2>Syncora Login</h2>
            <input type="tel" id="login-phone" class="input-box" placeholder="Mobile Number (e.g. 03001234567)">
            <button class="btn-primary" onclick="handleLogin()">Login / Start</button>
        </div>
    </div>

    <!-- Top Header -->
    <header>
        <div class="header-title">Syncora Calling & Translation</div>
        <div id="user-display" class="user-badge">Not Connected</div>
    </header>

    <!-- Main Workspace -->
    <div class="container">
        <!-- Sidebar Contacts -->
        <div class="sidebar">
            <div style="padding: 12px; border-bottom: 1px solid #334155;">
                <input type="tel" id="new-contact-phone" class="input-box" style="margin-bottom:8px;" placeholder="Add Friend Phone">
                <button class="btn-primary" style="padding: 8px;" onclick="handleAddContact()">+ Add Chat</button>
            </div>
            <div id="contacts-list" style="overflow-y: auto; flex: 1;"></div>
        </div>

        <!-- Chat & Call Window -->
        <div class="chat-section">
            <div class="chat-header">
                <div>
                    <h3 id="active-chat-title" style="color: white;">Select a chat</h3>
                    <small id="chat-partner-status" style="color: #94a3b8;"></small>
                </div>
                <div style="display:flex; gap:10px; align-items:center;">
                    <select id="target-lang" style="background:#0f172a; color:#fde047; padding:6px 10px; border-radius:8px; border:1px solid #334155;">
                        <option value="en">Translate to English</option>
                        <option value="ur">Translate to Urdu</option>
                        <option value="hi">Translate to Hindi</option>
                        <option value="ar">Translate to Arabic</option>
                    </select>
                    <button class="call-btn" onclick="startAudioCall()">📞 Call</button>
                </div>
            </div>

            <!-- Messages Window -->
            <div id="messages-container" class="messages-container"></div>

            <!-- Input Bar -->
            <div class="chat-input-bar">
                <input type="text" id="text-msg-input" placeholder="Type message in Urdu, Roman Urdu or English..." onkeypress="if(event.key==='Enter') sendTextMessage()">
                <button class="icon-btn" onclick="sendTextMessage()">➤</button>
                <button id="voice-record-btn" class="icon-btn" onclick="toggleVoiceRecording()">🎤</button>
            </div>
        </div>
    </div>

    <!-- Audio Call Overlay with Live Translation -->
    <div id="call-modal">
        <div class="call-card">
            <h2 id="modal-partner-name">Audio Call</h2>
            <div id="modal-call-status" class="call-status">Connecting...</div>
            <div style="font-size:13px; color:#94a3b8; margin-bottom:5px;">Live Call Translation Subtitles:</div>
            <div id="modal-subtitles" class="subtitles-box">Speak to see real-time translated subtitles...</div>
            <div class="call-actions">
                <button id="accept-call-btn" class="call-btn" style="display:none;" onclick="acceptIncomingCall()">Accept</button>
                <button class="end-call-btn" onclick="endCall(true)">End Call</button>
            </div>
        </div>
    </div>

    <!-- Hidden audio element for WebRTC Remote Stream -->
    <audio id="remote-audio-sink" autoplay playsinline></audio>

    <script>
        let myPhone = localStorage.getItem("syncora_user_phone") || "";
        let activePartner = "";
        let socket = null;
        let peerConnection = null;
        let localStream = null;
        let callSpeechRec = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecordingVoice = false;
        let pendingOfferData = null;

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // موبائل آڈیو انلاکنگ
        function unlockMobileAudio() {
            try {
                if ('speechSynthesis' in window) {
                    const ut = new SpeechSynthesisUtterance(' ');
                    ut.volume = 0.01;
                    window.speechSynthesis.speak(ut);
                }
                const sink = document.getElementById("remote-audio-sink");
                if (sink) { sink.play().catch(() => {}); }
            } catch (e) {}
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const invitePhone = urlParams.get('chat') || urlParams.get('invite');
            if (myPhone) {
                document.getElementById("auth-overlay").style.display = "none";
                document.getElementById("user-display").innerText = `● ${myPhone}`;
                initSocket();
                loadChats();
                if (invitePhone && invitePhone !== myPhone) {
                    addContact(invitePhone);
                }
            }
        };

        async function handleLogin() {
            unlockMobileAudio();
            const phone = document.getElementById("login-phone").value.trim();
            if (!phone || phone.length < 5) {
                alert("Please valid phone number enter karein");
                return;
            }
            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone: phone })
                });
                const data = await res.json();
                if (data.status === "ok") {
                    myPhone = phone;
                    localStorage.setItem("syncora_user_phone", myPhone);
                    document.getElementById("auth-overlay").style.display = "none";
                    document.getElementById("user-display").innerText = `● ${myPhone}`;
                    initSocket();
                    loadChats();
                }
            } catch (err) {
                alert("Login Error: " + err.message);
            }
        }

        function initSocket() {
            const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
            socket = new WebSocket(`${proto}//${window.location.host}/ws/${myPhone}`);

            socket.onmessage = async (e) => {
                const data = JSON.parse(e.data);
                
                // 1. چیٹ میسج موصول ہونا
                if (data.type === "chat_message") {
                    if (data.sender === activePartner || data.receiver === activePartner) {
                        appendMessageUI(data);
                    }
                }
                // 2. کال انویٹیشن موصول ہونا
                else if (data.type === "call_invite") {
                    handleIncomingCall(data.from);
                }
                // 3. کال ایکسیپٹ ہونا
                else if (data.type === "call_accept") {
                    document.getElementById("modal-call-status").innerText = "Call Connected";
                    startWebRTCOffer(data.from);
                    startCallSpeechRecognition();
                }
                // 4. کال ختم ہونا
                else if (data.type === "call_end" || data.type === "call_reject") {
                    endCall(false);
                }
                // 5. WebRTC Offer
                else if (data.type === "webrtc_offer") {
                    handleRemoteOffer(data.offer, data.from);
                }
                // 6. WebRTC Answer
                else if (data.type === "webrtc_answer") {
                    if (peerConnection) {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                    }
                }
                // 7. ICE Candidate
                else if (data.type === "ice_candidate") {
                    if (peerConnection && peerConnection.remoteDescription) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                    }
                }
                // 8. لائیو کال سب ٹائٹلز
                else if (data.type === "call_subtitles") {
                    const subBox = document.getElementById("modal-subtitles");
                    subBox.innerHTML = `<strong>${data.from}:</strong> ${data.original_text}<br><span style="color:#67e8f9;">↳ ${data.translated_text}</span>`;
                    
                    // خودکار آواز میں ترجمہ سنانا
                    if (data.from !== myPhone && 'speechSynthesis' in window) {
                        const ut = new SpeechSynthesisUtterance(data.translated_text);
                        ut.lang = data.target_lang;
                        window.speechSynthesis.speak(ut);
                    }
                }
            };

            socket.onclose = () => {
                setTimeout(initSocket, 3000);
            };
        }

        async function loadChats() {
            try {
                const res = await fetch(`/api/chats/${myPhone}`);
                const data = await res.json();
                const list = document.getElementById("contacts-list");
                list.innerHTML = "";
                data.chats.forEach(p => {
                    const div = document.createElement("div");
                    div.className = `contact-item ${p === activePartner ? 'active' : ''}`;
                    div.innerText = p;
                    div.onclick = () => selectPartner(p);
                    list.appendChild(div);
                });
                if (!activePartner && data.chats.length > 0) {
                    selectPartner(data.chats[0]);
                }
            } catch (e) {}
        }

        function selectPartner(partner) {
            activePartner = partner;
            document.getElementById("active-chat-title").innerText = partner;
            loadChats();
            loadMessages();
        }

        async function handleAddContact() {
            const input = document.getElementById("new-contact-phone");
            const phone = input.value.trim();
            if (phone) {
                await addContact(phone);
                input.value = "";
            }
        }

        async function addContact(phone) {
            await fetch("/api/contacts/add", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_phone: myPhone, contact_phone: phone })
            });
            await loadChats();
            selectPartner(phone);
        }

        async function loadMessages() {
            if (!activePartner) return;
            const res = await fetch(`/api/messages/${myPhone}/${activePartner}`);
            const data = await res.json();
            const container = document.getElementById("messages-container");
            container.innerHTML = "";
            data.messages.forEach(appendMessageUI);
        }

        function appendMessageUI(msg) {
            const container = document.getElementById("messages-container");
            const isMine = msg.sender === myPhone;
            const div = document.createElement("div");
            div.className = `msg-bubble ${isMine ? 'msg-mine' : 'msg-partner'}`;

            let bodyHtml = "";
            if (msg.msg_type === "voice") {
                bodyHtml = `<audio controls src="${msg.content}" style="max-width:200px; height:32px;"></audio>`;
            } else {
                bodyHtml = `<div>${msg.content}</div>`;
            }

            if (msg.translated_content && msg.translated_content !== msg.content) {
                bodyHtml += `<div class="msg-trans">↳ ${msg.translated_content}</div>`;
            }

            div.innerHTML = bodyHtml;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // ٹیکسٹ میسج ترجمے کے ساتھ بھیجنا
        function sendTextMessage() {
            const input = document.getElementById("text-msg-input");
            const text = input.value.trim();
            if (!text || !activePartner) return;
            const targetLang = document.getElementById("target-lang").value;

            socket.send(JSON.stringify({
                type: "chat_message",
                to: activePartner,
                msg_type: "text",
                content: text,
                target_lang: targetLang
            }));
            input.value = "";
        }

        // وائس نوٹ ریکارڈ اور ٹرانسلیٹ کرنا
        async function toggleVoiceRecording() {
            unlockMobileAudio();
            const btn = document.getElementById("voice-record-btn");
            if (!isRecordingVoice) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const blob = new Blob(audioChunks, { type: "audio/webm" });
                        const file = new File([blob], "voice.webm", { type: "audio/webm" });
                        const fd = new FormData();
                        fd.append("file", file);
                        
                        const upRes = await fetch("/api/upload", { method: "POST", body: fd });
                        const upData = await upRes.json();
                        
                        // وائس میسج کا ترجمہ حاصل کرنا
                        const targetLang = document.getElementById("target-lang").value;
                        const transRes = await fetch("/api/translate/voice", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ audio_url: upData.url, target_lang: targetLang })
                        });
                        const transData = await transRes.json();

                        socket.send(JSON.stringify({
                            type: "chat_message",
                            to: activePartner,
                            msg_type: "voice",
                            content: upData.url,
                            translated_content: transData.translated_text || transData.transcript,
                            target_lang: targetLang
                        }));
                    };
                    mediaRecorder.start();
                    isRecordingVoice = true;
                    btn.classList.add("recording");
                } catch (e) {
                    alert("Microphone permission required: " + e.message);
                }
            } else {
                mediaRecorder.stop();
                isRecordingVoice = false;
                btn.classList.remove("recording");
            }
        }

        // کال ہینڈلنگ اور WebRTC
        async function startAudioCall() {
            unlockMobileAudio();
            if (!activePartner) return;
            document.getElementById("call-modal").style.display = "flex";
            document.getElementById("modal-partner-name").innerText = `Calling ${activePartner}...`;
            document.getElementById("modal-call-status").innerText = "Ringing...";
            document.getElementById("accept-call-btn").style.display = "none";

            socket.send(JSON.stringify({
                type: "call_invite",
                to: activePartner
            }));
        }

        function handleIncomingCall(caller) {
            unlockMobileAudio();
            activePartner = caller;
            document.getElementById("call-modal").style.display = "flex";
            document.getElementById("modal-partner-name").innerText = `Incoming Call: ${caller}`;
            document.getElementById("modal-call-status").innerText = "Ringing...";
            document.getElementById("accept-call-btn").style.display = "inline-block";
        }

        async function acceptIncomingCall() {
            unlockMobileAudio();
            document.getElementById("accept-call-btn").style.display = "none";
            document.getElementById("modal-call-status").innerText = "Connecting...";

            socket.send(JSON.stringify({
                type: "call_accept",
                to: activePartner
            }));

            startCallSpeechRecognition();
        }

        async function setupWebRTC() {
            if (peerConnection) return peerConnection;
            peerConnection = new RTCPeerConnection(rtcConfig);
            
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                const sink = document.getElementById("remote-audio-sink");
                if (sink.srcObject !== event.streams[0]) {
                    sink.srcObject = event.streams[0];
                    sink.play().catch(() => {});
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && socket) {
                    socket.send(JSON.stringify({
                        type: "ice_candidate",
                        to: activePartner,
                        candidate: event.candidate
                    }));
                }
            };

            return peerConnection;
        }

        async function startWebRTCOffer(targetPhone) {
            const pc = await setupWebRTC();
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            socket.send(JSON.stringify({
                type: "webrtc_offer",
                to: targetPhone,
                offer: offer
            }));
        }

        async function handleRemoteOffer(offer, fromPhone) {
            const pc = await setupWebRTC();
            await pc.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            socket.send(JSON.stringify({
                type: "webrtc_answer",
                to: fromPhone,
                answer: answer
            }));
        }

        // کال کے دوران لائیو ٹرانسلیشن کی سپیچ ریکگنیشن
        function startCallSpeechRecognition() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) return;

            callSpeechRec = new SpeechRec();
            callSpeechRec.continuous = true;
            callSpeechRec.interimResults = false;
            callSpeechRec.lang = "ur-PK"; // اردو اور رومن بول چال

            callSpeechRec.onresult = (e) => {
                const last = e.results.length - 1;
                const transcript = e.results[last][0].transcript.trim();
                const targetLang = document.getElementById("target-lang").value;
                if (transcript && socket) {
                    socket.send(JSON.stringify({
                        type: "call_speech_transcript",
                        to: activePartner,
                        text: transcript,
                        target_lang: targetLang
                    }));
                }
            };

            callSpeechRec.onerror = () => {};
            callSpeechRec.onend = () => {
                if (peerConnection) {
                    try { callSpeechRec.start(); } catch(e) {}
                }
            };

            try { callSpeechRec.start(); } catch(e) {}
        }

        function endCall(notify) {
            if (notify && socket && activePartner) {
                socket.send(JSON.stringify({ type: "call_end", to: activePartner }));
            }
            if (callSpeechRec) {
                try { callSpeechRec.stop(); } catch(e) {}
                callSpeechRec = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            document.getElementById("call-modal").style.display = "none";
            document.getElementById("modal-subtitles").innerText = "Speak to see real-time translated subtitles...";
        }
    </script>
</body>
</html>
