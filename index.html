<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncora - Direct Line Web</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        .app-container { width: 100vw; height: 100vh; background-color: #111827; display: flex; flex-direction: column; }
        @media (min-width: 768px) {
            .app-container { width: 95vw; height: 92vh; max-width: 1400px; border-radius: 12px; border: 1px solid #1f2937; box-shadow: 0 15px 40px rgba(0,0,0,0.8); flex-direction: row; overflow: hidden; }
        }

        .screen { display: flex; flex-direction: column; height: 100%; width: 100%; }
        .hidden { display: none !important; }

        /* Auth Screen */
        .auth-wrapper { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; background: #0b0f19; }
        .auth-content { padding: 40px; background: #111827; border: 1px solid #1f2937; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .auth-content h1 { color: #f59e0b; margin-bottom: 8px; font-size: 32px; font-weight: bold; }
        .auth-content p { color: #9ca3af; margin-bottom: 24px; font-size: 14px; }
        .input-field { width: 100%; padding: 14px 16px; background-color: #1f2937; border: 1px solid #374151; border-radius: 10px; color: #fff; font-size: 16px; margin-bottom: 16px; outline: none; }
        .input-field:focus { border-color: #f59e0b; }
        .btn { width: 100%; padding: 14px; background-color: #f59e0b; color: #000; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background-color: #d97706; }

        /* WhatsApp Style Web Layout */
        .whatsapp-layout { display: flex; width: 100%; height: 100%; background-color: #0b0f19; }
        
        /* Left Sidebar (Chats List) */
        .sidebar { width: 100%; background-color: #111827; border-right: 1px solid #1f2937; display: flex; flex-direction: column; }
        @media (min-width: 768px) {
            .sidebar { width: 350px; min-width: 320px; }
        }
        .sidebar-header { padding: 16px; background-color: #1f2937; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #374151; }
        .sidebar-header .user-profile { display: flex; align-items: center; gap: 10px; }
        .sidebar-search { padding: 12px; background-color: #111827; border-bottom: 1px solid #1f2937; display: flex; gap: 8px; }
        .sidebar-search input { flex: 1; margin: 0; padding: 10px 14px; font-size: 14px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; outline: none; }
        .sidebar-search button { width: auto; padding: 0 16px; background: #f59e0b; color: #000; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        
        .chats-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 14px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1f2937; cursor: pointer; transition: background 0.2s; }
        .chat-item:hover, .chat-item.active { background-color: #1f2937; }
        .chat-item-info h4 { font-size: 15px; color: #fff; margin-bottom: 4px; }
        .chat-item-info p { font-size: 13px; color: #9ca3af; }

        /* Right Main Chat Area */
        .chat-main { flex: 1; display: flex; flex-direction: column; background-color: #000000; height: 100%; }
        
        /* Chat Header */
        .chat-header { padding: 12px 20px; background-color: #121212; border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: space-between; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #f59e0b; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; font-size: 15px; }
        .user-details h3 { font-size: 16px; color: #fff; font-weight: 600; }
        .status-indicator { font-size: 11px; color: #10b981; margin-top: 2px; }
        
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .action-icon { width: 36px; height: 36px; border-radius: 8px; background-color: #1f2937; border: none; color: #f59e0b; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; }
        .action-icon.link-btn { width: auto; padding: 0 12px; font-size: 13px; color: #fff; gap: 6px; }

        /* Translate Bar */
        .translate-bar { padding: 10px 20px; background-color: #161e2e; border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #9ca3af; }
        .translate-bar select { background: #1f2937; color: #fff; border: 1px solid #374151; padding: 6px 10px; border-radius: 6px; font-size: 13px; outline: none; }
        .translate-bar span { color: #f59e0b; font-weight: bold; }

        /* Chat Messages */
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background-color: #0b0f19; }
        .message { max-width: 70%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .message.sent { background-color: #f59e0b; color: #000; align-self: flex-end; border-bottom-right-radius: 2px; font-weight: 500; }
        .message.received { background-color: #1f2937; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg-time { font-size: 10px; margin-top: 4px; text-align: right; opacity: 0.7; }

        /* Chat Footer */
        .chat-footer { padding: 14px 20px; background-color: #121212; border-top: 1px solid #222; display: flex; gap: 12px; align-items: center; }
        .chat-footer input { flex: 1; margin: 0; padding: 14px 20px; background-color: #1a1a1a; border: 1px solid #f59e0b; border-radius: 28px; color: #fff; font-size: 15px; outline: none; }
        .send-btn { width: 48px; height: 48px; border-radius: 50%; background-color: #f59e0b; border: none; color: #000; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: transform 0.1s; }
        .send-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- LOGIN SCREEN -->
        <div id="authScreen" class="screen auth-wrapper">
            <div class="auth-content">
                <h1>Syncora</h1>
                <p>Direct Line Secure Web Communication</p>
                <input type="text" id="phoneInput" class="input-field" placeholder="Enter Your Mobile Number">
                <button class="btn" onclick="loginUser()">Enter Direct Line</button>
            </div>
        </div>

        <!-- WHATSAPP STYLE WEB CHAT INTERFACE -->
        <div id="chatScreen" class="screen whatsapp-layout hidden">
            
            <!-- LEFT SIDEBAR -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <div class="user-profile">
                        <div class="avatar" id="myAvatar">ME</div>
                        <div>
                            <h4 id="myNameDisplay" style="color:#fff; font-size:14px;">My Profile</h4>
                            <span style="font-size:11px; color:#10b981;">Online</span>
                        </div>
                    </div>
                </div>

                <div class="sidebar-search">
                    <input type="text" id="partnerInput" placeholder="Enter Partner Number">
                    <button onclick="connectPartner()">Open</button>
                </div>

                <div class="chats-list" id="chatsListContainer">
                    <!-- Dynamic chat items will appear here -->
                </div>
            </div>

            <!-- RIGHT MAIN CHAT WINDOW -->
            <div class="chat-main">
                <!-- Header -->
                <div class="chat-header">
                    <div class="user-info">
                        <div class="avatar" id="headerAvatar">DL</div>
                        <div class="user-details">
                            <h3 id="headerTitle">Select a Chat</h3>
                            <div class="status-indicator" id="statusText">Direct Line Active</div>
                        </div>
                    </div>
                    <div class="header-actions">
                        <button class="action-icon" title="Call">📞</button>
                        <button class="action-icon" title="Video">📹</button>
                        <button class="action-icon" title="Translate">🌐</button>
                        <button class="action-icon link-btn" title="Link">📄 Link</button>
                    </div>
                </div>

                <!-- Translate Bar -->
                <div class="translate-bar">
                    <span>Translate:</span>
                    <select id="sourceLang">
                        <option value="ur">Urdu (اردو)</option>
                        <option value="en">English</option>
                    </select>
                    <span>➔</span>
                    <select id="targetLang">
                        <option value="en">English (US)</option>
                        <option value="ur">Urdu (اردو)</option>
                    </select>
                    <input type="checkbox" id="translateToggle" checked style="accent-color: #f59e0b;">
                </div>

                <!-- Messages Area -->
                <div id="msgContainer" class="chat-messages">
                    <div style="text-align: center; color: #4b5563; margin-top: auto; margin-bottom: auto;">
                        <p>No chat selected. Enter a partner number on the left to start Direct Line.</p>
                    </div>
                </div>

                <!-- Footer Input -->
                <div class="chat-footer">
                    <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMsg()">
                    <button class="send-btn" onclick="sendMsg()">➤</button>
                </div>
            </div>

        </div>

    </div>

    <script>
        let myPhone = localStorage.getItem("sync_phone") || "";
        let currentPartner = localStorage.getItem("sync_partner") || "";
        let socket = null;

        if (myPhone) {
            document.getElementById("phoneInput").value = myPhone;
            showChatScreen();
        }

        async function loginUser() {
            const phone = document.getElementById("phoneInput").value.trim();
            if (!phone) {
                alert("Please enter a valid number.");
                return;
            }

            try {
                await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone })
                });
            } catch(e) {}

            localStorage.setItem("sync_phone", phone);
            myPhone = phone;
            showChatScreen();
        }

        function showChatScreen() {
            document.getElementById("authScreen").classList.add("hidden");
            document.getElementById("chatScreen").classList.remove("hidden");
            document.getElementById("myNameDisplay").innerText = myPhone;
            document.getElementById("myAvatar").innerText = myPhone.slice(-2).toUpperCase();
            
            loadSidebarChats();
            if (currentPartner) {
                document.getElementById("partnerInput").value = currentPartner;
                loadConversation();
            }
            initWebSocket();
        }

        async function loadSidebarChats() {
            try {
                const res = await fetch(`/api/chats/${myPhone}`);
                const data = await res.json();
                const listContainer = document.getElementById("chatsListContainer");
                listContainer.innerHTML = "";

                if (data.chats && data.chats.length > 0) {
                    data.chats.forEach(partner => {
                        const div = document.createElement("div");
                        div.className = `chat-item ${partner === currentPartner ? 'active' : ''}`;
                        div.innerHTML = `
                            <div class="avatar" style="width:35px; height:35px; font-size:13px;">${partner.slice(-2).toUpperCase()}</div>
                            <div class="chat-item-info" style="flex:1;">
                                <h4 style="font-size:14px; color:#fff;">${partner}</h4>
                                <p style="font-size:12px; color:#9ca3af;">Direct Line Connected</p>
                            </div>
                        `;
                        div.onclick = () => {
                            currentPartner = partner;
                            localStorage.setItem("sync_partner", currentPartner);
                            document.getElementById("partnerInput").value = currentPartner;
                            loadSidebarChats();
                            loadConversation();
                        };
                        listContainer.appendChild(div);
                    });
                } else {
                    listContainer.innerHTML = `<div style="padding: 20px; text-align: center; color: #6b7280; font-size: 13px;">No chats yet.<br>Enter number above to start.</div>`;
                }
            } catch(e) {}
        }

        function initWebSocket() {
            const proto = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            const wsUrl = `${proto}${window.location.host}/ws/${myPhone}`;
            
            socket = new WebSocket(wsUrl);

            socket.onopen = function() {
                console.log("Direct Line Web WebSocket Connected");
            };

            socket.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.action === "new_message") {
                    loadSidebarChats();
                    if (data.sender === currentPartner || data.sender === myPhone) {
                        appendMessage(data.content, data.sender === myPhone ? 'sent' : 'received', 'Just now');
                    }
                }
            };

            socket.onclose = function() {
                setTimeout(initWebSocket, 3000);
            };
        }

        async function connectPartner() {
            const partner = document.getElementById("partnerInput").value.trim();
            if (!partner || partner === myPhone) return;
            currentPartner = partner;
            localStorage.setItem("sync_partner", currentPartner);

            try {
                await fetch('/api/contacts/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_phone: myPhone, contact_phone: currentPartner })
                });
            } catch(e) {}

            loadSidebarChats();
            loadConversation();
        }

        async function loadConversation() {
            if (!currentPartner) return;
            document.getElementById("headerTitle").innerText = currentPartner;
            document.getElementById("headerAvatar").innerText = currentPartner.slice(-2).toUpperCase();

            const res = await fetch(`/api/messages/${myPhone}/${currentPartner}`);
            const data = await res.json();
            
            const container = document.getElementById("msgContainer");
            container.innerHTML = "";
            
            if (data.messages && data.messages.length > 0) {
                data.messages.forEach(m => {
                    appendMessage(m.content, m.sender === myPhone ? 'sent' : 'received', 'Earlier');
                });
            } else {
                container.innerHTML = `<div style="text-align: center; color: #4b5563; margin: auto;"><p>Start messaging with ${currentPartner}</p></div>`;
            }
        }

        async function sendMsg() {
            const input = document.getElementById("msgInput");
            let text = input.value.trim();
            if (!text || !currentPartner || !socket) return;

            let finalContent = text;
            const isTranslateEnabled = document.getElementById("translateToggle").checked;
            
            if (isTranslateEnabled) {
                const targetLang = document.getElementById("targetLang").value;
                try {
                    const tRes = await fetch('/translate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: text, target_lang: targetLang })
                    });
                    const tData = await tRes.json();
                    if (tData.translated_text) {
                        finalContent = `${text}\n🌐 ${tData.translated_text}`;
                    }
                } catch(e) {}
            }

            const payload = {
                action: "chat_message",
                receiver: currentPartner,
                msg_type: "text",
                content: finalContent,
                lang: "en"
            };

            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(payload));
                appendMessage(finalContent, 'sent', 'Just now');
                input.value = "";
                loadSidebarChats();
            } else {
                alert("Connection reconnecting...");
            }
        }

        function appendMessage(text, type, time) {
            const container = document.getElementById("msgContainer");
            if (container.innerHTML.includes("No chat selected") || container.innerHTML.includes("Start messaging")) {
                container.innerHTML = "";
            }
            const div = document.createElement("div");
            div.className = `message ${type}`;
            div.innerHTML = `<div>${text.replace(/\n/g, '<br>')}</div><div class="msg-time">${time}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
