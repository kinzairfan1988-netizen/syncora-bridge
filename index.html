<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Syncora Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #09090b;
            --surface-card: #121215;
            --surface-hover: #18181b;
            --border-graphite: #27272a;
            --border-subtle: rgba(255, 255, 255, 0.05);
            --accent-amber: #f59e0b;
            --accent-amber-dim: rgba(245, 158, 11, 0.12);
            --accent-amber-glow: rgba(245, 158, 11, 0.25);
            --danger-red: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.25);
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --online-green: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: var(--bg-obsidian);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .app-viewport {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 920px;
            background-color: var(--bg-obsidian);
            border: 1px solid var(--border-graphite);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (max-width: 480px) {
            .app-viewport { max-height: 100vh; border: none; }
        }

        /* 1. DIRECTORY SCREEN */
        .view-directory {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .top-navbar {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(9, 9, 11, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            z-index: 10;
        }

        .brand-cluster { display: flex; align-items: center; gap: 10px; }
        .brand-title { font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700; color: var(--text-primary); }
        .brand-title span { color: var(--accent-amber); }

        .my-profile-badge {
            width: 38px; height: 38px; border-radius: 50%;
            border: 2px solid var(--accent-amber); background: #1c1c21;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; color: var(--accent-amber);
            cursor: pointer; overflow: hidden; background-size: cover; background-position: center;
            flex-shrink: 0;
        }

        .btn-add-contact {
            background: var(--accent-amber-dim);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--accent-amber);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .directory-container {
            flex: 1;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .contact-card {
            background: var(--surface-card);
            border: 1px solid var(--border-graphite);
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .contact-card:hover {
            border-color: var(--accent-amber);
            background: var(--surface-hover);
        }

        .user-identity { display: flex; align-items: center; gap: 12px; flex: 1; }
        .avatar-box {
            width: 44px; height: 44px; border-radius: 50%; background: #1c1c21;
            border: 1px solid var(--border-subtle); display: flex; align-items: center;
            justify-content: center; font-weight: 700; color: var(--accent-amber);
            text-transform: uppercase; font-size: 14px; overflow: hidden;
            background-size: cover; background-position: center; flex-shrink: 0;
        }

        .contact-name { font-size: 14px; font-weight: 700; color: var(--text-primary); }
        .contact-sub { font-size: 12px; color: var(--text-muted); font-family: 'Space Grotesk', monospace; margin-top: 2px; }

        .card-actions { display: flex; align-items: center; gap: 8px; }
        .btn-card-del {
            background: transparent; border: none; color: var(--text-muted);
            font-size: 16px; cursor: pointer; padding: 4px;
        }
        .btn-card-del:hover { color: var(--danger-red); }

        .fab-add {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 18px;
            background: var(--accent-amber);
            color: #000;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--accent-amber-glow);
            transition: all 0.2s ease;
            z-index: 20;
        }
        .fab-add:active { transform: scale(0.92); }

        /* 2. DIRECT CHAT VIEW */
        .view-chat-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-obsidian);
        }

        .chat-top-header {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(18, 18, 21, 0.96);
            border-bottom: 1px solid var(--border-graphite);
            z-index: 10;
        }

        .chat-contact-meta { display: flex; align-items: center; gap: 8px; }
        .btn-back-arrow {
            background: transparent; border: none; color: var(--text-muted);
            font-size: 20px; cursor: pointer; padding: 4px;
        }

        .chat-action-cluster { display: flex; align-items: center; gap: 6px; }
        .chat-header-btn {
            background: var(--surface-card); border: 1px solid var(--border-graphite);
            color: var(--text-primary); padding: 7px 11px; border-radius: 10px;
            font-size: 12px; font-weight: 700; display: flex; align-items: center;
            gap: 5px; cursor: pointer;
        }
        .chat-header-btn.translate-call {
            background: var(--accent-amber-dim); color: var(--accent-amber);
            border-color: rgba(245, 158, 11, 0.4);
        }

        /* MULTI-LANGUAGE BAR IN CHAT */
        .chat-translate-toggle-bar {
            padding: 8px 14px;
            background: rgba(245, 158, 11, 0.05);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            gap: 6px;
        }

        .lang-dropdown-pill {
            background: var(--surface-card);
            border: 1px solid var(--border-graphite);
            color: var(--accent-amber);
            font-size: 11px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }
        .lang-dropdown-pill option { background: #18181b; color: #fff; }

        .chat-messages-area {
            flex: 1; padding: 16px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
        }

        .chat-bubble {
            max-width: 82%; padding: 10px 14px; border-radius: 14px;
            font-size: 13px; line-height: 1.4; word-break: break-word;
        }
        .chat-bubble.sent {
            align-self: flex-end; background: var(--accent-amber);
            color: #000; font-weight: 500; border-bottom-right-radius: 4px;
        }
        .chat-bubble.received {
            align-self: flex-start; background: var(--surface-card);
            color: var(--text-primary); border: 1px solid var(--border-graphite);
            border-bottom-left-radius: 4px;
        }

        .bubble-translation {
            font-size: 11px; margin-top: 4px; padding-top: 4px;
            border-top: 1px dashed rgba(0, 0, 0, 0.2); font-style: italic;
        }
        .chat-bubble.received .bubble-translation {
            border-top-color: var(--border-graphite); color: var(--online-green);
        }
        .chat-time { font-size: 9px; opacity: 0.6; margin-top: 4px; text-align: right; }

        .chat-input-bar {
            padding: 12px 14px 18px 14px; display: flex; gap: 8px;
            background: var(--bg-obsidian); border-top: 1px solid var(--border-subtle);
        }

        .chat-input {
            flex: 1; background: var(--surface-card); border: 1px solid var(--border-graphite);
            color: var(--text-primary); border-radius: 12px; padding: 12px 14px;
            font-size: 13px; outline: none;
        }
        .chat-input:focus { border-color: var(--accent-amber); }

        .chat-send-btn {
            background: var(--accent-amber); border: none; color: #000;
            width: 44px; height: 44px; border-radius: 12px; display: flex;
            align-items: center; justify-content: center; font-size: 16px;
            font-weight: 700; cursor: pointer;
        }

        /* 3. INCOMING CALL MODAL */
        .incoming-modal-backdrop {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(14px); z-index: 200; display: none;
            flex-direction: column; align-items: center; justify-content: center; padding: 24px;
        }
        .incoming-dialog {
            background: var(--surface-card); border: 1px solid var(--accent-amber);
            border-radius: 28px; padding: 36px 24px; width: 100%; text-align: center;
            box-shadow: 0 0 50px var(--accent-amber-glow);
            animation: ringPulse 1.2s infinite ease-in-out;
        }
        @keyframes ringPulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .incoming-avatar {
            width: 90px; height: 90px; border-radius: 50%; background: #18181b;
            border: 3px solid var(--accent-amber); margin: 0 auto 16px auto;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; font-weight: 700; color: var(--accent-amber);
            box-shadow: 0 0 30px var(--accent-amber-glow); text-transform: uppercase;
            overflow: hidden; background-size: cover; background-position: center;
        }
        .incoming-actions { display: flex; gap: 16px; margin-top: 28px; }
        .btn-call-action {
            flex: 1; padding: 14px 0; border-radius: 14px; font-size: 14px;
            font-weight: 700; border: none; cursor: pointer;
        }
        .btn-accept { background: var(--online-green); color: white; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .btn-decline { background: var(--danger-red); color: white; box-shadow: 0 0 15px var(--danger-glow); }

        /* 4. ACTIVE CALL OVERLAY */
        .call-screen-overlay {
            position: absolute; inset: 0; background: var(--bg-obsidian); z-index: 100;
            display: none; flex-direction: column; justify-content: space-between; padding: 24px 20px;
        }
        .call-header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }

        .call-lang-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface-card);
            border: 1px solid var(--border-graphite);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .caller-title { font-size: 22px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
        .call-duration { font-size: 14px; font-weight: 600; color: var(--accent-amber); font-variant-numeric: tabular-nums; }

        .call-stage-center {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; position: relative; margin: 10px 0;
        }
        .pulse-wave-ring {
            width: 140px; height: 140px; border-radius: 50%; background: var(--accent-amber-dim);
            border: 1px solid rgba(245, 158, 11, 0.2); position: absolute; animation: ripple 2s infinite ease-out;
        }
        @keyframes ripple { 0% { transform: scale(0.9); opacity: 0.8; } 100% { transform: scale(1.4); opacity: 0; } }

        .caller-large-avatar {
            width: 114px; height: 114px; border-radius: 50%; background: #18181b;
            border: 2px solid var(--accent-amber); display: flex; align-items: center;
            justify-content: center; font-size: 38px; font-weight: 700; color: var(--accent-amber);
            position: relative; z-index: 2; box-shadow: 0 0 30px var(--accent-amber-glow);
            text-transform: uppercase; overflow: hidden; background-size: cover; background-position: center;
        }

        .subtitles-box {
            background: var(--surface-card); border: 1px solid var(--border-graphite);
            border-radius: 14px; padding: 12px 14px; min-height: 80px; display: flex;
            flex-direction: column; justify-content: center; gap: 4px; text-align: center;
        }
        .sub-original { font-size: 11px; color: var(--text-muted); }
        .sub-translated { font-size: 14px; color: var(--online-green); font-weight: 600; }

        .call-controls-row { display: flex; align-items: center; justify-content: space-around; }
        .ctrl-btn-circle {
            width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--border-graphite);
            background: var(--surface-card); color: var(--text-primary); font-size: 18px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .ctrl-btn-circle.active { background: var(--accent-amber); color: #000; border-color: var(--accent-amber); }
        .ctrl-btn-circle.muted-state { background: var(--text-primary); color: #000; }
        .ctrl-btn-circle.hangup { background: var(--danger-red); border-color: var(--danger-red); color: white; }

        /* MODALS */
        .modal-backdrop {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px); z-index: 100; display: none;
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal-card {
            background: var(--surface-card); border: 1px solid var(--border-graphite);
            border-radius: 20px; padding: 24px; width: 100%; display: flex;
            flex-direction: column; gap: 14px; box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        .modal-header { display: flex; align-items: center; justify-content: space-between; }
        .modal-title { font-size: 16px; font-weight: 700; color: var(--accent-amber); }
        .modal-close { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-field {
            background: var(--bg-obsidian); border: 1px solid var(--border-graphite);
            color: var(--text-primary); padding: 12px 14px; border-radius: 12px;
            font-size: 14px; outline: none;
        }
        .input-field:focus { border-color: var(--accent-amber); }

        .btn-modal-save {
            background: var(--accent-amber); color: #000; font-weight: 700;
            border: none; border-radius: 12px; padding: 12px; font-size: 14px; cursor: pointer;
        }
        .btn-modal-wa {
            background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4);
            color: var(--online-green); padding: 11px; border-radius: 12px;
            font-size: 13px; font-weight: 700; cursor: pointer; text-align: center;
        }
    </style>
</head>
<body>

    <div class="app-viewport">
        
        <!-- 1. DIRECTORY SCREEN (FOR HOST) -->
        <div class="view-directory" id="view-dir">
            <header class="top-navbar">
                <div class="brand-cluster">
                    <div class="my-profile-badge" id="my-profile-avatar-btn" onclick="openProfileModal()" title="Edit My Profile & DP">U</div>
                    <div class="brand-title">Syncora <span>Terminal</span></div>
                </div>
                <button class="btn-add-contact" onclick="openAddModal()">＋ Add Contact</button>
            </header>

            <main class="directory-container" id="contact-list-container">
                <div class="section-label">Contacts Directory</div>
            </main>

            <button class="fab-add" onclick="openAddModal()" title="Add New Contact">＋</button>
        </div>

        <!-- 2. DIRECT CHAT VIEW -->
        <div class="view-chat-screen" id="view-chat-screen">
            <header class="chat-top-header">
                <div class="chat-contact-meta">
                    <button class="btn-back-arrow" id="chat-back-btn" onclick="closeContactChat()">←</button>
                    <div class="avatar-box" id="chat-header-avatar" style="width: 40px; height: 40px; font-size: 14px;" onclick="openProfileModal()" title="Tap to update Profile/DP">AF</div>
                    <div>
                        <div style="font-size: 14px; font-weight: 700;" id="chat-header-title">Contact</div>
                        <div style="font-size: 11px; color: var(--online-green);">Direct Line Active</div>
                    </div>
                </div>

                <div class="chat-action-cluster">
                    <button class="chat-header-btn" onclick="initiateCall(false)" title="Normal Voice Call">📞 Call</button>
                    <button class="chat-header-btn translate-call" onclick="initiateCall(true)" title="AI Live Translate Call">🌐 AI Translate</button>
                </div>
            </header>

            <!-- MULTI-LANGUAGE CONTROLS IN CHAT -->
            <div class="chat-translate-toggle-bar">
                <span>Translate:</span>
                <select class="lang-dropdown-pill" id="chat-source-lang">
                    <option value="ur">Urdu (اردو)</option>
                    <option value="en">English (US)</option>
                    <option value="de">German (Deutsch)</option>
                    <option value="fr">French (Français)</option>
                    <option value="es">Spanish (Español)</option>
                    <option value="it">Italian (Italiano)</option>
                    <option value="ru">Russian (Русский)</option>
                    <option value="pt">Portuguese (Português)</option>
                    <option value="ms">Malay (Bahasa Melayu)</option>
                    <option value="ar">Arabic (العربية)</option>
                    <option value="tr">Turkish (Türkçe)</option>
                    <option value="zh">Chinese (中文)</option>
                </select>
                <span>➔</span>
                <select class="lang-dropdown-pill" id="chat-target-lang">
                    <option value="en">English (US)</option>
                    <option value="ur">Urdu (اردو)</option>
                    <option value="de">German (Deutsch)</option>
                    <option value="fr">French (Français)</option>
                    <option value="es">Spanish (Español)</option>
                    <option value="it">Italian (Italiano)</option>
                    <option value="ru">Russian (Русский)</option>
                    <option value="pt">Portuguese (Português)</option>
                    <option value="ms">Malay (Bahasa Melayu)</option>
                    <option value="ar">Arabic (العربية)</option>
                    <option value="tr">Turkish (Türkçe)</option>
                    <option value="zh">Chinese (中文)</option>
                </select>
                <input type="checkbox" id="chat-translate-toggle" checked title="Enable Auto-Translate">
            </div>

            <div class="chat-messages-area" id="chat-msgs-box"></div>

            <div class="chat-input-bar">
                <input type="text" class="chat-input" id="chat-input-field" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendChatMessage()">
                <button class="chat-send-btn" onclick="sendChatMessage()">➤</button>
            </div>
        </div>

        <!-- 3. INCOMING CALL MODAL -->
        <div class="incoming-modal-backdrop" id="incoming-modal">
            <div class="incoming-dialog">
                <div class="incoming-avatar" id="incoming-caller-avatar">AF</div>
                <h3 style="font-size: 21px; margin-bottom: 6px;" id="incoming-caller-name">Incoming Call...</h3>
                <p style="font-size: 13px; color: var(--accent-amber);" id="incoming-call-type-label">Voice Line</p>
                <div class="incoming-actions">
                    <button class="btn-call-action btn-decline" onclick="declineCall()">Decline</button>
                    <button class="btn-call-action btn-accept" onclick="acceptCall()">Accept</button>
                </div>
            </div>
        </div>

        <!-- 4. ACTIVE CALL OVERLAY -->
        <section class="call-screen-overlay" id="call-screen">
            <div class="call-header">
                <!-- MULTI-LANGUAGE SELECTOR IN CALL -->
                <div class="call-lang-bar" id="call-lang-bar">
                    <span>Speak:</span>
                    <select class="lang-dropdown-pill" id="call-speak-lang" onchange="syncCallSpeechLang()">
                        <option value="ur-PK">Urdu (اردو)</option>
                        <option value="en-US">English (US)</option>
                        <option value="de-DE">German (Deutsch)</option>
                        <option value="fr-FR">French (Français)</option>
                        <option value="es-ES">Spanish (Español)</option>
                        <option value="it-IT">Italian (Italiano)</option>
                        <option value="ru-RU">Russian (Русский)</option>
                        <option value="pt-PT">Portuguese (Português)</option>
                        <option value="ms-MY">Malay (Melayu)</option>
                        <option value="ar-SA">Arabic (العربية)</option>
                        <option value="tr-TR">Turkish (Türkçe)</option>
                        <option value="zh-CN">Chinese (中文)</option>
                    </select>
                    <span>➔ Translate:</span>
                    <select class="lang-dropdown-pill" id="call-target-lang">
                        <option value="en">English (US)</option>
                        <option value="ur">Urdu (اردو)</option>
                        <option value="de">German (Deutsch)</option>
                        <option value="fr">French (Français)</option>
                        <option value="es">Spanish (Español)</option>
                        <option value="it">Italian (Italiano)</option>
                        <option value="ru">Russian (Русский)</option>
                        <option value="pt">Portuguese (Português)</option>
                        <option value="ms">Malay (Melayu)</option>
                        <option value="ar">Arabic (العربية)</option>
                        <option value="tr">Turkish (Türkçe)</option>
                        <option value="zh">Chinese (中文)</option>
                    </select>
                </div>

                <div class="caller-title" id="call-status-label">Partner</div>
                <div class="call-duration" id="call-timer">00:00</div>
            </div>

            <div class="call-stage-center">
                <div class="pulse-wave-ring"></div>
                <div class="caller-large-avatar" id="active-call-avatar">P</div>
            </div>

            <div class="subtitles-box" id="call-subtitle-box">
                <div class="sub-original" id="sub-original">Speak naturally...</div>
                <div class="sub-translated" id="sub-translated">Voice Channel Ready</div>
            </div>

            <div class="call-controls-row">
                <button class="ctrl-btn-circle" id="mute-btn" onclick="toggleMute()" title="Mute Mic">🎙️</button>
                <button class="ctrl-btn-circle" id="speaker-btn" onclick="toggleSpeaker()" title="Loudspeaker">🔊</button>
                <button class="ctrl-btn-circle hangup" onclick="endCall(true)" title="End Call">🛑</button>
            </div>
        </section>

        <!-- ADD CONTACT MODAL -->
        <div class="modal-backdrop" id="add-modal">
            <div class="modal-card">
                <div class="modal-header">
                    <div class="modal-title">New Contact</div>
                    <button class="modal-close" onclick="closeAddModal()">✕</button>
                </div>
                <div class="input-group">
                    <input type="text" id="modal-name-input" class="input-field" placeholder="Contact Name (e.g. Hans Müller)">
                    <input type="tel" id="modal-phone-input" class="input-field" placeholder="Mobile Number (e.g. 03001234567)">
                </div>
                <button class="btn-modal-save" onclick="saveContactFromModal()">Save Contact</button>
                <button class="btn-modal-wa" onclick="openDirectWhatsAppFromModal()">💬 Send Invite on WhatsApp</button>
            </div>
        </div>

        <!-- PROFILE & DP SETUP MODAL -->
        <div class="modal-backdrop" id="profile-modal">
            <div class="modal-card">
                <div class="modal-header">
                    <div class="modal-title">Edit Profile & DP</div>
                    <button class="modal-close" onclick="closeProfileModal()">✕</button>
                </div>
                <div class="input-group">
                    <label style="font-size: 12px; color: var(--text-muted);">Your Display Name:</label>
                    <input type="text" id="my-name-input" class="input-field" placeholder="Your Name">
                    <label style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Choose Profile Picture (DP):</label>
                    <input type="file" id="my-photo-input" accept="image/*" class="input-field" style="padding: 8px;">
                </div>
                <button class="btn-modal-save" onclick="saveMyProfile()">Save & Update DP</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const isGuest = urlParams.get('role') === 'guest';
        const hostNameParam = urlParams.get('host_name') ? decodeURIComponent(urlParams.get('host_name')) : null;

        let myName = localStorage.getItem("syncora_my_name") || (isGuest ? "Guest Partner" : "Muhammad");
        let myPhoto = localStorage.getItem("syncora_my_photo") || "";

        let contacts = JSON.parse(localStorage.getItem("syncora_contacts_list") || "[]");
        if (contacts.length === 0) {
            contacts.push({ name: "Ahmad Farman TBT", phone: "03488674051" });
            localStorage.setItem("syncora_contacts_list", JSON.stringify(contacts));
        }

        let activeContact = contacts[0] || { name: "Partner", phone: "03000000000" };
        let currentRoom = urlParams.get('room') || ('room-' + activeContact.phone.replace(/[^0-9]/g, ''));

        let partnerLivePhoto = "";
        let partnerLiveName = isGuest ? (hostNameParam || "Host Partner") : activeContact.name;

        const myId = "usr-" + Math.random().toString(36).substring(2, 8);
        let socket = null;
        let audioContext = null;
        let mediaStream = null;
        let scriptNode = null;
        let speechRecognition = null;
        let isCallActive = false;
        let isTranslationCall = false;
        let isMuted = false;
        let isSpeakerOn = false;
        let timerInterval = null;
        let elapsedSeconds = 0;
        let playbackTime = 0;
        let ringInterval = null;
        let gainNode = null;

        function getInitials(name) {
            if (!name) return "P";
            const parts = name.trim().split(" ");
            if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
            return name.substring(0, 2).toUpperCase();
        }

        function applyAvatar(element, name, photoUrl) {
            if (!element) return;
            if (photoUrl) {
                element.style.backgroundImage = `url('${photoUrl}')`;
                element.innerText = "";
            } else {
                element.style.backgroundImage = "none";
                element.innerText = getInitials(name);
            }
        }

        function renderContactList() {
            const container = document.getElementById("contact-list-container");
            container.innerHTML = '<div class="section-label">Contacts Directory</div>';

            contacts.forEach((c, index) => {
                const card = document.createElement("div");
                card.className = "contact-card";
                card.innerHTML = `
                    <div class="user-identity" onclick="selectContact(${index})">
                        <div class="avatar-box">${getInitials(c.name)}</div>
                        <div class="user-meta">
                            <div class="contact-name">${c.name}</div>
                            <div class="contact-sub">${c.phone}</div>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-card-del" onclick="event.stopPropagation(); deleteContact(${index})" title="Delete Contact">🗑️</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function deleteContact(index) {
            if (confirm(`Delete ${contacts[index].name}?`)) {
                contacts.splice(index, 1);
                localStorage.setItem("syncora_contacts_list", JSON.stringify(contacts));
                renderContactList();
            }
        }

        function selectContact(index) {
            activeContact = contacts[index];
            partnerLiveName = activeContact.name;
            partnerLivePhoto = "";
            currentRoom = 'room-' + activeContact.phone.replace(/[^0-9]/g, '');
            openContactChat();
        }

        function updateUI() {
            applyAvatar(document.getElementById("my-profile-avatar-btn"), myName, myPhoto);

            if (isGuest) {
                document.getElementById("view-dir").style.display = "none";
                document.getElementById("view-chat-screen").style.display = "flex";
                document.getElementById("chat-back-btn").style.display = "none";
            }

            document.getElementById("chat-header-title").innerText = partnerLiveName;
            document.getElementById("call-status-label").innerText = partnerLiveName;
            applyAvatar(document.getElementById("chat-header-avatar"), partnerLiveName, partnerLivePhoto);
            applyAvatar(document.getElementById("active-call-avatar"), partnerLiveName, partnerLivePhoto);
            applyAvatar(document.getElementById("incoming-caller-avatar"), partnerLiveName, partnerLivePhoto);
            document.getElementById("incoming-caller-name").innerText = `${partnerLiveName} is calling...`;
        }

        function openAddModal() {
            document.getElementById("modal-name-input").value = "";
            document.getElementById("modal-phone-input").value = "";
            document.getElementById("add-modal").style.display = "flex";
        }
        function closeAddModal() {
            document.getElementById("add-modal").style.display = "none";
        }
        function saveContactFromModal() {
            const nameInput = document.getElementById("modal-name-input").value.trim();
            const phoneInput = document.getElementById("modal-phone-input").value.trim();
            if (!nameInput || !phoneInput) return;

            contacts.push({ name: nameInput, phone: phoneInput });
            localStorage.setItem("syncora_contacts_list", JSON.stringify(contacts));
            renderContactList();
            closeAddModal();
        }

        function openProfileModal() {
            document.getElementById("my-name-input").value = myName;
            document.getElementById("profile-modal").style.display = "flex";
        }
        function closeProfileModal() {
            document.getElementById("profile-modal").style.display = "none";
        }
        function saveMyProfile() {
            const name = document.getElementById("my-name-input").value.trim() || myName;
            myName = name;
            localStorage.setItem("syncora_my_name", myName);

            const fileInput = document.getElementById("my-photo-input");
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    myPhoto = e.target.result;
                    localStorage.setItem("syncora_my_photo", myPhoto);
                    updateUI();
                    broadcastIdentity();
                    closeProfileModal();
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                updateUI();
                broadcastIdentity();
                closeProfileModal();
            }
        }

        function broadcastIdentity() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: "profile_sync",
                    user_name: myName,
                    user_photo: myPhoto
                }));
            }
        }

        function openContactChat() {
            document.getElementById("view-dir").style.display = "none";
            document.getElementById("view-chat-screen").style.display = "flex";
            updateUI();
            if (socket) socket.close();
            initSocket();
            fetchOfflineHistory();
        }

        function closeContactChat() {
            document.getElementById("view-chat-screen").style.display = "none";
            document.getElementById("view-dir").style.display = "flex";
        }

        function generateGuestShareUrl() {
            const origin = window.location.origin;
            const path = window.location.pathname;
            const params = new URLSearchParams();
            params.set("room", currentRoom);
            params.set("role", "guest");
            params.set("host_name", myName);
            return `${origin}${path}?${params.toString()}`;
        }

        function openDirectWhatsAppFromModal() {
            const phoneInput = document.getElementById("modal-phone-input").value.trim().replace(/[^0-9]/g, '');
            const nameInput = document.getElementById("modal-name-input").value.trim() || "Friend";
            if (!phoneInput) return;

            let num = phoneInput;
            if (num.startsWith("03")) num = "92" + num.substring(1);

            const shareUrl = generateGuestShareUrl();
            const msg = encodeURIComponent(`Assalam o Alaikum ${nameInput}! Please join my secure line on Syncora: ${shareUrl}`);

            window.location.href = `whatsapp://send?phone=${num}&text=${msg}`;
        }

        function initSocket() {
            const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
            socket = new WebSocket(`${wsProtocol}${window.location.host}/ws/${currentRoom}`);
            socket.binaryType = "arraybuffer";

            socket.onopen = () => {
                broadcastIdentity();
            };

            socket.onmessage = (event) => {
                if (typeof event.data === "string") {
                    const data = JSON.parse(event.data);
                    if (data.type === "profile_sync") {
                        partnerLiveName = data.user_name || partnerLiveName;
                        partnerLivePhoto = data.user_photo || "";
                        updateUI();
                    } else if (data.type === "call_invite") {
                        isTranslationCall = data.is_translation || false;
                        if (data.caller_name) partnerLiveName = data.caller_name;
                        if (data.caller_photo) partnerLivePhoto = data.caller_photo;
                        updateUI();
                        document.getElementById("incoming-call-type-label").innerText = isTranslationCall ? "🌐 AI Live Translation Call" : "📞 Voice Call";
                        document.getElementById("incoming-modal").style.display = "flex";
                        startIncomingRingtone();
                    } else if (data.type === "call_accepted") {
                        stopIncomingRingtone();
                        isTranslationCall = data.is_translation || false;
                        setupActiveCallUI();
                        startCallTimer();
                        startContinuousAudioCapture();
                        if (isTranslationCall) startSpeechEngine();
                    } else if (data.type === "call_declined" || data.type === "call_ended") {
                        stopIncomingRingtone();
                        endCall(false);
                    } else if (data.type === "text_message") {
                        appendChatMessage(data.text, 'received', data.translated, data.time);
                    } else if (data.type === "live_subtitle") {
                        document.getElementById("sub-original").innerText = `Partner: "${data.original}"`;
                        document.getElementById("sub-translated").innerText = `AI: ${data.translated}`;
                    }
                } else if (event.data instanceof ArrayBuffer) {
                    playRawAudio(event.data);
                }
            };

            socket.onclose = () => {
                setTimeout(initSocket, 1500);
            };
        }

        async function fetchOfflineHistory() {
            try {
                const res = await fetch(`/messages/${currentRoom}`);
                const data = await res.json();
                const box = document.getElementById("chat-msgs-box");
                box.innerHTML = "";
                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(msg => {
                        const type = (msg.sender === myId) ? 'sent' : 'received';
                        appendChatMessage(msg.text, type, msg.translated, msg.time);
                    });
                }
            } catch (e) {}
        }

        async function sendChatMessage() {
            const input = document.getElementById("chat-input-field");
            const text = input.value.trim();
            if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            let translated = "";

            const isAutoTranslate = document.getElementById("chat-translate-toggle").checked;
            if (isAutoTranslate) {
                try {
                    const src = document.getElementById("chat-source-lang").value;
                    const tgt = document.getElementById("chat-target-lang").value;
                    const res = await fetch("/translate", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            text: text,
                            source_lang: src,
                            target_lang: tgt
                        })
                    });
                    const data = await res.json();
                    translated = data.translated_text || "";
                } catch (e) {}
            }

            socket.send(JSON.stringify({
                type: "text_message",
                text: text,
                translated: translated,
                sender: myId,
                sender_name: myName,
                sender_photo: myPhoto,
                time: timeStr
            }));

            appendChatMessage(text, 'sent', translated, timeStr);
            input.value = "";
        }

        function appendChatMessage(text, type, translated = "", timeStr = "") {
            const box = document.getElementById("chat-msgs-box");
            const bubble = document.createElement("div");
            bubble.className = `chat-bubble ${type}`;

            let content = `<div>${text}</div>`;
            if (translated && translated !== text) {
                content += `<div class="bubble-translation">AI: ${translated}</div>`;
            }
            content += `<div class="chat-time">${timeStr || 'now'}</div>`;

            bubble.innerHTML = content;
            box.appendChild(bubble);
            box.scrollTop = box.scrollHeight;
        }

        function startIncomingRingtone() {
            stopIncomingRingtone();
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            const ringCtx = new AudioCtx();

            function playBeep() {
                if (!document.getElementById("incoming-modal").style.display || document.getElementById("incoming-modal").style.display === "none") return;
                const osc1 = ringCtx.createOscillator();
                const osc2 = ringCtx.createOscillator();
                const gain = ringCtx.createGain();

                osc1.type = "sine"; osc2.type = "sine";
                osc1.frequency.setValueAtTime(440, ringCtx.currentTime);
                osc2.frequency.setValueAtTime(480, ringCtx.currentTime);

                gain.gain.setValueAtTime(0.3, ringCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ringCtx.currentTime + 1.8);

                osc1.connect(gain); osc2.connect(gain); gain.connect(ringCtx.destination);
                osc1.start(); osc2.start();
                osc1.stop(ringCtx.currentTime + 1.8); osc2.stop(ringCtx.currentTime + 1.8);

                if (navigator.vibrate) navigator.vibrate([400, 200, 400, 1000]);
            }
            playBeep();
            ringInterval = setInterval(playBeep, 3000);
        }

        function stopIncomingRingtone() {
            if (ringInterval) { clearInterval(ringInterval); ringInterval = null; }
            if (navigator.vibrate) navigator.vibrate(0);
        }

        function setupActiveCallUI() {
            const langBar = document.getElementById("call-lang-bar");
            const subBox = document.getElementById("call-subtitle-box");
            if (isTranslationCall) {
                langBar.style.display = "flex";
                subBox.style.display = "flex";
                document.getElementById("sub-translated").innerText = "AI Live Translation Active";
            } else {
                langBar.style.display = "none";
                subBox.style.display = "none";
            }
        }

        function syncCallSpeechLang() {
            const lang = document.getElementById("call-speak-lang").value;
            if (speechRecognition) {
                speechRecognition.lang = lang;
                if (isCallActive && isTranslationCall) {
                    try {
                        speechRecognition.stop();
                        setTimeout(() => { speechRecognition.start(); }, 200);
                    } catch (e) {}
                }
            }
        }

        function initSpeechEngine() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) return;

            speechRecognition = new SpeechRec();
            speechRecognition.continuous = true;
            speechRecognition.interimResults = false;
            speechRecognition.lang = document.getElementById("call-speak-lang") ? document.getElementById("call-speak-lang").value : "ur-PK";

            speechRecognition.onresult = async (event) => {
                if (!isCallActive || !isTranslationCall || isMuted) return;
                const lastIdx = event.results.length - 1;
                const originalText = event.results[lastIdx][0].transcript.trim();

                if (originalText.length > 0) {
                    document.getElementById("sub-original").innerText = `You: "${originalText}"`;
                    document.getElementById("sub-translated").innerText = "Translating...";

                    const src = document.getElementById("call-speak-lang").value.split("-")[0];
                    const tgt = document.getElementById("call-target-lang").value;

                    try {
                        const res = await fetch("/translate", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                text: originalText,
                                source_lang: src,
                                target_lang: tgt
                            })
                        });
                        const data = await res.json();
                        const translatedText = data.translated_text || originalText;
                        document.getElementById("sub-translated").innerText = `AI: ${translatedText}`;

                        if (socket && socket.readyState === WebSocket.OPEN) {
                            socket.send(JSON.stringify({
                                type: "live_subtitle",
                                original: originalText,
                                translated: translatedText
                            }));
                        }
                    } catch (e) {}
                }
            };

            speechRecognition.onend = () => {
                if (isCallActive && isTranslationCall && !isMuted) {
                    try { speechRecognition.start(); } catch (e) {}
                }
            };
        }

        function startSpeechEngine() {
            if (speechRecognition && isCallActive) {
                try {
                    speechRecognition.lang = document.getElementById("call-speak-lang").value;
                    speechRecognition.start();
                } catch (e) {}
            }
        }

        async function ensureAudioContext() {
            if (!audioContext || audioContext.state === "closed") {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioCtx({ sampleRate: 16000 });
                gainNode = audioContext.createGain();
                gainNode.gain.value = 1.0;
                gainNode.connect(audioContext.destination);
            }
            if (audioContext.state === "suspended") await audioContext.resume();
        }

        async function startContinuousAudioCapture() {
            await ensureAudioContext();
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
                    video: false
                });

                const source = audioContext.createMediaStreamSource(mediaStream);
                scriptNode = audioContext.createScriptProcessor(4096, 1, 1);

                scriptNode.onaudioprocess = (e) => {
                    if (!isCallActive || isMuted || !socket || socket.readyState !== WebSocket.OPEN) return;
                    const channelData = e.inputBuffer.getChannelData(0);
                    const pcmData = new Int16Array(channelData.length);
                    for (let i = 0; i < channelData.length; i++) {
                        const s = Math.max(-1, Math.min(1, channelData[i]));
                        pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    socket.send(pcmData.buffer);
                };

                source.connect(scriptNode);
                const silentGain = audioContext.createGain();
                silentGain.gain.value = 0;
                scriptNode.connect(silentGain);
                silentGain.connect(audioContext.destination);
            } catch (err) {
                alert("Microphone required: " + err.message);
            }
        }

        function playRawAudio(arrayBuffer) {
            if (!audioContext || !isCallActive) return;
            const pcmData = new Int16Array(arrayBuffer);
            const floatData = new Float32Array(pcmData.length);
            for (let i = 0; i < pcmData.length; i++) floatData[i] = pcmData[i] / 32768.0;

            const audioBuf = audioContext.createBuffer(1, floatData.length, 16000);
            audioBuf.copyToChannel(floatData, 0);

            const source = audioContext.createBufferSource();
            source.buffer = audioBuf;
            source.connect(gainNode);

            const currentTime = audioContext.currentTime;
            if (playbackTime < currentTime) playbackTime = currentTime + 0.04;
            source.start(playbackTime);
            playbackTime += audioBuf.duration;
        }

        async function initiateCall(withTranslation = false) {
            await ensureAudioContext();
            isCallActive = true;
            isTranslationCall = withTranslation;
            setupActiveCallUI();

            document.getElementById("call-screen").style.display = "flex";
            document.getElementById("sub-translated").innerText = "Waiting for partner to answer...";

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: "call_invite",
                    is_translation: withTranslation,
                    caller_name: myName,
                    caller_photo: myPhoto
                }));
            }
        }

        async function acceptCall() {
            stopIncomingRingtone();
            await ensureAudioContext();
            document.getElementById("incoming-modal").style.display = "none";
            isCallActive = true;
            setupActiveCallUI();

            document.getElementById("call-screen").style.display = "flex";
            startCallTimer();
            startContinuousAudioCapture();
            if (isTranslationCall) startSpeechEngine();

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: "call_accepted",
                    is_translation: isTranslationCall
                }));
            }
        }

        function declineCall() {
            stopIncomingRingtone();
            document.getElementById("incoming-modal").style.display = "none";
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: "call_declined" }));
            }
        }

        function startCallTimer() {
            elapsedSeconds = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                elapsedSeconds++;
                const mins = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
                const secs = String(elapsedSeconds % 60).padStart(2, '0');
                document.getElementById("call-timer").innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function endCall(sendSignal = true) {
            stopIncomingRingtone();
            isCallActive = false;
            isTranslationCall = false;
            clearInterval(timerInterval);
            document.getElementById("call-timer").innerText = "00:00";

            if (scriptNode) { scriptNode.disconnect(); scriptNode = null; }
            if (speechRecognition) { try { speechRecognition.stop(); } catch (e) {} }
            if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }

            playbackTime = 0;
            document.getElementById("incoming-modal").style.display = "none";
            document.getElementById("call-screen").style.display = "none";

            if (sendSignal && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: "call_ended" }));
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            const btn = document.getElementById("mute-btn");
            btn.classList.toggle("muted-state", isMuted);
            btn.innerText = isMuted ? "🔇" : "🎙️";
        }

        function toggleSpeaker() {
            isSpeakerOn = !isSpeakerOn;
            const btn = document.getElementById("speaker-btn");
            btn.classList.toggle("active", isSpeakerOn);
            if (gainNode) gainNode.gain.value = isSpeakerOn ? 2.5 : 1.0;
        }

        window.onload = () => {
            renderContactList();
            updateUI();
            initSpeechEngine();
            if (isGuest) {
                initSocket();
                fetchOfflineHistory();
            }
        };
    </script>
</body>
