<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncora Workspace | AI Hands-Free Bridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0e17;
            --surface-card: rgba(18, 24, 38, 0.7);
            --surface-elevated: rgba(30, 41, 59, 0.6);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --accent-primary: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --success-color: #22c55e;
            --danger-color: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at 50% 0%, #172554 0%, var(--bg-base) 65%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand-cluster {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 16px;
        }

        .brand-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .room-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .room-badge {
            background: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
        }

        .room-badge b { color: var(--accent-primary); }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .dot-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
        }

        .dot-indicator.live {
            background: var(--success-color);
            box-shadow: 0 0 10px var(--success-color);
        }

        .btn-secondary {
            background: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-primary);
        }

        .workspace-container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 20px;
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .workspace-container { grid-template-columns: 1fr; }
        }

        .meeting-stage {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .participant-tiles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .tile-card {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 220px;
            position: relative;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        .tile-card.speaking {
            border-color: var(--success-color);
            box-shadow: 0 0 24px rgba(34, 197, 94, 0.2);
            transform: translateY(-2px);
        }

        .avatar-frame {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: #1e293b;
            border: 2px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 12px;
            transition: transform 0.2s ease;
        }

        .tile-card.speaking .avatar-frame {
            border-color: var(--success-color);
            transform: scale(1.08);
        }

        .participant-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .participant-lang-tag {
            font-size: 12px;
            color: var(--accent-primary);
            background: var(--accent-glow);
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 500;
        }

        .audio-wave {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 18px;
            margin-top: 14px;
        }

        .wave-bar {
            width: 3px;
            height: 4px;
            background: var(--border-subtle);
            border-radius: 2px;
            transition: height 0.15s ease;
        }

        .tile-card.speaking .wave-bar {
            background: var(--success-color);
            animation: wavePulse 0.7s infinite ease-in-out;
        }

        .tile-card.speaking .wave-bar:nth-child(2) { animation-delay: 0.15s; }
        .tile-card.speaking .wave-bar:nth-child(3) { animation-delay: 0.3s; }
        .tile-card.speaking .wave-bar:nth-child(4) { animation-delay: 0.45s; }

        @keyframes wavePulse {
            0%, 100% { height: 4px; }
            50% { height: 18px; }
        }

        .sidebar-panel {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(12px);
        }

        .panel-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .transcript-feed {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 400px;
            max-height: 520px;
        }

        .feed-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px 14px;
            border-radius: 12px;
            background: var(--surface-elevated);
            font-size: 13px;
            line-height: 1.5;
            border-left: 3px solid transparent;
        }

        .feed-item.me { border-left-color: var(--accent-primary); }
        .feed-item.partner { border-left-color: var(--success-color); }

        .item-author {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .item-original { color: #cbd5e1; }
        .item-translated { color: var(--success-color); font-weight: 600; }

        .config-strip {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 16px 20px;
            background: rgba(10, 14, 23, 0.6);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
        }

        @media (max-width: 768px) {
            .config-strip { grid-template-columns: 1fr 1fr; }
        }

        .config-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .config-field label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .select-input, .text-input {
            background: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .bottom-status-bar {
            margin-top: auto;
            padding: 14px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            background: rgba(10, 14, 23, 0.7);
            border-top: 1px solid var(--border-subtle);
            font-size: 13px;
            color: var(--text-muted);
        }

        .live-mic-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(34, 197, 94, 0.15);
            color: var(--success-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand-cluster">
            <div class="brand-logo">S</div>
            <div><div class="brand-title">Syncora Workspace</div></div>
            <div class="status-pill">
                <span class="dot-indicator" id="status-dot"></span>
                <span id="call-status">Connecting...</span>
            </div>
        </div>

        <div class="room-actions">
            <div class="room-badge">
                <span>Room:</span>
                <b id="room-display">...</b>
            </div>
            <button class="btn-secondary" id="copy-btn" onclick="copyInviteLink()">📋 Copy Invite</button>
        </div>
    </nav>

    <main class="workspace-container">
        <section class="meeting-stage">
            <div class="participant-tiles">
                <div class="tile-card" id="local-tile">
                    <div class="avatar-frame">🎙️</div>
                    <div class="participant-name" id="local-name-label">Ali (You)</div>
                    <div class="participant-lang-tag" id="local-lang-label">Urdu</div>
                    <div class="audio-wave">
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                    </div>
                </div>

                <div class="tile-card" id="remote-tile">
                    <div class="avatar-frame">🔊</div>
                    <div class="participant-name">Client / Partner</div>
                    <div class="participant-lang-tag" id="remote-lang-label">English</div>
                    <div class="audio-wave">
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                    </div>
                </div>
            </div>

            <div class="config-strip">
                <div class="config-field">
                    <label>Your Name</label>
                    <input type="text" id="username" class="text-input" value="Ali" oninput="updateNames()">
                </div>
                <div class="config-field">
                    <label>Voice Gender</label>
                    <select id="gender" class="select-input">
                        <option value="male" selected>👨 Male</option>
                        <option value="female">👩 Female</option>
                    </select>
                </div>
                <div class="config-field">
                    <label>I Speak</label>
                    <select id="my-lang" class="select-input" onchange="syncLanguages()">
                        <option value="ur-PK" selected>🇵🇰 Urdu</option>
                        <option value="en-US">🇬🇧 English</option>
                        <option value="ms-MY">🇲🇾 Malay</option>
                        <option value="zh-CN">🇨🇳 Chinese</option>
                    </select>
                </div>
                <div class="config-field">
                    <label>Partner Hears</label>
                    <select id="target-lang" class="select-input" onchange="syncLanguages()">
                        <option value="en-US" selected>🇬🇧 English</option>
                        <option value="ms-MY">🇲🇾 Malay</option>
                        <option value="ur-PK">🇵🇰 Urdu</option>
                        <option value="zh-CN">🇨🇳 Chinese</option>
                    </select>
                </div>
            </div>
        </section>

        <aside class="sidebar-panel">
            <div class="panel-header">
                <h3>Live Interpretation Feed</h3>
            </div>
            <div class="transcript-feed" id="captions">
                <div id="placeholder-msg" style="text-align: center; color: var(--text-muted); font-size: 13px; margin: auto;">
                    Hands-free mode active. Just speak naturally into your microphone.
                </div>
            </div>
        </aside>
    </main>

    <footer class="bottom-status-bar">
        <div class="live-mic-badge">● Live Mic Active</div>
        <span>Speak naturally. AI will detect your pauses and translate automatically.</span>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room') || ('call-' + Math.random().toString(36).substring(2, 7));
        if (!urlParams.get('room')) {
            window.history.replaceState(null, '', window.location.pathname + '?room=' + roomId);
        }
        document.getElementById("room-display").innerText = roomId;

        const myClientId = 'user_' + Math.random().toString(36).substring(2, 9);
        let socket = null;
        let recognition = null;
        let currentAudio = null;
        let isPartnerSpeaking = false;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function copyInviteLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const btn = document.getElementById("copy-btn");
                btn.innerText = "✅ Copied";
                setTimeout(() => { btn.innerText = "📋 Copy Invite"; }, 2000);
            });
        }

        function updateNames() {
            const name = document.getElementById("username").value || "Ali";
            document.getElementById("local-name-label").innerText = `${name} (You)`;
        }

        function syncLanguages() {
            const myLangSelect = document.getElementById("my-lang");
            const tgtLangSelect = document.getElementById("target-lang");
            
            document.getElementById("local-lang-label").innerText = myLangSelect.options[myLangSelect.selectedIndex].text;
            document.getElementById("remote-lang-label").innerText = tgtLangSelect.options[tgtLangSelect.selectedIndex].text;

            if (recognition) {
                try {
                    recognition.abort();
                    recognition.lang = myLangSelect.value;
                    recognition.start();
                } catch(e) {}
            }
        }

        function initSocket() {
            const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
            socket = new WebSocket(`${wsProtocol}${window.location.host}/ws/${roomId}`);

            socket.onopen = () => {
                document.getElementById("status-dot").classList.add("live");
                document.getElementById("call-status").innerText = "Bridge Connected";
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const isMe = (data.sender_id === myClientId);

                appendTranscript(data.sender_name, data.original, data.translated, isMe);

                // Sirf samne wale ke speaker par play ho, with correct target language
                if (!isMe) {
                    playPartnerAudio(data.translated, data.target_lang, data.gender);
                }
            };

            socket.onclose = () => {
                document.getElementById("status-dot").classList.remove("live");
                document.getElementById("call-status").innerText = "Disconnected";
                setTimeout(initSocket, 3000);
            };
        }

        function appendTranscript(sender, orig, trans, isMe) {
            const placeholder = document.getElementById("placeholder-msg");
            if (placeholder) placeholder.remove();

            const feed = document.getElementById("captions");
            const item = document.createElement("div");
            item.className = "feed-item " + (isMe ? "me" : "partner");
            item.innerHTML = `
                <div class="item-author">${sender} ${isMe ? "(You)" : ""}</div>
                <div class="item-original">${orig}</div>
                <div class="item-translated">➔ ${trans}</div>
            `;
            feed.appendChild(item);
            feed.scrollTop = feed.scrollHeight;
        }

        function playPartnerAudio(text, lang, gender) {
            if (!text || text.startsWith("[")) return;

            isPartnerSpeaking = true;
            if (recognition) {
                try { recognition.abort(); } catch(e) {}
            }

            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            const remoteTile = document.getElementById("remote-tile");
            remoteTile.classList.add("speaking");

            const cleanLang = (lang || "en").split("-")[0].toLowerCase();
            const url = `/tts?text=${encodeURIComponent(text)}&lang=${encodeURIComponent(cleanLang)}&gender=${encodeURIComponent(gender)}`;
            currentAudio = new Audio(url);

            const unlockMic = () => {
                remoteTile.classList.remove("speaking");
                currentAudio = null;
                setTimeout(() => {
                    isPartnerSpeaking = false;
                    restartMic();
                }, 400);
            };

            currentAudio.onended = unlockMic;
            currentAudio.onerror = unlockMic;
            currentAudio.play().catch(unlockMic);
        }

        function restartMic() {
            if (recognition && !isPartnerSpeaking) {
                try {
                    recognition.lang = document.getElementById("my-lang").value;
                    recognition.start();
                } catch(e) {}
            }
        }

        function initContinuousSpeech() {
            if (!SpeechRecognition) {
                alert("Please use Chrome or Edge for hands-free voice bridge.");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onstart = () => {
                if (!isPartnerSpeaking) {
                    document.getElementById("local-tile").classList.remove("speaking");
                }
            };

            recognition.onresult = (event) => {
                if (isPartnerSpeaking) return;

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        const transcript = event.results[i][0].transcript.trim();
                        if (!transcript) continue;

                        const localTile = document.getElementById("local-tile");
                        localTile.classList.add("speaking");
                        setTimeout(() => localTile.classList.remove("speaking"), 1000);

                        const myLangVal = document.getElementById("my-lang").value;
                        const targetLangVal = document.getElementById("target-lang").value;

                        if (socket && socket.readyState === WebSocket.OPEN) {
                            socket.send(JSON.stringify({
                                sender_id: myClientId,
                                sender_name: document.getElementById("username").value || "Ali",
                                gender: document.getElementById("gender").value,
                                source_lang: myLangVal,
                                target_lang: targetLangVal,
                                text: transcript
                            }));
                        }
                    }
                }
            };

            recognition.onend = () => {
                if (!isPartnerSpeaking) {
                    restartMic();
                }
            };

            recognition.lang = document.getElementById("my-lang").value;
            try { recognition.start(); } catch(e) {}
        }

        window.onload = () => {
            initSocket();
            initContinuousSpeech();
            syncLanguages();
            updateNames();
        };
    </script>
</body>
</html>
