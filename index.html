<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncora Workspace | AI Bilateral Bridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0e17;
            --surface-card: rgba(18, 24, 38, 0.7);
            --surface-elevated: rgba(30, 41, 59, 0.6);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-active: rgba(56, 189, 248, 0.4);
            --accent-primary: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --success-color: #22c55e;
            --danger-color: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at 50% 0%, #172554 0%, var(--bg-base) 65%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Navigation Bar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: rgba(10, 14, 23, 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand-cluster {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 16px;
        }

        .brand-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .room-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .room-badge {
            background: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
        }

        .room-badge b {
            color: var(--accent-primary);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .dot-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
        }

        .dot-indicator.live {
            background: var(--success-color);
            box-shadow: 0 0 10px var(--success-color);
        }

        .btn-secondary {
            background: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-primary);
        }

        /* Workspace Grid */
        .workspace-container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 20px;
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .workspace-container {
                grid-template-columns: 1fr;
            }
        }

        /* Left Main Panel: Participants & Visual Feed */
        .meeting-stage {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .participant-tiles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .tile-card {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            position: relative;
            backdrop-filter: blur(12px);
            transition: border-color 0.3s ease;
        }

        .tile-card.speaking {
            border-color: var(--success-color);
            box-shadow: 0 0 24px rgba(34, 197, 94, 0.15);
        }

        .avatar-frame {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #1e293b;
            border: 2px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 12px;
            transition: transform 0.2s ease;
        }

        .tile-card.speaking .avatar-frame {
            border-color: var(--success-color);
            transform: scale(1.05);
        }

        .participant-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .participant-lang-tag {
            font-size: 11px;
            color: var(--accent-primary);
            background: var(--accent-glow);
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        /* Audio Wave Simulation */
        .audio-wave {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 16px;
            margin-top: 10px;
        }

        .wave-bar {
            width: 3px;
            height: 4px;
            background: var(--border-subtle);
            border-radius: 2px;
            transition: height 0.15s ease;
        }

        .tile-card.speaking .wave-bar {
            background: var(--success-color);
            animation: wavePulse 0.8s infinite ease-in-out;
        }

        .tile-card.speaking .wave-bar:nth-child(2) { animation-delay: 0.15s; }
        .tile-card.speaking .wave-bar:nth-child(3) { animation-delay: 0.3s; }
        .tile-card.speaking .wave-bar:nth-child(4) { animation-delay: 0.45s; }

        @keyframes wavePulse {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }

        /* Right Panel: Clean Subtitles & Transcript Feed */
        .sidebar-panel {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(12px);
        }

        .panel-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .transcript-feed {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 380px;
            max-height: 480px;
        }

        .feed-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 10px 14px;
            border-radius: 12px;
            background: var(--surface-elevated);
            font-size: 13px;
            line-height: 1.5;
            border-left: 3px solid transparent;
        }

        .feed-item.me {
            border-left-color: var(--accent-primary);
        }

        .feed-item.partner {
            border-left-color: var(--success-color);
        }

        .item-author {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .item-original {
            color: #cbd5e1;
        }

        .item-translated {
            color: var(--success-color);
            font-weight: 500;
        }

        /* Settings Bar */
        .config-strip {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 14px 18px;
            background: rgba(10, 14, 23, 0.6);
            border-top: 1px solid var(--border-subtle);
        }

        @media (max-width: 768px) {
            .config-strip {
                grid-template-columns: 1fr 1fr;
            }
        }

        .config-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .config-field label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .select-input, .text-input {
            background: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .select-input:focus, .text-input:focus {
            border-color: var(--accent-primary);
        }

        /* Bottom Floating Dock / Controls */
        .bottom-dock {
            margin-top: auto;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .ptt-action-btn {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid var(--border-subtle);
            color: var(--text-main);
            border-radius: 50px;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        }

        .ptt-action-btn.active {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border-color: #4ade80;
            box-shadow: 0 0 24px rgba(34, 197, 94, 0.4);
            transform: scale(0.98);
        }

        .icon-circle {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar">
        <div class="brand-cluster">
            <div class="brand-logo">S</div>
            <div>
                <div class="brand-title">Syncora Workspace</div>
            </div>
            <div class="status-pill">
                <span class="dot-indicator" id="status-dot"></span>
                <span id="call-status">Connecting...</span>
            </div>
        </div>

        <div class="room-actions">
            <div class="room-badge">
                <span>Room:</span>
                <b id="room-display">...</b>
            </div>
            <button class="btn-secondary" id="copy-btn" onclick="copyInviteLink()">📋 Copy Invite</button>
        </div>
    </nav>

    <!-- Main Workspace Container -->
    <main class="workspace-container">
        
        <!-- Left: Call Stage / Participants -->
        <section class="meeting-stage">
            <div class="participant-tiles">
                <!-- Local User Tile -->
                <div class="tile-card" id="local-tile">
                    <div class="avatar-frame">🎙️</div>
                    <div class="participant-name" id="local-name-label">Ali (You)</div>
                    <div class="participant-lang-tag" id="local-lang-label">Urdu</div>
                    <div class="audio-wave">
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                    </div>
                </div>

                <!-- Remote User Tile -->
                <div class="tile-card" id="remote-tile">
                    <div class="avatar-frame">🔊</div>
                    <div class="participant-name">Client / Partner</div>
                    <div class="participant-lang-tag" id="remote-lang-label">English</div>
                    <div class="audio-wave">
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                    </div>
                </div>
            </div>

            <!-- Configurations Bar -->
            <div class="config-strip">
                <div class="config-field">
                    <label>Your Name</label>
                    <input type="text" id="username" class="text-input" value="Ali" oninput="updateNames()">
                </div>
                <div class="config-field">
                    <label>Voice Gender</label>
                    <select id="gender" class="select-input">
                        <option value="male" selected>👨 Male</option>
                        <option value="female">👩 Female</option>
                    </select>
                </div>
                <div class="config-field">
                    <label>I Speak</label>
                    <select id="my-lang" class="select-input" onchange="syncLanguages()">
                        <option value="ur-PK" selected>🇵🇰 Urdu</option>
                        <option value="en-US">🇬🇧 English</option>
                        <option value="ms-MY">🇲🇾 Malay</option>
                        <option value="zh-CN">🇨🇳 Chinese</option>
                        <option value="ar-SA">🇸🇦 Arabic</option>
                    </select>
                </div>
                <div class="config-field">
                    <label>Partner Hears</label>
                    <select id="target-lang" class="select-input" onchange="syncLanguages()">
                        <option value="en-US" selected>🇬🇧 English</option>
                        <option value="ms-MY">🇲🇾 Malay</option>
                        <option value="ur-PK">🇵🇰 Urdu</option>
                        <option value="zh-CN">🇨🇳 Chinese</option>
                        <option value="ar-SA">🇸🇦 Arabic</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Right: Transcript Subtitles Feed -->
        <aside class="sidebar-panel">
            <div class="panel-header">
                <h3>Live Interpretation Feed</h3>
            </div>
            <div class="transcript-feed" id="captions">
                <div id="placeholder-msg" style="text-align: center; color: var(--text-muted); font-size: 13px; margin: auto;">
                    Hold the Push-to-Talk button below to start real-time interpretation.
                </div>
            </div>
        </aside>

    </main>

    <!-- Bottom Dock Floating Controls -->
    <footer class="bottom-dock">
        <button class="ptt-action-btn" id="ptt-btn">
            <div class="icon-circle">🎙️</div>
            <span id="ptt-label">Hold to Speak</span>
        </button>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room') || ('call-' + Math.random().toString(36).substring(2, 7));
        if (!urlParams.get('room')) {
            window.history.replaceState(null, '', window.location.pathname + '?room=' + roomId);
        }
        document.getElementById("room-display").innerText = roomId;

        const myClientId = 'user_' + Math.random().toString(36).substring(2, 9);
        let socket = null;
        let recognition = null;
        let currentAudio = null;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function copyInviteLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const btn = document.getElementById("copy-btn");
                btn.innerText = "✅ Link Copied";
                setTimeout(() => { btn.innerText = "📋 Copy Invite"; }, 2000);
            });
        }

        function updateNames() {
            const name = document.getElementById("username").value || "Ali";
            document.getElementById("local-name-label").innerText = `${name} (You)`;
        }

        function syncLanguages() {
            const myLangSelect = document.getElementById("my-lang");
            const tgtLangSelect = document.getElementById("target-lang");
            
            document.getElementById("local-lang-label").innerText = myLangSelect.options[myLangSelect.selectedIndex].text;
            document.getElementById("remote-lang-label").innerText = tgtLangSelect.options[tgtLangSelect.selectedIndex].text;
        }

        function initSocket() {
            const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
            socket = new WebSocket(`${wsProtocol}${window.location.host}/ws/${roomId}`);

            socket.onopen = () => {
                document.getElementById("status-dot").classList.add("live");
                document.getElementById("call-status").innerText = "Bridge Connected";
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const isMe = (data.sender_id === myClientId);

                appendTranscript(data.sender_name, data.original, data.translated, isMe);

                if (!isMe) {
                    playPartnerAudio(data.translated, data.target_lang, data.gender);
                }
            };

            socket.onclose = () => {
                document.getElementById("status-dot").classList.remove("live");
                document.getElementById("call-status").innerText = "Disconnected";
                setTimeout(initSocket, 3000);
            };
        }

        function appendTranscript(sender, orig, trans, isMe) {
            const placeholder = document.getElementById("placeholder-msg");
            if (placeholder) placeholder.remove();

            const feed = document.getElementById("captions");
            const item = document.createElement("div");
            item.className = "feed-item " + (isMe ? "me" : "partner");
            item.innerHTML = `
                <div class="item-author">
                    <span>${sender} ${isMe ? "(You)" : ""}</span>
                </div>
                <div class="item-original">${orig}</div>
                <div class="item-translated">➔ ${trans}</div>
            `;
            feed.appendChild(item);
            feed.scrollTop = feed.scrollHeight;
        }

        function playPartnerAudio(text, lang, gender) {
            if (!text || text.startsWith("[")) return;
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            const remoteTile = document.getElementById("remote-tile");
            remoteTile.classList.add("speaking");

            const cleanLang = (lang || "en").split("-")[0].lower();
            const url = `/tts?text=${encodeURIComponent(text)}&lang=${encodeURIComponent(cleanLang)}&gender=${encodeURIComponent(gender)}`;
            currentAudio = new Audio(url);

            const clearSpeaking = () => {
                remoteTile.classList.remove("speaking");
                currentAudio = null;
            };

            currentAudio.onended = clearSpeaking;
            currentAudio.onerror = clearSpeaking;
            currentAudio.play().catch(clearSpeaking);
        }

        function initSpeech() {
            if (!SpeechRecognition) return;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.trim();
                if (!transcript) return;

                const myLangVal = document.getElementById("my-lang").value;
                const targetLangVal = document.getElementById("target-lang").value;

                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        sender_id: myClientId,
                        sender_name: document.getElementById("username").value || "Ali",
                        gender: document.getElementById("gender").value,
                        source_lang: myLangVal,
                        target_lang: targetLangVal,
                        text: transcript
                    }));
                }
            };
        }

        const pttBtn = document.getElementById("ptt-btn");
        const pttLabel = document.getElementById("ptt-label");
        const localTile = document.getElementById("local-tile");

        function startRecording() {
            if (!recognition) return;
            if (currentAudio) currentAudio.pause();

            pttBtn.classList.add("active");
            localTile.classList.add("speaking");
            pttLabel.innerText = "Listening...";

            recognition.lang = document.getElementById("my-lang").value;
            try { recognition.start(); } catch(e) {}
        }

        function stopRecording() {
            if (!recognition) return;
            pttBtn.classList.remove("active");
            localTile.classList.remove("speaking");
            pttLabel.innerText = "Translating...";

            try { recognition.stop(); } catch(e) {}
            setTimeout(() => { pttLabel.innerText = "Hold to Speak"; }, 1500);
        }

        pttBtn.addEventListener("mousedown", startRecording);
        pttBtn.addEventListener("mouseup", stopRecording);
        pttBtn.addEventListener("mouseleave", stopRecording);

        pttBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startRecording(); });
        pttBtn.addEventListener("touchend", (e) => { e.preventDefault(); stopRecording(); });

        window.onload = () => {
            initSocket();
            initSpeech();
            syncLanguages();
            updateNames();
        };
    </script>
</body>
</html>
