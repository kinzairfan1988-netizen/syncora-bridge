<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Syncora Voice Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #09090b;
            --surface-card: #121215;
            --surface-hover: #18181b;
            --border-graphite: #27272a;
            --border-subtle: rgba(255, 255, 255, 0.05);
            --accent-amber: #f59e0b;
            --accent-amber-dim: rgba(245, 158, 11, 0.12);
            --accent-amber-glow: rgba(245, 158, 11, 0.25);
            --danger-red: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.25);
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --online-green: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: var(--bg-obsidian);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .app-viewport {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 920px;
            background-color: var(--bg-obsidian);
            border: 1px solid var(--border-graphite);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (max-width: 480px) {
            .app-viewport { max-height: 100vh; border: none; }
        }

        .top-navbar {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(9, 9, 11, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            z-index: 10;
        }

        .brand-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 19px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .brand-title span { color: var(--accent-amber); }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: var(--text-muted);
            background: var(--surface-card);
            padding: 3px 8px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
        }

        .dot-indicator { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
        .dot-indicator.live { background: var(--online-green); box-shadow: 0 0 6px var(--online-green); }

        .icon-btn {
            background: var(--surface-card);
            border: 1px solid var(--border-graphite);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .directory-container {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
        }

        .contact-card {
            background: var(--surface-card);
            border: 1px solid var(--border-graphite);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-identity { display: flex; align-items: center; gap: 14px; }
        .avatar-box {
            width: 44px; height: 44px; border-radius: 12px;
            background: #1c1c21; border: 1px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; color: var(--accent-amber);
        }

        .contact-name { font-size: 14px; font-weight: 600; }
        .contact-sub { font-size: 12px; color: var(--text-muted); }

        .call-trigger-btn {
            background: var(--accent-amber-dim);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--accent-amber);
            width: 44px; height: 44px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer;
        }

        .incoming-modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px;
        }

        .incoming-dialog {
            background: var(--surface-card);
            border: 1px solid var(--accent-amber);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px var(--accent-amber-glow);
        }

        .btn-answer {
            background: var(--online-green);
            color: white;
            font-weight: 700;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 15px;
        }

        .call-screen-overlay {
            position: absolute;
            inset: 0;
            background: var(--bg-obsidian);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 24px 34px 24px;
        }

        .call-header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .security-badge {
            font-size: 11px; color: var(--text-muted);
            background: var(--surface-card); padding: 4px 12px;
            border-radius: 20px; border: 1px solid var(--border-subtle);
        }

        .caller-title { font-size: 22px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
        .call-duration { font-size: 14px; font-weight: 600; color: var(--accent-amber); font-variant-numeric: tabular-nums; }

        .call-stage-center {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; position: relative; margin: 20px 0;
        }

        .pulse-wave-ring {
            width: 140px; height: 140px; border-radius: 50%;
            background: var(--accent-amber-dim); border: 1px solid rgba(245, 158, 11, 0.2);
            position: absolute; animation: ripple 2s infinite ease-out;
        }

        @keyframes ripple {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .caller-large-avatar {
            width: 108px; height: 108px; border-radius: 50%;
            background: #18181b; border: 2px solid var(--accent-amber);
            display: flex; align-items: center; justify-content: center;
            font-size: 36px; font-weight: 700; color: var(--accent-amber);
            position: relative; z-index: 2; box-shadow: 0 0 30px var(--accent-amber-glow);
        }

        .subtitles-box {
            background: var(--surface-card); border: 1px solid var(--border-graphite);
            border-radius: 14px; padding: 14px; min-height: 70px;
            display: flex; flex-direction: column; justify-content: center;
            gap: 4px; font-size: 13px; text-align: center;
        }

        .call-controls-row { display: flex; align-items: center; justify-content: space-around; }

        .ctrl-btn-circle {
            width: 54px; height: 54px; border-radius: 50%;
            border: 1px solid var(--border-graphite); background: var(--surface-card);
            color: var(--text-primary); font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .ctrl-btn-circle.active { background: var(--text-primary); color: #000; }
        .ctrl-btn-circle.hangup { background: var(--danger-red); border-color: var(--danger-red); color: white; }
    </style>
</head>
<body>

    <div class="app-viewport">
        <header class="top-navbar">
            <div class="brand-title">Syncora <span>Terminal</span></div>
            <div class="status-pill">
                <span class="dot-indicator" id="status-dot"></span>
                <span id="conn-status">Connecting</span>
            </div>
            <button class="icon-btn" onclick="copyInviteLink()" id="copy-btn">📋 Share Link</button>
        </header>

        <main class="directory-container">
            <div class="section-label">Live Call Line</div>

            <div class="contact-card">
                <div class="user-identity">
                    <div class="avatar-box">P2</div>
                    <div class="user-meta">
                        <div class="contact-name">Direct Voice Partner</div>
                        <div class="contact-sub" id="room-sub">Room: Syncing...</div>
                    </div>
                </div>
                <button class="call-trigger-btn" onclick="startOutgoingCall()" title="Start Call">📞</button>
            </div>
        </main>

        <div class="incoming-modal-backdrop" id="incoming-modal">
            <div class="incoming-dialog">
                <div style="font-size: 32px; margin-bottom: 8px;">📞</div>
                <h3 style="font-size: 18px; margin-bottom: 4px;">Incoming Voice Call</h3>
                <p style="font-size: 13px; color: var(--text-secondary);">Direct Audio Channel</p>
                <button class="btn-answer" onclick="acceptIncomingCall()">Tap to Answer</button>
            </div>
        </div>

        <section class="call-screen-overlay" id="call-screen">
            <div class="call-header">
                <div class="security-badge">🔒 Encrypted Line Active</div>
                <div class="caller-title">Direct Partner</div>
                <div class="call-duration" id="call-timer">00:00</div>
            </div>

            <div class="call-stage-center">
                <div class="pulse-wave-ring"></div>
                <div class="caller-large-avatar">P2</div>
            </div>

            <div class="subtitles-box">
                <div id="sub-caption" style="color: var(--online-green); font-weight: 600;">Connecting audio line...</div>
            </div>

            <div class="call-controls-row">
                <button class="ctrl-btn-circle" id="mute-btn" onclick="toggleMute()">🎙️</button>
                <button class="ctrl-btn-circle hangup" onclick="hangupCall(true)">🛑</button>
            </div>
        </section>

        <audio id="remote-audio" autoplay playsinline></audio>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room') || ('call-' + Math.random().toString(36).substring(2, 7));
        if (!urlParams.get('room')) {
            window.history.replaceState(null, '', window.location.pathname + '?room=' + roomId);
        }
        document.getElementById("room-sub").innerText = `Room: ${roomId}`;

        let socket = null;
        let peerConnection = null;
        let localStream = null;
        let timerInterval = null;
        let elapsedSeconds = 0;
        let isMuted = false;
        let pendingOffer = null;
        let candidateQueue = [];

        // Public Open Relay (Metered TURN) configuration
        const rtcConfig = {
            iceServers: [
                { urls: "stun:stun.relay.metered.ca:80" },
                {
                    urls: "turn:standard.relay.metered.ca:80",
                    username: "6a89467614d9526ee4347717",
                    credential: "fQ0M77B3/hP+oQ3j"
                },
                {
                    urls: "turn:standard.relay.metered.ca:443",
                    username: "6a89467614d9526ee4347717",
                    credential: "fQ0M77B3/hP+oQ3j"
                },
                {
                    urls: "turn:standard.relay.metered.ca:443?transport=tcp",
                    username: "6a89467614d9526ee4347717",
                    credential: "fQ0M77B3/hP+oQ3j"
                }
            ]
        };

        function copyInviteLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const btn = document.getElementById("copy-btn");
                btn.innerText = "✅ Done";
                setTimeout(() => { btn.innerText = "📋 Share Link"; }, 1500);
            });
        }

        function initSignaling() {
            const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
            socket = new WebSocket(`${wsProtocol}${window.location.host}/ws/${roomId}`);

            socket.onopen = () => {
                document.getElementById("status-dot").classList.add("live");
                document.getElementById("conn-status").innerText = "Online";
            };

            socket.onmessage = async (event) => {
                const data = JSON.parse(event.data);

                if (data.type === "offer") {
                    pendingOffer = data.offer;
                    document.getElementById("incoming-modal").style.display = "flex";
                } else if (data.type === "answer") {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                    await drainCandidates();
                    document.getElementById("sub-caption").innerText = "Call Connected • Speak Now";
                    startTimer();
                } else if (data.type === "candidate") {
                    if (peerConnection && peerConnection.remoteDescription) {
                        try {
                            await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                        } catch (e) {}
                    } else {
                        candidateQueue.push(data.candidate);
                    }
                } else if (data.type === "hangup") {
                    hangupCall(false);
                }
            };

            socket.onclose = () => {
                document.getElementById("status-dot").classList.remove("live");
                document.getElementById("conn-status").innerText = "Offline";
                setTimeout(initSignaling, 2000);
            };
        }

        async function drainCandidates() {
            while (candidateQueue.length > 0) {
                const cand = candidateQueue.shift();
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(cand));
                } catch (e) {}
            }
        }

        async function setupMedia() {
            if (!localStream) {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    },
                    video: false
                });
            }
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = (event) => {
                const audioEl = document.getElementById("remote-audio");
                if (event.streams && event.streams[0]) {
                    audioEl.srcObject = event.streams[0];
                    audioEl.play().catch(e => console.log("Audio play error:", e));
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        type: "candidate",
                        candidate: event.candidate
                    }));
                }
            };

            peerConnection.onconnectionstatechange = () => {
                if (peerConnection.connectionState === "connected") {
                    document.getElementById("sub-caption").innerText = "Call Connected • Speak Now";
                }
            };
        }

        async function startOutgoingCall() {
            try {
                await setupMedia();
                createPeerConnection();

                document.getElementById("call-screen").style.display = "flex";
                document.getElementById("sub-caption").innerText = "Ringing peer...";

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                socket.send(JSON.stringify({
                    type: "offer",
                    offer: offer
                }));
            } catch (err) {
                alert("Microphone permission required: " + err.message);
            }
        }

        async function acceptIncomingCall() {
            document.getElementById("incoming-modal").style.display = "none";
            try {
                await setupMedia();
                createPeerConnection();

                document.getElementById("call-screen").style.display = "flex";
                document.getElementById("sub-caption").innerText = "Call Connected • Speak Now";
                startTimer();

                await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingOffer));
                await drainCandidates();

                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                socket.send(JSON.stringify({
                    type: "answer",
                    answer: answer
                }));
            } catch (err) {
                alert("Error connecting call: " + err.message);
            }
        }

        function startTimer() {
            elapsedSeconds = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                elapsedSeconds++;
                const mins = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
                const secs = String(elapsedSeconds % 60).padStart(2, '0');
                document.getElementById("call-timer").innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function hangupCall(sendSignal = true) {
            clearInterval(timerInterval);
            document.getElementById("call-timer").innerText = "00:00";
            document.getElementById("incoming-modal").style.display = "none";
            candidateQueue = [];

            if (sendSignal && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: "hangup" }));
            }

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }

            document.getElementById("remote-audio").srcObject = null;
            document.getElementById("call-screen").style.display = "none";
        }

        function toggleMute() {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks().forEach(track => {
                track.enabled = !isMuted;
            });

            const btn = document.getElementById("mute-btn");
            if (isMuted) {
                btn.classList.add("active");
                btn.innerText = "🔇";
            } else {
                btn.classList.remove("active");
                btn.innerText = "🎙️";
            }
        }

        window.onload = () => {
            initSignaling();
        };
    </script>
</body>
</html>
