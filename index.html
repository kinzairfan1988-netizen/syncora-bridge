<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Syncora Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #09090b;
            --surface-card: #121215;
            --surface-hover: #18181b;
            --border-graphite: #27272a;
            --border-subtle: rgba(255, 255, 255, 0.05);
            --accent-amber: #f59e0b;
            --accent-amber-dim: rgba(245, 158, 11, 0.12);
            --accent-amber-glow: rgba(245, 158, 11, 0.25);
            --danger-red: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.25);
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --online-green: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: var(--bg-obsidian);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .app-viewport {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 920px;
            background-color: var(--bg-obsidian);
            border: 1px solid var(--border-graphite);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (max-width: 480px) {
            .app-viewport { max-height: 100vh; border: none; }
        }

        /* 1. FRONT SCREEN: DIRECT NUMBER ACCESS */
        .landing-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 32px 24px;
            text-align: center;
            background: var(--bg-obsidian);
        }
        .syncora-badge {
            width: 68px; height: 68px; border-radius: 20px;
            background: var(--accent-amber-dim);
            border: 2px solid var(--accent-amber);
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; font-weight: 700; color: var(--accent-amber);
            margin-bottom: 20px;
            box-shadow: 0 0 30px var(--accent-amber-glow);
            font-family: 'Space Grotesk', sans-serif;
        }
        .brand-title {
            font-size: 24px; font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: -0.5px; margin-bottom: 6px;
        }
        .brand-subtitle {
            font-size: 13px; color: var(--text-muted);
            margin-bottom: 28px;
        }
        .input-cluster {
            width: 100%; display: flex; flex-direction: column; gap: 12px;
        }
        .terminal-input {
            width: 100%; background: var(--surface-card);
            border: 1px solid var(--border-graphite);
            border-radius: 14px; padding: 14px 16px;
            color: var(--text-primary); font-size: 14px;
            outline: none; transition: border-color 0.2s ease;
        }
        .terminal-input:focus { border-color: var(--accent-amber); }
        .btn-launch-terminal {
            width: 100%; background: var(--accent-amber);
            color: #000; border: none; border-radius: 14px;
            padding: 14px; font-size: 14px; font-weight: 700;
            cursor: pointer; margin-top: 6px;
            box-shadow: 0 4px 20px var(--accent-amber-glow);
            transition: transform 0.1s ease;
        }
        .btn-launch-terminal:active { transform: scale(0.98); }

        /* 2. DIRECT CHAT TERMINAL */
        .chat-view {
            display: none;
            flex: 1;
            flex-direction: column;
            height: 100%;
            background: var(--bg-obsidian);
            position: relative;
        }

        .chat-header {
            background: rgba(18, 18, 21, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-graphite);
            padding: 10px 14px;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 10;
        }
        .header-meta { display: flex; align-items: center; gap: 10px; }
        .chat-avatar-pill {
            width: 38px; height: 38px; border-radius: 50%;
            background: #1c1c21; border: 1px solid var(--accent-amber);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px; color: var(--accent-amber);
        }
        .icon-btn {
            background: transparent; border: none;
            color: var(--text-secondary); font-size: 18px;
            cursor: pointer; padding: 6px; border-radius: 8px;
            transition: color 0.2s;
        }
        .icon-btn:hover { color: var(--accent-amber); }
        .call-btn-cluster { display: flex; align-items: center; gap: 4px; }
        .btn-terminal-call {
            background: var(--surface-card); border: 1px solid var(--border-graphite);
            color: var(--text-primary); padding: 6px 9px; border-radius: 10px;
            font-size: 12px; font-weight: 700; cursor: pointer;
        }
        .btn-terminal-call.translate {
            background: var(--accent-amber-dim); color: var(--accent-amber);
            border-color: rgba(245, 158, 11, 0.4);
        }

        .chat-translate-bar {
            padding: 6px 14px;
            background: rgba(245, 158, 11, 0.04);
            border-bottom: 1px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: space-between;
            font-size: 11px; color: var(--text-muted);
        }
        .lang-pill {
            background: var(--surface-card); color: var(--accent-amber);
            border: 1px solid var(--border-graphite); border-radius: 8px;
            padding: 2px 6px; font-size: 11px; outline: none;
        }

        .chat-messages-container {
            flex: 1; padding: 16px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
        }

        .msg-bubble {
            max-width: 82%; padding: 10px 14px; border-radius: 14px;
            font-size: 13px; line-height: 1.4; word-break: break-word;
        }
        .msg-bubble.sent {
            align-self: flex-end; background: var(--accent-amber);
            color: #000; font-weight: 500; border-bottom-right-radius: 4px;
        }
        .msg-bubble.received {
            align-self: flex-start; background: var(--surface-card);
            color: var(--text-primary); border: 1px solid var(--border-graphite);
            border-bottom-left-radius: 4px;
        }
        .msg-time {
            font-size: 9px; opacity: 0.6; margin-top: 4px; text-align: right;
        }
        .msg-translation {
            font-size: 11px; margin-top: 4px; padding-top: 4px;
            border-top: 1px dashed rgba(0, 0, 0, 0.2); font-style: italic;
        }
        .msg-bubble.received .msg-translation {
            border-top-color: var(--border-graphite); color: var(--online-green);
        }
        .msg-media-img {
            max-width: 100%; border-radius: 8px; margin-top: 4px; display: block;
        }
        .msg-location-link {
            color: inherit; text-decoration: underline; font-weight: 700;
        }

        /* BOTTOM INPUT BAR */
        .chat-input-bar {
            padding: 10px 14px 16px 14px;
            background: var(--bg-obsidian);
            border-top: 1px solid var(--border-subtle);
            display: flex; align-items: center; gap: 8px;
        }
        .input-shell {
            flex: 1; background: var(--surface-card);
            border: 1px solid var(--border-graphite);
            border-radius: 14px; display: flex; align-items: center;
            padding: 2px 10px;
        }
        .input-shell:focus-within { border-color: var(--accent-amber); }
        .main-text-input {
            flex: 1; background: transparent; border: none;
            outline: none; color: var(--text-primary);
            font-size: 13px; padding: 10px 6px;
        }
        .btn-action-circle {
            width: 44px; height: 44px; border-radius: 14px;
            background: var(--accent-amber); border: none;
            color: #000; display: flex; align-items: center;
            justify-content: center; font-size: 16px; font-weight: 700;
            cursor: pointer; flex-shrink: 0;
            box-shadow: 0 4px 15px var(--accent-amber-glow);
        }
        .btn-action-circle.recording {
            background: var(--danger-red); color: #fff;
            animation: ringPulse 1s infinite alternate;
        }
        @keyframes ringPulse { from { transform: scale(1); } to { transform: scale(1.08); } }

        /* ACTIVE CALL OVERLAY */
        .call-overlay {
            position: absolute; inset: 0; background: var(--bg-obsidian);
            z-index: 100; display: none; flex-direction: column;
            justify-content: space-between; padding: 36px 20px;
        }
        .caller-display-card { text-align: center; }
        .caller-title { font-size: 22px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
        .call-timer { font-size: 14px; color: var(--accent-amber); margin-top: 4px; }
        .call-subtitle-panel {
            background: var(--surface-card); border: 1px solid var(--border-graphite);
            border-radius: 14px; padding: 14px; text-align: center;
        }
        .btn-hangup {
            width: 56px; height: 56px; border-radius: 50%;
            background: var(--danger-red); border: none; color: white;
            font-size: 22px; cursor: pointer; margin: 0 auto; display: block;
            box-shadow: 0 4px 20px var(--danger-glow);
        }
    </style>
</head>
<body>

    <div class="app-viewport">
        
        <!-- 1. DIRECT NUMBER LOGIN SCREEN -->
        <div class="landing-screen" id="landing-screen">
            <div class="syncora-badge">IA</div>
            <h1 class="brand-title">Syncora Terminal</h1>
            <p class="brand-subtitle">Direct line calling & live translation bina number save kiye</p>

            <div class="input-cluster">
                <input type="tel" class="terminal-input" id="my-phone-input" placeholder="Aapka Mobile Number (e.g. 03001234567)">
                <input type="tel" class="terminal-input" id="target-phone-input" placeholder="Jisse connect hona hai uska Number">
                <button class="btn-launch-terminal" onclick="startDirectTerminal()">Connect Direct Line</button>
            </div>
        </div>

        <!-- 2. DIRECT CHAT TERMINAL -->
        <div class="chat-view" id="chat-view">
            <header class="chat-header">
                <div class="header-meta">
                    <button class="icon-btn" onclick="exitChat()">←</button>
                    <div class="chat-avatar-pill" id="partner-avatar">IA</div>
                    <div>
                        <div style="font-size: 14px; font-weight: 700;" id="partner-phone-label">0300...</div>
                        <div style="font-size: 10px; color: var(--online-green);">Direct Line Active</div>
                    </div>
                </div>
                <div class="call-btn-cluster">
                    <button class="btn-terminal-call" onclick="triggerCall('voice')">📞</button>
                    <button class="btn-terminal-call" onclick="triggerCall('video')">📹</button>
                    <button class="btn-terminal-call translate" onclick="triggerCall('translate')">🌐 Translate</button>
                </div>
            </header>

            <div class="chat-translate-bar">
                <span>Translate:</span>
                <select class="lang-pill" id="chat-source-lang">
                    <option value="ur">Urdu (اردو)</option>
                    <option value="en">English</option>
                    <option value="ar">Arabic</option>
                </select>
                <span>➔</span>
                <select class="lang-pill" id="chat-target-lang">
                    <option value="en">English</option>
                    <option value="ur">Urdu (اردو)</option>
                    <option value="ar">Arabic</option>
                </select>
                <input type="checkbox" id="auto-translate-check" checked title="Enable Auto-Translate">
            </div>

            <div class="chat-messages-container" id="chat-box"></div>

            <div class="chat-input-bar">
                <div class="input-shell">
                    <input type="text" class="main-text-input" id="text-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendTextMessage()">
                    <button class="icon-btn" onclick="document.getElementById('file-picker').click()" title="Send Image">📎</button>
                    <button class="icon-btn" onclick="sendLiveLocation()" title="Share Location">📍</button>
                    <input type="file" id="file-picker" accept="image/*" style="display:none;" onchange="handleFileUpload(event)">
                </div>
                <button class="btn-action-circle" id="mic-send-btn" onclick="handleMicOrSend()">➤</button>
            </div>
        </div>

        <!-- 3. ACTIVE CALL OVERLAY -->
        <div class="call-overlay" id="call-overlay">
            <div class="caller-display-card">
                <div class="syncora-badge" style="margin: 0 auto 16px auto;" id="call-avatar">IA</div>
                <div class="caller-title" id="call-partner-name">User</div>
                <div class="call-timer" id="call-timer">Connected • 00:00</div>
            </div>

            <div class="call-subtitle-panel">
                <div style="font-size: 11px; color: var(--text-muted);" id="call-sub-original">Speak naturally...</div>
                <div style="font-size: 14px; color: var(--online-green); font-weight: 600; margin-top: 4px;" id="call-sub-translated">AI Live Translation Active</div>
            </div>

            <div>
                <button class="btn-hangup" onclick="hangupCall()">🛑</button>
            </div>
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let myPhone = localStorage.getItem("syncora_my_phone") || "";
        let targetPhone = urlParams.get('chat') || "";
        let currentRoom = "";
        let socket = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        // Call State
        let isCallActive = false;
        let callTimerInterval = null;
        let elapsedCallSecs = 0;

        window.onload = () => {
            if (myPhone) document.getElementById("my-phone-input").value = myPhone;
            if (targetPhone) {
                document.getElementById("target-phone-input").value = targetPhone;
                if (myPhone) startDirectTerminal();
            }
        };

        function makeRoomId(num1, num2) {
            const sorted = [num1.trim(), num2.trim()].sort();
            return `room_${sorted[0]}_${sorted[1]}`;
        }

        function startDirectTerminal() {
            myPhone = document.getElementById("my-phone-input").value.trim();
            targetPhone = document.getElementById("target-phone-input").value.trim();

            if (!myPhone || !targetPhone) {
                alert("Apna number aur partner ka number dono enter karein.");
                return;
            }

            localStorage.setItem("syncora_my_phone", myPhone);
            currentRoom = makeRoomId(myPhone, targetPhone);

            document.getElementById("landing-screen").style.display = "none";
            document.getElementById("chat-view").style.display = "flex";
            document.getElementById("partner-phone-label").innerText = targetPhone;
            document.getElementById("partner-avatar").innerText = targetPhone.slice(-2);

            initSocket();
            fetchHistory();
        }

        function exitChat() {
            if (socket) socket.close();
            document.getElementById("chat-view").style.display = "none";
            document.getElementById("landing-screen").style.display = "flex";
        }

        function initSocket() {
            const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
            socket = new WebSocket(`${wsProtocol}${window.location.host}/ws/${currentRoom}`);

            socket.onmessage = (event) => {
                if (typeof event.data === "string") {
                    const data = JSON.parse(event.data);
                    if (data.type === "text_message") {
                        appendBubble(data.text, 'received', data.translated, data.time);
                    } else if (data.type === "voice_note") {
                        appendVoiceBubble(data.audio, 'received', data.time);
                    } else if (data.type === "media_message") {
                        appendImageBubble(data.image, 'received', data.time);
                    } else if (data.type === "location_message") {
                        appendLocationBubble(data.lat, data.lng, 'received', data.time);
                    }
                }
            };
        }

        async function fetchHistory() {
            try {
                const res = await fetch(`/messages/${currentRoom}`);
                const data = await res.json();
                const box = document.getElementById("chat-box");
                box.innerHTML = "";
                if (data.messages) {
                    data.messages.forEach(msg => {
                        const isMe = msg.sender === myPhone;
                        const type = isMe ? 'sent' : 'received';
                        if (msg.type === "text_message") appendBubble(msg.text, type, msg.translated, msg.time);
                        if (msg.type === "voice_note") appendVoiceBubble(msg.audio, type, msg.time);
                        if (msg.type === "media_message") appendImageBubble(msg.image, type, msg.time);
                        if (msg.type === "location_message") appendLocationBubble(msg.lat, msg.lng, type, msg.time);
                    });
                }
            } catch (e) {}
        }

        /* 1. TEXT SEND & AUTO-TRANSLATE */
        async function sendTextMessage() {
            const input = document.getElementById("text-input");
            const text = input.value.trim();
            if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            let translated = "";

            if (document.getElementById("auto-translate-check").checked) {
                try {
                    const res = await fetch("/translate", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            text: text,
                            source_lang: document.getElementById("chat-source-lang").value,
                            target_lang: document.getElementById("chat-target-lang").value
                        })
                    });
                    const data = await res.json();
                    translated = data.translated_text || "";
                } catch (e) {}
            }

            const payload = {
                type: "text_message",
                text: text,
                translated: translated,
                sender: myPhone,
                time: timeStr
            };
            socket.send(JSON.stringify(payload));
            appendBubble(text, 'sent', translated, timeStr);
            input.value = "";
        }

        function appendBubble(text, type, translated = "", time = "") {
            const box = document.getElementById("chat-box");
            const bubble = document.createElement("div");
            bubble.className = `msg-bubble ${type}`;
            let html = `<div>${text}</div>`;
            if (translated && translated !== text) {
                html += `<div class="msg-translation">AI: ${translated}</div>`;
            }
            html += `<div class="msg-time">${time || 'now'}</div>`;
            bubble.innerHTML = html;
            box.appendChild(bubble);
            box.scrollTop = box.scrollHeight;
        }

        /* 2. VOICE NOTES (AUDIO RECORDING) */
        async function handleMicOrSend() {
            const text = document.getElementById("text-input").value.trim();
            if (text) {
                sendTextMessage();
                return;
            }

            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = () => {
                        const base64Audio = reader.result;
                        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        const payload = {
                            type: "voice_note",
                            audio: base64Audio,
                            sender: myPhone,
                            time: timeStr
                        };
                        socket.send(JSON.stringify(payload));
                        appendVoiceBubble(base64Audio, 'sent', timeStr);
                    };
                    reader.readAsDataURL(blob);
                };

                mediaRecorder.start();
                isRecording = true;
                const btn = document.getElementById("mic-send-btn");
                btn.classList.add("recording");
                btn.innerText = "⏹";
            } catch (err) {
                alert("Microphone permission required: " + err.message);
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }
            isRecording = false;
            const btn = document.getElementById("mic-send-btn");
            btn.classList.remove("recording");
            btn.innerText = "➤";
        }

        function appendVoiceBubble(audioBase64, type, time) {
            const box = document.getElementById("chat-box");
            const bubble = document.createElement("div");
            bubble.className = `msg-bubble ${type}`;
            bubble.innerHTML = `
                <div style="display:flex; align-items:center; gap:8px;">
                    <span>🎙️ Voice Note</span>
                    <audio controls src="${audioBase64}" style="max-width: 190px; height: 32px;"></audio>
                </div>
                <div class="msg-time">${time || 'now'}</div>
            `;
            box.appendChild(bubble);
            box.scrollTop = box.scrollHeight;
        }

        /* 3. IMAGE SHARING */
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
                const base64Img = evt.target.result;
                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const payload = {
                    type: "media_message",
                    image: base64Img,
                    sender: myPhone,
                    time: timeStr
                };
                socket.send(JSON.stringify(payload));
                appendImageBubble(base64Img, 'sent', timeStr);
            };
            reader.readAsDataURL(file);
        }

        function appendImageBubble(imgSrc, type, time) {
            const box = document.getElementById("chat-box");
            const bubble = document.createElement("div");
            bubble.className = `msg-bubble ${type}`;
            bubble.innerHTML = `
                <img src="${imgSrc}" class="msg-media-img" alt="Attached Media">
                <div class="msg-time">${time || 'now'}</div>
            `;
            box.appendChild(bubble);
            box.scrollTop = box.scrollHeight;
        }

        /* 4. LIVE LOCATION SHARING */
        function sendLiveLocation() {
            if (!navigator.geolocation) {
                alert("Browser mein location support nahi hai.");
                return;
            }
            navigator.geolocation.getCurrentPosition((pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const payload = {
                    type: "location_message",
                    lat: lat,
                    lng: lng,
                    sender: myPhone,
                    time: timeStr
                };
                socket.send(JSON.stringify(payload));
                appendLocationBubble(lat, lng, 'sent', timeStr);
            }, (err) => {
                alert("Location access denied: " + err.message);
            });
        }

        function appendLocationBubble(lat, lng, type, time) {
            const box = document.getElementById("chat-box");
            const bubble = document.createElement("div");
            bubble.className = `msg-bubble ${type}`;
            const mapUrl = `https://www.google.com/maps?q=${lat},${lng}`;
            bubble.innerHTML = `
                <a href="${mapUrl}" target="_blank" class="msg-location-link">
                    📍 Live Location (View in Maps)
                </a>
                <div class="msg-time">${time || 'now'}</div>
            `;
            box.appendChild(bubble);
            box.scrollTop = box.scrollHeight;
        }

        /* 5. CALL SCREEN & TIMER */
        function triggerCall(mode) {
            isCallActive = true;
            document.getElementById("call-overlay").style.display = "flex";
            document.getElementById("call-partner-name").innerText = targetPhone;
            document.getElementById("call-avatar").innerText = targetPhone.slice(-2);

            elapsedCallSecs = 0;
            clearInterval(callTimerInterval);
            callTimerInterval = setInterval(() => {
                elapsedCallSecs++;
                const mins = String(Math.floor(elapsedCallSecs / 60)).padStart(2, '0');
                const secs = String(elapsedCallSecs % 60).padStart(2, '0');
                document.getElementById("call-timer").innerText = `Connected • ${mins}:${secs}`;
            }, 1000);
        }

        function hangupCall() {
            isCallActive = false;
            clearInterval(callTimerInterval);
            document.getElementById("call-overlay").style.display = "none";
        }
    </script>
</body>
