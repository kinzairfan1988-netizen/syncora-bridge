<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncora - Audio Call & Translator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .call-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .logo { font-size: 28px; font-weight: 800; color: #38bdf8; margin-bottom: 6px; }
        .subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 24px; }
        .room-box {
            background: #0f172a;
            border: 1px dashed #475569;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 24px;
            word-break: break-all;
        }
        .room-box b { color: #38bdf8; }
        .btn-call {
            background: #10b981;
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 17px;
            font-weight: 700;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
        }
        .btn-call:hover { background: #059669; }
        .btn-call:disabled { background: #475569; cursor: not-allowed; }
        .btn-hangup {
            background: #ef4444;
            display: none;
        }
        .btn-hangup:hover { background: #dc2626; }
        .status-box {
            font-size: 14px;
            color: #cbd5e1;
            padding: 10px;
            background: rgba(51, 65, 85, 0.5);
            border-radius: 8px;
            margin-top: 10px;
        }
        .pulse {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            margin-right: 6px;
            animation: blink 1.2s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<div class="call-card">
    <div class="logo">Syncora Call</div>
    <div class="subtitle">Real-time Audio Calling with Translation</div>

    <div class="room-box">
        Room ID: <b id="roomText">Detecting...</b>
    </div>

    <button id="callBtn" class="btn-call" onclick="startCall()">Join Audio Call</button>
    <button id="hangupBtn" class="btn-call btn-hangup" onclick="endCall()">End Call</button>

    <div class="status-box" id="statusText">Ready to connect...</div>
    <audio id="remoteAudio" autoplay playsinline></audio>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const room = urlParams.get('room') || 'default_room';
    document.getElementById('roomText').innerText = room;

    const myId = 'user_' + Math.random().toString(36).substring(2, 8);
    const statusText = document.getElementById('statusText');
    const callBtn = document.getElementById('callBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const remoteAudio = document.getElementById('remoteAudio');

    let localStream = null;
    let peerConn = null;
    let ws = null;

    const rtcConfig = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
        ]
    };

    async function startCall() {
        callBtn.disabled = true;
        statusText.innerHTML = '<span class="pulse"></span>Microphone access manga ja raha hai...';

        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            connectSignaling();
        } catch (err) {
            statusText.innerText = 'Microphone permission error: ' + err.message;
            callBtn.disabled = false;
        }
    }

    function connectSignaling() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${window.location.host}/ws/${myId}`);

        ws.onopen = () => {
            statusText.innerHTML = '<span class="pulse"></span>Room se connect ho gaya. Doosre user ka intezar...';
            setupPeerConnection();
            ws.send(JSON.stringify({ action: 'join_room', room: room }));
            callBtn.style.display = 'none';
            hangupBtn.style.display = 'block';
        };

        ws.onmessage = async (e) => {
            const data = JSON.parse(e.data);

            if (data.action === 'user_joined') {
                statusText.innerHTML = '<span class="pulse"></span>User room mein agaya! Calling...';
                const offer = await peerConn.createOffer();
                await peerConn.setLocalDescription(offer);
                ws.send(JSON.stringify({ action: 'call_offer', offer: offer, room: room }));
            }
            else if (data.action === 'call_offer') {
                statusText.innerHTML = '<span class="pulse"></span>Call receive ho rahi hai...';
                await peerConn.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await peerConn.createAnswer();
                await peerConn.setLocalDescription(answer);
                ws.send(JSON.stringify({ action: 'call_answer', answer: answer, room: room }));
                statusText.innerHTML = '🟢 <b>Call Connected!</b> Audio live hai.';
            }
            else if (data.action === 'call_answer') {
                await peerConn.setRemoteDescription(new RTCSessionDescription(data.answer));
                statusText.innerHTML = '🟢 <b>Call Connected!</b> Audio live hai.';
            }
            else if (data.action === 'ice_candidate' && data.candidate) {
                try {
                    await peerConn.addIceCandidate(new RTCIceCandidate(data.candidate));
                } catch (err) {}
            }
            else if (data.action === 'call_end') {
                endCall(false);
            }
        };

        ws.onclose = () => {
            statusText.innerText = 'Server disconnected.';
        };
    }

    function setupPeerConnection() {
        peerConn = new RTCPeerConnection(rtcConfig);

        localStream.getTracks().forEach(track => {
            peerConn.addTrack(track, localStream);
        });

        peerConn.ontrack = (event) => {
            remoteAudio.srcObject = event.streams[0];
        };

        peerConn.onicecandidate = (event) => {
            if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: 'ice_candidate', candidate: event.candidate, room: room }));
            }
        };
    }

    function endCall(notify = true) {
        if (notify && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ action: 'call_end', room: room }));
        }
        if (peerConn) { peerConn.close(); peerConn = null; }
        if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
        if (ws) { ws.close(); ws = null; }

        callBtn.style.display = 'block';
        callBtn.disabled = false;
        hangupBtn.style.display = 'none';
        statusText.innerText = 'Call khatam ho gayi.';
    }
</script>

</body>
</html>
