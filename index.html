<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp Direct</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wa-bg: #0b141a;
            --wa-header: #202c33;
            --wa-card: #111b21;
            --wa-green: #00a884;
            --wa-green-bubble: #005c4b;
            --wa-received-bubble: #202c33;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --border-color: rgba(134, 150, 160, 0.15);
            --danger-red: #ea4335;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: #0c1317;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 920px;
            background-color: var(--wa-bg);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        @media (max-width: 480px) {
            .app-container { max-height: 100vh; border: none; }
        }

        /* 1. NUMBER ENTRY SCREEN */
        .landing-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 24px;
            text-align: center;
            background: var(--wa-card);
        }
        .landing-logo {
            width: 64px; height: 64px; border-radius: 50%;
            background: var(--wa-green); display: flex;
            align-items: center; justify-content: center;
            font-size: 32px; margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 168, 132, 0.3);
        }
        .landing-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .landing-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; }
        .phone-input-box {
            width: 100%;
            background: #2a3942;
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            margin-bottom: 12px;
        }
        .phone-input-box:focus { border-color: var(--wa-green); }
        .btn-start-chat {
            width: 100%;
            background: var(--wa-green);
            color: #111b21;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }

        /* 2. CHAT SCREEN */
        .chat-view {
            display: none;
            flex: 1;
            flex-direction: column;
            height: 100%;
            background: #0b141a;
            position: relative;
        }

        .chat-header {
            background: var(--wa-header);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }
        .chat-user-meta { display: flex; align-items: center; gap: 10px; }
        .chat-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: #6b7c85; display: flex; align-items: center;
            justify-content: center; font-weight: 700; font-size: 14px;
        }
        .chat-header-actions { display: flex; align-items: center; gap: 8px; }
        .icon-btn {
            background: transparent; border: none;
            color: var(--text-secondary); font-size: 19px;
            cursor: pointer; padding: 6px; border-radius: 50%;
        }
        .icon-btn:hover { color: var(--text-primary); }

        .chat-translate-bar {
            background: #182229;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .lang-select {
            background: #202c33; color: var(--wa-green);
            border: 1px solid var(--border-color); border-radius: 6px;
            padding: 3px 6px; font-size: 11px; outline: none;
        }

        .chat-messages-container {
            flex: 1;
            padding: 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
            background-size: 20px 20px;
        }

        .msg-bubble {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
            position: relative;
        }
        .msg-bubble.sent {
            align-self: flex-end;
            background: var(--wa-green-bubble);
            color: var(--text-primary);
            border-top-right-radius: 0;
        }
        .msg-bubble.received {
            align-self: flex-start;
            background: var(--wa-received-bubble);
            color: var(--text-primary);
            border-top-left-radius: 0;
        }
        .msg-time {
            font-size: 10px; color: rgba(255, 255, 255, 0.5);
            margin-top: 4px; text-align: right;
        }
        .msg-translation {
            font-size: 12px; color: #70e6c7;
            border-top: 1px dashed rgba(255, 255, 255, 0.15);
            margin-top: 4px; padding-top: 4px;
        }
        .msg-media-img {
            max-width: 100%; border-radius: 6px;
            margin-top: 4px; display: block;
        }
        .msg-location-link {
            display: flex; align-items: center; gap: 6px;
            color: #53bdeb; text-decoration: none; font-weight: 600;
        }

        /* BOTTOM INPUT BAR */
        .chat-input-bar {
            background: var(--wa-header);
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .input-pill {
            flex: 1;
            background: #2a3942;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 4px 12px;
        }
        .main-text-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 14px;
            padding: 8px 4px;
        }
        .btn-circle-action {
            width: 42px; height: 42px; border-radius: 50%;
            background: var(--wa-green); border: none;
            color: #111b21; display: flex; align-items: center;
            justify-content: center; font-size: 18px;
            cursor: pointer; flex-shrink: 0;
        }
        .btn-circle-action.recording {
            background: var(--danger-red);
            animation: pulseRecord 1s infinite alternate;
        }
        @keyframes pulseRecord { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* ACTIVE CALL MODAL */
        .call-overlay {
            position: absolute; inset: 0; background: #111b21;
            z-index: 100; display: none; flex-direction: column;
            justify-content: space-between; padding: 30px 20px;
        }
        .call-top { text-align: center; }
        .call-contact-name { font-size: 22px; font-weight: 700; margin-top: 10px; }
        .call-status { font-size: 13px; color: var(--wa-green); margin-top: 4px; }
        .call-sub-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px; padding: 14px; text-align: center;
        }
        .call-actions {
            display: flex; justify-content: center; gap: 20px;
        }
        .btn-hangup {
            width: 56px; height: 56px; border-radius: 50%;
            background: var(--danger-red); border: none;
            color: white; font-size: 22px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- 1. DIRECT NUMBER LOGIN / LANDING SCREEN -->
        <div class="landing-screen" id="landing-screen">
            <div class="landing-logo">💬</div>
            <h2 class="landing-title">WhatsApp Direct</h2>
            <p class="landing-desc">Direct chat & call bina kisi contact ko save kiye</p>

            <input type="tel" class="phone-input-box" id="my-phone-input" placeholder="Aapka Mobile Number (e.g. 03001234567)">
            <input type="tel" class="phone-input-box" id="target-phone-input" placeholder="Jisse baat karni hai uska Number">

            <button class="btn-start-chat" onclick="startDirectChat()">Start Chat</button>
        </div>

        <!-- 2. DIRECT CHAT VIEW -->
        <div class="chat-view" id="chat-view">
            <header class="chat-header">
                <div class="chat-user-meta">
                    <button class="icon-btn" onclick="exitChat()" style="margin-right: -4px;">←</button>
                    <div class="chat-avatar" id="chat-avatar">U</div>
                    <div>
                        <div style="font-size: 14px; font-weight: 700;" id="chat-partner-title">0300...</div>
                        <div style="font-size: 11px; color: var(--wa-green);">online</div>
                    </div>
                </div>
                <div class="chat-header-actions">
                    <button class="icon-btn" onclick="triggerCall('voice')" title="Voice Call">📞</button>
                    <button class="icon-btn" onclick="triggerCall('video')" title="Video Call">📹</button>
                    <button class="icon-btn" onclick="triggerCall('translate')" title="AI Translate Call">🌐</button>
                </div>
            </header>

            <!-- TRANSLATE BAR -->
            <div class="chat-translate-bar">
                <span>Auto-Translate Text:</span>
                <select class="lang-select" id="chat-source-lang">
                    <option value="ur">Urdu</option>
                    <option value="en">English</option>
                    <option value="ar">Arabic</option>
                </select>
                <span>➔</span>
                <select class="lang-select" id="chat-target-lang">
                    <option value="en">English</option>
                    <option value="ur">Urdu</option>
                    <option value="ar">Arabic</option>
                </select>
                <input type="checkbox" id="auto-translate-check" checked>
            </div>

            <!-- MESSAGES AREA -->
            <div class="chat-messages-container" id="chat-box"></div>

            <!-- BOTTOM INPUT BAR -->
            <div class="chat-input-bar">
                <div class="input-pill">
                    <input type="text" class="main-text-input" id="text-input" placeholder="Message" onkeypress="if(event.key==='Enter') sendTextMessage()">
                    <button class="icon-btn" onclick="document.getElementById('file-picker').click()" title="Send Image">📎</button>
                    <button class="icon-btn" onclick="sendLiveLocation()" title="Send Live Location">📍</button>
                    <input type="file" id="file-picker" accept="image/*" style="display:none;" onchange="handleFileUpload(event)">
                </div>
                <button class="btn-circle-action" id="mic-send-btn" onclick="handleMicOrSend()">➤</button>
            </div>
        </div>

        <!-- 3. ACTIVE CALL SCREEN -->
        <div class="call-overlay" id="call-overlay">
            <div class="call-top">
                <div class="chat-avatar" style="width: 70px; height: 70px; margin: 0 auto; font-size: 24px;" id="call-avatar">U</div>
                <div class="call-contact-name" id="call-contact-name">User</div>
                <div class="call-status" id="call-status-timer">Calling...</div>
            </div>

            <div class="call-sub-box">
                <div style="font-size: 12px; color: var(--text-secondary);" id="call-sub-original">Speak now...</div>
                <div style="font-size: 15px; color: var(--wa-green); font-weight: 600; margin-top: 4px;" id="call-sub-translated">Translation will appear here</div>
            </div>

            <div class="call-actions">
                <button class="btn-hangup" onclick="hangupCall()">🛑</button>
            </div>
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let myPhone = localStorage.getItem("syncora_wa_my_phone") || "";
        let targetPhone = urlParams.get('chat') || "";
        let currentRoom = "";
        let socket = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        // Call State
        let isCallActive = false;
        let callTimerInterval = null;
        let elapsedCallSecs = 0;

        window.onload = () => {
            if (myPhone) document.getElementById("my-phone-input").value = myPhone;
            if (targetPhone) {
                document.getElementById("target-phone-input").value = targetPhone;
                if (myPhone) startDirectChat();
            }
        };

        function makeRoomId(num1, num2) {
            const sorted = [num1.trim(), num2.trim()].sort();
            return `room_${sorted[0]}_${sorted[1]}`;
        }

        function startDirectChat() {
            myPhone = document.getElementById("my-phone-input").value.trim();
            targetPhone = document.getElementById("target-phone-input").value.trim();

            if (!myPhone || !targetPhone) {
                alert("Dono numbers enter karein!");
                return;
            }

            localStorage.setItem("syncora_wa_my_phone", myPhone);
            currentRoom = makeRoomId(myPhone, targetPhone);

            document.getElementById("landing-screen").style.display = "none";
            document.getElementById("chat-view").style.display = "flex";
            document.getElementById("chat-partner-title").innerText = targetPhone;
            document.getElementById("chat-avatar").innerText = targetPhone.slice(-2);

            initSocket();
            fetchHistory();
        }

        function exitChat() {
            if (socket) socket.close();
            document.getElementById("chat-view").style.display = "none";
            document.getElementById("landing-screen").style.display = "flex";
        }

        function initSocket() {
            const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
            socket = new WebSocket(`${wsProtocol}${window.location.host}/ws/${currentRoom}`);

            socket.onmessage = (event) => {
                if (typeof event.data === "string") {
                    const data = JSON.parse(event.data);
                    if (data.type === "text_message") {
                        appendBubble(data.text, 'received', data.translated, data.time);
                    } else if (data.type === "voice_note") {
                        appendVoiceBubble(data.audio, 'received', data.time);
                    } else if (data.type === "media_message") {
                        appendImageBubble(data.image, 'received', data.time);
                    } else if (data.type === "location_message") {
                        appendLocationBubble(data.lat, data.lng, 'received', data.time);
                    } else if (data.type === "call_signal") {
                        handleIncomingCallSignal(data);
                    }
                }
            };
        }

        async function fetchHistory() {
            try {
                const res = await fetch(`/messages/${currentRoom}`);
                const data = await res.json();
                const box = document.getElementById("chat-box");
                box.innerHTML = "";
                if (data.messages) {
                    data.messages.forEach(msg => {
                        const isMe = msg.sender === myPhone;
                        const type = isMe ? 'sent' : 'received';
                        if (msg.type === "text_message") appendBubble(msg.text, type, msg.translated, msg.time);
                        if (msg.type === "voice_note") appendVoiceBubble(msg.audio, type, msg.time);
                        if (msg.type === "media_message") appendImageBubble(msg.image, type, msg.time);
                        if (msg.type === "location_message") appendLocationBubble(msg.lat, msg.lng, type, msg.time);
                    });
                }
            } catch (e) {}
        }

        /* 1. TEXT & TRANSLATION */
        async function sendTextMessage() {
            const input = document.getElementById("text-input");
            const text = input.value.trim();
            if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            let translated = "";

            if (document.getElementById("auto-translate-check").checked) {
                try {
                    const res = await fetch("/translate", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            text: text,
                            source_lang: document.getElementById("chat-source-lang").value,
                            target_lang: document.getElementById("chat-target-lang").value
                        })
                    });
                    const data = await res.json();
                    translated = data.translated_text || "";
                } catch (e) {}
            }

            const payload = {
                type: "text_message",
                text: text,
                translated: translated,
                sender: myPhone,
                time: timeStr
            };
            socket.send(JSON.stringify(payload));
            appendBubble(text, 'sent', translated, timeStr);
            input.value = "";
        }

        function appendBubble(text, type, translated = "", time = "") {
            const box = document.getElementById("chat-box");
            const bubble = document.createElement("div");
            bubble.className = `msg-bubble ${type}`;
            let html = `<div>${text}</div>`;
            if (translated && translated !== text) {
                html += `<div class="msg-translation">${translated}</div>`;
            }
            html += `<div class="msg-time">${time || 'now'}</div>`;
            bubble.innerHTML = html;
            box.appendChild(bubble);
            box.scrollTop = box.scrollHeight;
        }

        /* 2. VOICE NOTES (PTT) */
        async function handleMicOrSend() {
            const text = document.getElementById("text-input").value.trim();
            if (text) {
                sendTextMessage();
                return;
            }

            // Voice recording toggle
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = () => {
                        const base64Audio = reader.result;
                        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                        const payload = {
                            type: "voice_note",
                            audio: base64Audio,
                            sender: myPhone,
                            time: timeStr
                        };
                        socket.send(JSON.stringify(payload));
                        appendVoiceBubble(base64Audio, 'sent', timeStr);
                    };
                    reader.readAsDataURL(blob);
                };

                mediaRecorder.start();
                isRecording = true;
                const btn = document.getElementById("mic-send-btn");
                btn.classList.add("recording");
                btn.innerText = "⏹";
            } catch (err) {
                alert("Microphone permission required: " + err.message);
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }
            isRecording = false;
            const btn = document.getElementById("mic-send-btn");
            btn.classList.remove("recording");
            btn.innerText = "➤";
        }

        function appendVoiceBubble(audioBase64, type, time) {
            const box = document.getElementById("chat-box");
            const bubble = document.createElement("div");
            bubble.className = `msg-bubble ${type}`;
            bubble.innerHTML = `
                <div style="display:flex; align-items:center; gap:8px;">
                    <span>🎤 Voice Note</span>
                    <audio controls src="${audioBase64}" style="max-width: 200px; height: 32px;"></audio>
                </div>
                <div class="msg-time">${time || 'now'}</div>
            `;
            box.appendChild(bubble);
            box.scrollTop = box.scrollHeight;
        }

        /* 3. IMAGE SHARING */
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
                const base64Img = evt.target.result;
                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const payload = {
                    type: "media_message",
                    image: base64Img,
                    sender: myPhone,
                    time: timeStr
                };
                socket.send(JSON.stringify(payload));
                appendImageBubble(base64Img, 'sent', timeStr);
            };
            reader.readAsDataURL(file);
        }

        function appendImageBubble(imgSrc, type, time) {
            const box = document.getElementById("chat-box");
            const bubble = document.createElement("div");
            bubble.className = `msg-bubble ${type}`;
            bubble.innerHTML = `
                <img src="${imgSrc}" class="msg-media-img" alt="Shared Media">
                <div class="msg-time">${time || 'now'}</div>
            `;
            box.appendChild(bubble);
            box.scrollTop = box.scrollHeight;
        }

        /* 4. LIVE LOCATION */
        function sendLiveLocation() {
            if (!navigator.geolocation) {
                alert("Browser mein GPS support nahi hai.");
                return;
            }
            navigator.geolocation.getCurrentPosition((pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const payload = {
                    type: "location_message",
                    lat: lat,
                    lng: lng,
                    sender: myPhone,
                    time: timeStr
                };
                socket.send(JSON.stringify(payload));
                appendLocationBubble(lat, lng, 'sent', timeStr);
            }, (err) => {
                alert("Location access denied: " + err.message);
            });
        }

        function appendLocationBubble(lat, lng, type, time) {
            const box = document.getElementById("chat-box");
            const bubble = document.createElement("div");
            bubble.className = `msg-bubble ${type}`;
            const mapUrl = `https://www.google.com/maps?q=${lat},${lng}`;
            bubble.innerHTML = `
                <a href="${mapUrl}" target="_blank" class="msg-location-link">
                    📍 Live Location (Google Maps)
                </a>
                <div class="msg-time">${time || 'now'}</div>
            `;
            box.appendChild(bubble);
            box.scrollTop = box.scrollHeight;
        }

        /* 5. CALLING & TRANSLATION TRIGGER */
        function triggerCall(mode) {
            isCallActive = true;
            document.getElementById("call-overlay").style.display = "flex";
            document.getElementById("call-contact-name").innerText = targetPhone;
            document.getElementById("call-avatar").innerText = targetPhone.slice(-2);
            document.getElementById("call-status-timer").innerText = "Connected";

            elapsedCallSecs = 0;
            clearInterval(callTimerInterval);
            callTimerInterval = setInterval(() => {
                elapsedCallSecs++;
                const mins = String(Math.floor(elapsedCallSecs / 60)).padStart(2, '0');
                const secs = String(elapsedCallSecs % 60).padStart(2, '0');
                document.getElementById("call-status-timer").innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function hangupCall() {
            isCallActive = false;
            clearInterval(callTimerInterval);
            document.getElementById("call-overlay").style.display = "none";
        }
    </script>
</body>
</html>
