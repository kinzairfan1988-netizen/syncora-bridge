<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncora - Direct Line</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .app-container { width: 100%; max-width: 480px; height: 100vh; background-color: #000000; display: flex; flex-direction: column; border: 1px solid #222; }
        @media (min-width: 481px) {
            .app-container { height: 90vh; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        }
        .screen { display: flex; flex-direction: column; height: 100%; width: 100%; }
        .hidden { display: none !important; }

        /* Auth Screen */
        .auth-content { padding: 40px 24px; display: flex; flex-direction: column; justify-content: center; height: 100%; text-align: center; background: #111827; }
        .auth-content h1 { color: #f59e0b; margin-bottom: 8px; font-size: 32px; font-weight: bold; }
        .auth-content p { color: #9ca3af; margin-bottom: 24px; font-size: 14px; }
        .input-field { width: 100%; padding: 14px 16px; background-color: #1f2937; border: 1px solid #374151; border-radius: 10px; color: #fff; font-size: 16px; margin-bottom: 16px; outline: none; }
        .input-field:focus { border-color: #f59e0b; }
        .btn { width: 100%; padding: 14px; background-color: #f59e0b; color: #000; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background-color: #d97706; }

        /* Chat Header */
        .chat-header { padding: 12px 16px; background-color: #121212; border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: space-between; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .back-arrow { color: #9ca3af; font-size: 18px; cursor: pointer; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #f59e0b; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; font-size: 15px; }
        .user-details h3 { font-size: 15px; color: #fff; font-weight: 600; }
        .status-indicator { font-size: 11px; color: #10b981; margin-top: 2px; }
        
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .action-icon { width: 34px; height: 34px; border-radius: 8px; background-color: #1f2937; border: none; color: #f59e0b; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }
        .action-icon.link-btn { width: auto; padding: 0 10px; font-size: 12px; color: #fff; gap: 4px; }

        /* Translate Bar */
        .translate-bar { padding: 10px 16px; background-color: #161e2e; border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #9ca3af; }
        .translate-bar select { background: #1f2937; color: #fff; border: 1px solid #374151; padding: 4px 8px; border-radius: 6px; font-size: 12px; outline: none; }
        .translate-bar span { color: #f59e0b; font-weight: bold; }

        /* Contact Bar for switching partner */
        .contact-bar { padding: 8px 16px; background-color: #0f172a; border-bottom: 1px solid #222; display: flex; gap: 8px; }
        .contact-bar input { margin: 0; padding: 6px 10px; font-size: 13px; background: #1e293b; border: 1px solid #334155; }
        .contact-bar button { width: auto; padding: 6px 12px; font-size: 13px; background: #f59e0b; color: #000; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; }

        /* Chat Messages */
        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background-color: #000; }
        .message { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .message.sent { background-color: #f59e0b; color: #000; align-self: flex-end; border-bottom-right-radius: 2px; font-weight: 500; }
        .message.received { background-color: #1f2937; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg-time { font-size: 9px; margin-top: 4px; text-align: right; opacity: 0.7; }

        /* Chat Footer */
        .chat-footer { padding: 12px 16px; background-color: #121212; border-top: 1px solid #222; display: flex; gap: 10px; align-items: center; }
        .chat-footer input { flex: 1; margin: 0; padding: 12px 16px; background-color: #1a1a1a; border: 1px solid #f59e0b; border-radius: 24px; color: #fff; font-size: 14px; outline: none; }
        .send-btn { width: 44px; height: 44px; border-radius: 50%; background-color: #f59e0b; border: none; color: #000; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: transform 0.1s; }
        .send-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- LOGIN SCREEN -->
        <div id="authScreen" class="screen auth-content">
            <h1>Syncora</h1>
            <p>Direct Line Secure Communication</p>
            <input type="text" id="phoneInput" class="input-field" placeholder="Enter Your Mobile Number">
            <button class="btn" onclick="loginUser()">Enter Direct Line</button>
        </div>

        <!-- CHAT SCREEN -->
        <div id="chatScreen" class="screen hidden">
            
            <!-- Header -->
            <div class="chat-header">
                <div class="user-info">
                    <span class="back-arrow">←</span>
                    <div class="avatar" id="headerAvatar">AF</div>
                    <div class="user-details">
                        <h3 id="headerTitle">Direct Line</h3>
                        <div class="status-indicator" id="statusText">Direct Line Active</div>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="action-icon" title="Call">📞</button>
                    <button class="action-icon" title="Video">📹</button>
                    <button class="action-icon" title="Translate">🌐</button>
                    <button class="action-icon link-btn" title="Link">📄 Link</button>
                </div>
            </div>

            <!-- Translate Bar -->
            <div class="translate-bar">
                <span>Translate:</span>
                <select id="sourceLang">
                    <option value="ur">Urdu (اردو)</option>
                    <option value="en">English</option>
                </select>
                <span>➔</span>
                <select id="targetLang">
                    <option value="en">English (US)</option>
                    <option value="ur">Urdu (اردو)</option>
                </select>
                <input type="checkbox" id="translateToggle" checked style="accent-color: #f59e0b;">
            </div>

            <!-- Partner Setup Bar -->
            <div class="contact-bar">
                <input type="text" id="partnerInput" placeholder="Partner Phone Number">
                <button onclick="connectPartner()">Connect</button>
            </div>

            <!-- Messages Area -->
            <div id="msgContainer" class="chat-messages"></div>

            <!-- Footer Input -->
            <div class="chat-footer">
                <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMsg()">
                <button class="send-btn" onclick="sendMsg()">➤</button>
            </div>
        </div>

    </div>

    <script>
        let myPhone = localStorage.getItem("sync_phone") || "";
        let currentPartner = localStorage.getItem("sync_partner") || "";
        let socket = null;

        if (myPhone) {
            document.getElementById("phoneInput").value = myPhone;
            showChatScreen();
        }

        async function loginUser() {
            const phone = document.getElementById("phoneInput").value.trim();
            if (!phone) {
                alert("Please enter a valid number.");
                return;
            }

            try {
                await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone })
                });
            } catch(e) {}

            localStorage.setItem("sync_phone", phone);
            myPhone = phone;
            showChatScreen();
        }

        function showChatScreen() {
            document.getElementById("authScreen").classList.add("hidden");
            document.getElementById("chatScreen").classList.remove("hidden");
            
            if (currentPartner) {
                document.getElementById("partnerInput").value = currentPartner;
                loadConversation();
            }
            initWebSocket();
        }

        function initWebSocket() {
            const proto = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            const wsUrl = `${proto}${window.location.host}/ws/${myPhone}`;
            
            socket = new WebSocket(wsUrl);

            socket.onopen = function() {
                console.log("Direct Line WebSocket Connected");
            };

            socket.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.action === "new_message") {
                    if (data.sender === currentPartner || data.sender === myPhone) {
                        appendMessage(data.content, data.sender === myPhone ? 'sent' : 'received', 'Just now');
                    }
                }
            };

            socket.onclose = function() {
                setTimeout(initWebSocket, 3000);
            };
        }

        async function connectPartner() {
            const partner = document.getElementById("partnerInput").value.trim();
            if (!partner) return;
            currentPartner = partner;
            localStorage.setItem("sync_partner", currentPartner);

            try {
                await fetch('/api/contacts/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_phone: myPhone, contact_phone: currentPartner })
                });
            } catch(e) {}

            document.getElementById("headerTitle").innerText = currentPartner;
            document.getElementById("headerAvatar").innerText = currentPartner.slice(-2).toUpperCase();
            loadConversation();
        }

        async function loadConversation() {
            if (!currentPartner) return;
            document.getElementById("headerTitle").innerText = currentPartner;
            document.getElementById("headerAvatar").innerText = currentPartner.slice(-2).toUpperCase();

            const res = await fetch(`/api/messages/${myPhone}/${currentPartner}`);
            const data = await res.json();
            
            const container = document.getElementById("msgContainer");
            container.innerHTML = "";
            
            if (data.messages) {
                data.messages.forEach(m => {
                    appendMessage(m.content, m.sender === myPhone ? 'sent' : 'received', 'Earlier');
                });
            }
        }

        async function sendMsg() {
            const input = document.getElementById("msgInput");
            let text = input.value.trim();
            if (!text || !currentPartner || !socket) return;

            let finalContent = text;
            const isTranslateEnabled = document.getElementById("translateToggle").checked;
            
            if (isTranslateEnabled) {
                const targetLang = document.getElementById("targetLang").value;
                try {
                    const tRes = await fetch('/translate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: text, target_lang: targetLang })
                    });
                    const tData = await tRes.json();
                    if (tData.translated_text) {
                        finalContent = `${text}\n🌐 ${tData.translated_text}`;
                    }
                } catch(e) {}
            }

            const payload = {
                action: "chat_message",
                receiver: currentPartner,
                msg_type: "text",
                content: finalContent,
                lang: "en"
            };

            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(payload));
                appendMessage(finalContent, 'sent', 'Just now');
                input.value = "";
            } else {
                alert("Connection reconnecting...");
            }
        }

        function appendMessage(text, type, time) {
            const container = document.getElementById("msgContainer");
            const div = document.createElement("div");
            div.className = `message ${type}`;
            div.innerHTML = `<div>${text.replace(/\n/g, '<br>')}</div><div class="msg-time">${time}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
