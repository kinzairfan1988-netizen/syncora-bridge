<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Syncora Voice Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #09090b;
            --surface-card: #121215;
            --surface-hover: #18181b;
            --border-graphite: #27272a;
            --border-subtle: rgba(255, 255, 255, 0.05);
            --accent-amber: #f59e0b;
            --accent-amber-dim: rgba(245, 158, 11, 0.12);
            --accent-amber-glow: rgba(245, 158, 11, 0.25);
            --danger-red: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.25);
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --online-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: var(--bg-obsidian);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .app-viewport {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 920px;
            background-color: var(--bg-obsidian);
            border: 1px solid var(--border-graphite);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8);
        }

        @media (max-width: 480px) {
            .app-viewport {
                max-height: 100vh;
                border: none;
            }
        }

        .top-navbar {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(9, 9, 11, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            z-index: 10;
        }

        .brand-cluster {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .brand-title span { color: var(--accent-amber); }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: var(--text-muted);
            background: var(--surface-card);
            padding: 3px 8px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
        }

        .dot-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .dot-indicator.live {
            background: var(--online-green);
            box-shadow: 0 0 6px var(--online-green);
        }

        .nav-actions { display: flex; gap: 8px; }

        .icon-btn {
            background: var(--surface-card);
            border: 1px solid var(--border-graphite);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            border-color: var(--accent-amber);
            background: var(--surface-hover);
        }

        .tab-segmented-bar {
            display: flex;
            padding: 8px 20px 14px 20px;
            gap: 8px;
            background: var(--bg-obsidian);
        }

        .tab-pill {
            flex: 1;
            padding: 8px 0;
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .tab-pill.active {
            background: var(--accent-amber-dim);
            color: var(--accent-amber);
            border-color: rgba(245, 158, 11, 0.3);
        }

        .directory-container {
            flex: 1;
            overflow-y: auto;
            padding: 4px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin: 10px 0 4px 4px;
        }

        .contact-card {
            background: var(--surface-card);
            border: 1px solid var(--border-graphite);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .contact-card:hover {
            border-color: rgba(245, 158, 11, 0.4);
            background: var(--surface-hover);
        }

        .user-identity {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: #1c1c21;
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-amber);
            position: relative;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            position: absolute;
            bottom: -2px;
            right: -2px;
            border: 2px solid var(--surface-card);
        }

        .status-dot.online { background: var(--online-green); }

        .user-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .contact-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .contact-sub {
            font-size: 12px;
            color: var(--text-muted);
        }

        .call-trigger-btn {
            background: var(--accent-amber-dim);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--accent-amber);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .call-trigger-btn:hover {
            background: var(--accent-amber);
            color: #000;
            box-shadow: 0 0 16px var(--accent-amber-glow);
        }

        /* SCREEN 2: IN-CALL OVERLAY */
        .call-screen-overlay {
            position: absolute;
            inset: 0;
            background: var(--bg-obsidian);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 24px 34px 24px;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .call-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .security-badge {
            font-size: 11px;
            color: var(--text-muted);
            background: var(--surface-card);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            margin-bottom: 8px;
        }

        .caller-title {
            font-size: 22px;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            color: var(--text-primary);
        }

        .caller-phone {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .call-duration {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-amber);
            font-variant-numeric: tabular-nums;
            margin-top: 4px;
        }

        .call-stage-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 20px 0;
        }

        .pulse-wave-ring {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: var(--accent-amber-dim);
            border: 1px solid rgba(245, 158, 11, 0.2);
            position: absolute;
            animation: ripple 2s infinite ease-out;
        }

        @keyframes ripple {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .caller-large-avatar {
            width: 108px;
            height: 108px;
            border-radius: 50%;
            background: #18181b;
            border: 2px solid var(--accent-amber);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 700;
            color: var(--accent-amber);
            position: relative;
            z-index: 2;
            box-shadow: 0 0 30px var(--accent-amber-glow);
        }

        .subtitles-box {
            background: var(--surface-card);
            border: 1px solid var(--border-graphite);
            border-radius: 14px;
            padding: 12px 16px;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            font-size: 12px;
            line-height: 1.4;
        }

        .sub-speaker {
            font-weight: 700;
            color: var(--accent-amber);
            font-size: 11px;
            text-transform: uppercase;
        }

        .sub-text {
            color: var(--text-primary);
        }

        .call-controls-row {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding-top: 10px;
        }

        .ctrl-btn-circle {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 1px solid var(--border-graphite);
            background: var(--surface-card);
            color: var(--text-primary);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .ctrl-btn-circle.active {
            background: var(--text-primary);
            color: #000;
        }

        .ctrl-btn-circle.hangup {
            background: var(--danger-red);
            border-color: var(--danger-red);
            color: white;
            box-shadow: 0 0 20px var(--danger-glow);
        }

        /* Incoming Call Dialog for Friend */
        .incoming-modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px;
        }

        .incoming-dialog {
            background: var(--surface-card);
            border: 1px solid var(--accent-amber);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px var(--accent-amber-glow);
        }

        .btn-answer {
            background: var(--online-green);
            color: white;
            font-weight: 700;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>

    <div class="app-viewport">
        <!-- SCREEN 1: MAIN DIRECTORY -->
        <header class="top-navbar">
            <div class="brand-cluster">
                <div class="brand-title">Syncora <span>Terminal</span></div>
                <div class="status-pill">
                    <span class="dot-indicator" id="status-dot"></span>
                    <span id="conn-status">Connecting</span>
                </div>
            </div>
            <div class="nav-actions">
                <button class="icon-btn" onclick="copyInviteLink()" id="copy-btn">📋 Share</button>
            </div>
        </header>

        <div class="tab-segmented-bar">
            <div class="tab-pill active">Contacts</div>
            <div class="tab-pill">Groups</div>
            <div class="tab-pill">Recents</div>
        </div>

        <main class="directory-container">
            <div class="section-label">Live Call Line</div>

            <div class="contact-card">
                <div class="user-identity">
                    <div class="avatar-box">
                        P2
                        <span class="status-dot online"></span>
                    </div>
                    <div class="user-meta">
                        <div class="contact-name">Direct Peer Partner</div>
                        <div class="contact-sub" id="room-sub">Room: Syncing...</div>
                    </div>
                </div>
                <button class="call-trigger-btn" onclick="startOutgoingCall()" title="Start Voice Call">📞</button>
            </div>
        </main>

        <!-- INCOMING CALL POPUP FOR FRIEND -->
        <div class="incoming-modal-backdrop" id="incoming-modal">
            <div class="incoming-dialog">
                <div style="font-size: 32px; margin-bottom: 8px;">📞</div>
                <h3 style="font-size: 18px; margin-bottom: 4px;">Incoming Voice Call</h3>
                <p style="font-size: 13px; color: var(--text-secondary);">Direct WebRTC Encrypted Line</p>
                <button class="btn-answer" onclick="acceptIncomingCall()">Tap to Answer</button>
            </div>
        </div>

        <!-- SCREEN 2: IN-CALL OVERLAY -->
        <section class="call-screen-overlay" id="call-screen">
            <div class="call-header">
                <div class="security-badge">🔒 Direct WebRTC Encrypted Voice</div>
                <div class="caller-title">Direct Partner</div>
                <div class="caller-phone" id="active-call-status">Calling...</div>
                <div class="call-duration" id="call-timer">00:00</div>
            </div>

            <div class="call-stage-center">
                <div class="pulse-wave-ring"></div>
                <div class="caller-large-avatar">P2</div>
            </div>

            <div class="subtitles-box">
                <div class="sub-speaker">Audio Protocol</div>
                <div class="sub-text" id="sub-caption">Connecting audio streams...</div>
            </div>

            <div class="call-controls-row">
                <button class="ctrl-btn-circle" id="mute-btn" onclick="toggleMute()" title="Mute">🎙️</button>
                <button class="ctrl-btn-circle hangup" onclick="hangupCall(true)" title="End Call">🛑</button>
            </div>
        </section>

        <!-- Audio element with direct attributes -->
        <audio id="peer-audio" autoplay playsinline></audio>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room') || ('call-' + Math.random().toString(36).substring(2, 7));
        if (!urlParams.get('room')) {
            window.history.replaceState(null, '', window.location.pathname + '?room=' + roomId);
        }
        document.getElementById("room-sub").innerText = `Room: ${roomId}`;

        let socket = null;
        let peerConnection = null;
        let localStream = null;
        let timerInterval = null;
        let elapsedSeconds = 0;
        let isMuted = false;
        let pendingOffer = null;

        // Expanded STUN servers to bypass 4G/Mobile data carrier firewalls
        const rtcConfig = {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" },
                { urls: "stun:stun2.l.google.com:19302" },
                { urls: "stun:stun3.l.google.com:19302" },
                { urls: "stun:stun4.l.google.com:19302" }
            ],
            iceCandidatePoolSize: 10
        };

        function copyInviteLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const btn = document.getElementById("copy-btn");
                btn.innerText = "✅ Done";
                setTimeout(() => { btn.innerText = "📋 Share"; }, 1500);
            });
        }

        function unlockAudioDriver() {
            const remoteAudio = document.getElementById("peer-audio");
            remoteAudio.play().catch(() => {});
        }

        function initSignaling() {
            const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
            socket = new WebSocket(`${wsProtocol}${window.location.host}/ws/${roomId}`);

            socket.onopen = () => {
                document.getElementById("status-dot").classList.add("live");
                document.getElementById("conn-status").innerText = "Online";
            };

            socket.onmessage = async (event) => {
                const data = JSON.parse(event.data);

                if (data.type === "offer") {
                    pendingOffer = data.offer;
                    document.getElementById("incoming-modal").style.display = "flex";
                } else if (data.type === "answer") {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                    document.getElementById("active-call-status").innerText = "Connected";
                    document.getElementById("sub-caption").innerText = "Normal 2-Way Voice Active (Single Language).";
                    startTimer();
                } else if (data.type === "candidate") {
                    if (peerConnection && peerConnection.remoteDescription) {
                        try {
                            await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                        } catch (e) {}
                    }
                } else if (data.type === "hangup") {
                    hangupCall(false);
                }
            };

            socket.onclose = () => {
                document.getElementById("status-dot").classList.remove("live");
                document.getElementById("conn-status").innerText = "Offline";
                setTimeout(initSignaling, 2000);
            };
        }

        async function setupMedia() {
            if (!localStream) {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    },
                    video: false
                });
            }
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = (event) => {
                const remoteAudio = document.getElementById("peer-audio");
                if (event.streams && event.streams[0]) {
                    remoteAudio.srcObject = event.streams[0];
                    remoteAudio.play().catch(() => {});
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        type: "candidate",
                        candidate: event.candidate
                    }));
                }
            };

            peerConnection.oniceconnectionstatechange = () => {
                if (peerConnection.iceConnectionState === "connected") {
                    document.getElementById("active-call-status").innerText = "Connected";
                    document.getElementById("sub-caption").innerText = "Crystal Clear Audio Active";
                }
            };
        }

        async function startOutgoingCall() {
            unlockAudioDriver();
            try {
                await setupMedia();
                createPeerConnection();

                document.getElementById("call-screen").style.display = "flex";
                document.getElementById("active-call-status").innerText = "Calling...";
                document.getElementById("sub-caption").innerText = "Ringing peer...";

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                socket.send(JSON.stringify({
                    type: "offer",
                    offer: offer
                }));
            } catch (err) {
                alert("Microphone permission required: " + err.message);
            }
        }

        async function acceptIncomingCall() {
            unlockAudioDriver();
            document.getElementById("incoming-modal").style.display = "none";
            try {
                await setupMedia();
                createPeerConnection();

                document.getElementById("call-screen").style.display = "flex";
                document.getElementById("active-call-status").innerText = "Connected";
                document.getElementById("sub-caption").innerText = "Normal 2-Way Voice Active.";
                startTimer();

                await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingOffer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                socket.send(JSON.stringify({
                    type: "answer",
                    answer: answer
                }));
            } catch (err) {
                alert("Error connecting call: " + err.message);
            }
        }

        function startTimer() {
            elapsedSeconds = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                elapsedSeconds++;
                const mins = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
                const secs = String(elapsedSeconds % 60).padStart(2, '0');
                document.getElementById("call-timer").innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function hangupCall(sendSignal = true) {
            clearInterval(timerInterval);
            document.getElementById("call-timer").innerText = "00:00";
            document.getElementById("incoming-modal").style.display = "none";

            if (sendSignal && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: "hangup" }));
            }

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }

            document.getElementById("call-screen").style.display = "none";
        }

        function toggleMute() {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks().forEach(track => {
                track.enabled = !isMuted;
            });

            const btn = document.getElementById("mute-btn");
            if (isMuted) {
                btn.classList.add("active");
                btn.innerText = "🔇";
            } else {
                btn.classList.remove("active");
                btn.innerText = "🎙️";
            }
        }

        window.onload = () => {
            initSignaling();
        };
    </script>
</body>
</html>
