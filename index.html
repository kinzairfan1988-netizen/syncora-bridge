<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Syncora Workspace | AI Bilateral Bridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0e17;
            --surface-card: rgba(18, 24, 38, 0.75);
            --surface-elevated: rgba(30, 41, 59, 0.6);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --accent-primary: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --success-color: #22c55e;
            --danger-color: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at 50% 0%, #172554 0%, var(--bg-base) 65%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(10, 14, 23, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            flex-wrap: wrap;
            gap: 10px;
        }

        .brand-cluster { display: flex; align-items: center; gap: 10px; }
        .brand-logo {
            width: 28px; height: 28px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; color: white; font-size: 14px;
        }
        .brand-title { font-size: 15px; font-weight: 600; }

        .room-actions { display: flex; align-items: center; gap: 8px; }
        .room-badge {
            background: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            padding: 5px 10px; border-radius: 16px;
            font-size: 12px; display: flex; align-items: center; gap: 6px;
            color: var(--text-muted);
        }
        .room-badge b { color: var(--accent-primary); }

        .status-pill {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 11px; color: var(--text-muted);
        }
        .dot-indicator { width: 7px; height: 7px; border-radius: 50%; background: #64748b; }
        .dot-indicator.live { background: var(--success-color); box-shadow: 0 0 8px var(--success-color); }

        .btn-secondary {
            background: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 5px 10px; border-radius: 8px;
            font-size: 11px; font-weight: 500; cursor: pointer;
        }

        .workspace-container {
            max-width: 1200px; width: 100%; margin: 0 auto;
            padding: 16px 14px 90px 14px;
            flex: 1; display: grid; grid-template-columns: 1fr 380px; gap: 16px;
        }

        @media (max-width: 900px) {
            .workspace-container { grid-template-columns: 1fr; padding-bottom: 95px; }
        }

        .meeting-stage { display: flex; flex-direction: column; gap: 14px; }
        .participant-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .tile-card {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px; padding: 16px 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 150px; backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }
        .tile-card.speaking {
            border-color: var(--success-color);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
        }

        .avatar-frame {
            width: 58px; height: 58px; border-radius: 50%;
            background: #1e293b; border: 2px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; margin-bottom: 8px;
        }

        .participant-name { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
        .participant-lang-tag {
            font-size: 10px; color: var(--accent-primary);
            background: var(--accent-glow); padding: 2px 8px;
            border-radius: 10px; font-weight: 500;
        }

        .config-strip {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 8px; padding: 12px;
            background: rgba(10, 14, 23, 0.6);
            border: 1px solid var(--border-subtle); border-radius: 14px;
        }
        @media (max-width: 600px) {
            .config-strip { grid-template-columns: 1fr 1fr; }
        }

        .config-field { display: flex; flex-direction: column; gap: 3px; }
        .config-field label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        .select-input, .text-input {
            background: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 6px 8px; border-radius: 6px; font-size: 12px; outline: none; width: 100%;
        }

        .sidebar-panel {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px; display: flex; flex-direction: column;
            overflow: hidden; backdrop-filter: blur(12px);
        }
        .panel-header {
            padding: 10px 14px; border-bottom: 1px solid var(--border-subtle);
            font-size: 11px; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        .transcript-feed {
            flex: 1; padding: 12px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
            min-height: 250px; max-height: 380px;
        }
        @media (max-width: 900px) {
            .transcript-feed { max-height: 40vh; min-height: 180px; }
        }

        .feed-item {
            display: flex; flex-direction: column; gap: 3px;
            padding: 10px 12px; border-radius: 10px;
            background: var(--surface-elevated);
            font-size: 12px; line-height: 1.4; border-left: 3px solid transparent;
        }
        .feed-item.me { border-left-color: var(--accent-primary); }
        .feed-item.partner { border-left-color: var(--success-color); }
        .item-author { font-size: 10px; font-weight: 600; color: var(--text-muted); }
        .item-original { color: #cbd5e1; }
        .item-translated { color: var(--success-color); font-weight: 600; }

        .bottom-call-dock {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 12px 16px; display: flex; justify-content: center; align-items: center;
            gap: 12px; background: rgba(10, 14, 23, 0.95);
            border-top: 1px solid var(--border-subtle); backdrop-filter: blur(16px); z-index: 100;
        }
        .dock-btn {
            border: none; padding: 10px 24px; border-radius: 50px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 6px; color: white;
        }
        .btn-start { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .btn-end { background: linear-gradient(135deg, #ef4444, #dc2626); display: none; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand-cluster">
            <div class="brand-logo">S</div>
            <div class="brand-title">Syncora Workspace</div>
            <div class="status-pill">
                <span class="dot-indicator" id="status-dot"></span>
                <span id="call-status">Connecting...</span>
            </div>
        </div>

        <div class="room-actions">
            <div class="room-badge">
                <span>Room:</span>
                <b id="room-display">...</b>
            </div>
            <button class="btn-secondary" id="copy-btn" onclick="copyInviteLink()">📋 Copy</button>
        </div>
    </nav>

    <main class="workspace-container">
        <section class="meeting-stage">
            <div class="participant-tiles">
                <div class="tile-card" id="local-tile">
                    <div class="avatar-frame">🎙️</div>
                    <div class="participant-name" id="local-name-label">Ali (You)</div>
                    <div class="participant-lang-tag" id="local-lang-label">Urdu</div>
                </div>

                <div class="tile-card" id="remote-tile">
                    <div class="avatar-frame">🔊</div>
                    <div class="participant-name">Partner</div>
                    <div class="participant-lang-tag" id="remote-lang-label">English</div>
                </div>
            </div>

            <div class="config-strip">
                <div class="config-field">
                    <label>Your Name</label>
                    <input type="text" id="username" class="text-input" value="Ali" oninput="updateNames()">
                </div>
                <div class="config-field">
                    <label>Voice</label>
                    <select id="gender" class="select-input">
                        <option value="male" selected>👨 Male</option>
                        <option value="female">👩 Female</option>
                    </select>
                </div>
                <div class="config-field">
                    <label>I Speak</label>
                    <select id="my-lang" class="select-input" onchange="syncLanguages()">
                        <option value="ur-PK" selected>🇵🇰 Urdu</option>
                        <option value="en-US">🇬🇧 English</option>
                        <option value="ms-MY">🇲🇾 Malay</option>
                        <option value="zh-CN">🇨🇳 Chinese</option>
                    </select>
                </div>
                <div class="config-field">
                    <label>Partner Hears</label>
                    <select id="target-lang" class="select-input" onchange="syncLanguages()">
                        <option value="en-US" selected>🇬🇧 English</option>
                        <option value="ms-MY">🇲🇾 Malay</option>
                        <option value="ur-PK">🇵🇰 Urdu</option>
                        <option value="zh-CN">🇨🇳 Chinese</option>
                    </select>
                </div>
            </div>
        </section>

        <aside class="sidebar-panel">
            <div class="panel-header">Interpretation Feed</div>
            <div class="transcript-feed" id="captions">
                <div id="placeholder-msg" style="text-align: center; color: var(--text-muted); font-size: 12px; margin: auto;">
                    Tap "Start Call" below to begin live interpretation.
                </div>
            </div>
        </aside>
    </main>

    <footer class="bottom-call-dock">
        <button class="dock-btn btn-start" id="start-call-btn" onclick="startCall()">📞 Start Call</button>
        <button class="dock-btn btn-end" id="end-call-btn" onclick="endCall()">🛑 End Call</button>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room') || ('call-' + Math.random().toString(36).substring(2, 7));
        if (!urlParams.get('room')) {
            window.history.replaceState(null, '', window.location.pathname + '?room=' + roomId);
        }
        document.getElementById("room-display").innerText = roomId;

        const myClientId = 'user_' + Math.random().toString(36).substring(2, 9);
        let socket = null;
        let recognition = null;
        let isCallActive = false;

        const audioQueue = [];
        let isPlayingAudio = false;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function copyInviteLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const btn = document.getElementById("copy-btn");
                btn.innerText = "✅ Done";
                setTimeout(() => { btn.innerText = "📋 Copy"; }, 1500);
            });
        }

        function updateNames() {
            const name = document.getElementById("username").value || "Ali";
            document.getElementById("local-name-label").innerText = `${name} (You)`;
        }

        function syncLanguages() {
            const myLangSelect = document.getElementById("my-lang");
            const tgtLangSelect = document.getElementById("target-lang");
            document.getElementById("local-lang-label").innerText = myLangSelect.options[myLangSelect.selectedIndex].text;
            document.getElementById("remote-lang-label").innerText = tgtLangSelect.options[tgtLangSelect.selectedIndex].text;
        }

        function initSocket() {
            const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
            const wsUrl = `${wsProtocol}${window.location.host}/ws/${roomId}`;
            
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                document.getElementById("status-dot").classList.add("live");
                document.getElementById("call-status").innerText = "Connected";
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const isMe = (data.sender_id === myClientId);

                appendTranscript(data.sender_name, data.original, data.translated, isMe);

                if (!isMe && data.translated) {
                    audioQueue.push({ text: data.translated, lang: data.target_lang, gender: data.gender });
                    processAudioQueue();
                }
            };

            socket.onclose = () => {
                document.getElementById("status-dot").classList.remove("live");
                document.getElementById("call-status").innerText = "Disconnected";
                setTimeout(initSocket, 1500);
            };

            socket.onerror = () => {
                document.getElementById("status-dot").classList.remove("live");
                document.getElementById("call-status").innerText = "Disconnected";
            };
        }

        function appendTranscript(sender, orig, trans, isMe) {
            const placeholder = document.getElementById("placeholder-msg");
            if (placeholder) placeholder.remove();

            const feed = document.getElementById("captions");
            const item = document.createElement("div");
            item.className = "feed-item " + (isMe ? "me" : "partner");
            item.innerHTML = `
                <div class="item-author">${sender} ${isMe ? "(You)" : ""}</div>
                <div class="item-original">${orig}</div>
                <div class="item-translated">➔ ${trans}</div>
            `;
            feed.appendChild(item);
            feed.scrollTop = feed.scrollHeight;
        }

        function processAudioQueue() {
            if (isPlayingAudio || audioQueue.length === 0) return;

            isPlayingAudio = true;
            const current = audioQueue.shift();

            if (recognition) {
                try { recognition.abort(); } catch(e) {}
            }

            const remoteTile = document.getElementById("remote-tile");
            remoteTile.classList.add("speaking");

            const cleanLang = (current.lang || "en").split("-")[0].toLowerCase();
            const url = `/tts?text=${encodeURIComponent(current.text)}&lang=${encodeURIComponent(cleanLang)}&gender=${encodeURIComponent(current.gender)}`;
            const audio = new Audio(url);

            const finishAudio = () => {
                remoteTile.classList.remove("speaking");
                isPlayingAudio = false;

                if (audioQueue.length > 0) {
                    processAudioQueue();
                } else {
                    setTimeout(() => {
                        if (isCallActive) startListening();
                    }, 300);
                }
            };

            audio.onended = finishAudio;
            audio.onerror = finishAudio;
            audio.play().catch(finishAudio);
        }

        function startListening() {
            if (!recognition || !isCallActive || isPlayingAudio) return;
            try {
                recognition.abort();
            } catch(e) {}
            try {
                recognition.lang = document.getElementById("my-lang").value;
                recognition.start();
            } catch(e) {}
        }

        function setupSpeechRecognition() {
            if (!SpeechRecognition) {
                alert("Please use Chrome or Edge browser.");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                document.getElementById("local-tile").classList.add("speaking");
            };

            recognition.onresult = (event) => {
                if (!isCallActive || isPlayingAudio) return;

                const transcript = event.results[0][0].transcript.trim();
                if (!transcript) return;

                const myLangVal = document.getElementById("my-lang").value;
                const targetLangVal = document.getElementById("target-lang").value;

                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        sender_id: myClientId,
                        sender_name: document.getElementById("username").value || "Ali",
                        gender: document.getElementById("gender").value,
                        source_lang: myLangVal,
                        target_lang: targetLangVal,
                        text: transcript
                    }));
                }
            };

            recognition.onend = () => {
                document.getElementById("local-tile").classList.remove("speaking");
                if (isCallActive && !isPlayingAudio) {
                    setTimeout(startListening, 200);
                }
            };
        }

        function startCall() {
            isCallActive = true;
            document.getElementById("start-call-btn").style.display = "none";
            document.getElementById("end-call-btn").style.display = "flex";

            // Audio unlock
            const unlock = new Audio();
            unlock.play().catch(() => {});

            setupSpeechRecognition();
            startListening();
        }

        function endCall() {
            isCallActive = false;
            audioQueue.length = 0;
            isPlayingAudio = false;

            document.getElementById("start-call-btn").style.display = "flex";
            document.getElementById("end-call-btn").style.display = "none";

            if (recognition) try { recognition.abort(); } catch(e) {}

            document.getElementById("local-tile").classList.remove("speaking");
            document.getElementById("remote-tile").classList.remove("speaking");
        }

        window.onload = () => {
            initSocket();
            syncLanguages();
            updateNames();
        };
    </script>
</body>
</html>
