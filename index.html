<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncora Bilateral Call</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #090d16;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .call-card {
            width: 100%;
            max-width: 480px;
            background: #131d2e;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            border: 1px solid #1e293b;
        }
        .header {
            text-align: center;
            margin-bottom: 14px;
        }
        .header h2 {
            margin: 0 0 6px 0;
            color: #38bdf8;
            font-size: 20px;
        }
        .room-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0b111c;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 14px;
            border: 1px dashed #334155;
        }
        .room-info { font-size: 13px; color: #94a3b8; }
        .room-info b { color: #38bdf8; }
        .copy-btn {
            background: #334155;
            color: #f8fafc;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #0f172a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #94a3b8;
            margin: auto;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
        }
        .dot.active {
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }
        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
            background: #0b111c;
            padding: 12px;
            border-radius: 16px;
        }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .field-group label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: bold;
        }
        select, input {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            width: 100%;
        }
        .live-captions {
            background: #0b111c;
            border-radius: 14px;
            height: 180px;
            overflow-y: auto;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .transcript-item {
            font-size: 13px;
            line-height: 1.4;
            padding: 8px 10px;
            border-radius: 10px;
            background: #131d2e;
        }
        .transcript-item.me { border-left: 3px solid #38bdf8; }
        .transcript-item.partner { border-left: 3px solid #22c55e; }
        .transcript-item .user { font-size: 11px; font-weight: bold; margin-bottom: 2px; }
        .transcript-item.me .user { color: #38bdf8; }
        .transcript-item.partner .user { color: #22c55e; }
        .transcript-item .orig { color: #94a3b8; }
        .transcript-item .trans { color: #f8fafc; font-weight: 500; margin-top: 2px; }
        .call-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .call-btn {
            border: none;
            border-radius: 50px;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            color: white;
            flex: 1;
            justify-content: center;
        }
        .start-btn { background: #22c55e; }
        .start-btn:hover { background: #16a34a; }
        .end-btn { background: #ef4444; display: none; }
        .end-btn:hover { background: #dc2626; }
    </style>
</head>
<body>

<div class="call-card">
    <div class="header">
        <h2>⚡ Syncora Call Bridge</h2>
        <div class="status-badge">
            <span class="dot" id="status-dot"></span>
            <span id="call-status">Disconnected</span>
        </div>
    </div>

    <div class="room-bar">
        <div class="room-info">Room: <b id="room-display">...</b></div>
        <button class="copy-btn" id="copy-btn" onclick="copyInviteLink()">📋 Copy Invite Link</button>
    </div>

    <div class="config-grid">
        <div class="field-group">
            <label>Your Name</label>
            <input type="text" id="username" value="Ali">
        </div>
        <div class="field-group">
            <label>Voice Gender</label>
            <select id="gender">
                <option value="male" selected>👨 Male</option>
                <option value="female">👩 Female</option>
            </select>
        </div>
        <div class="field-group">
            <label>I Speak</label>
            <select id="my-lang">
                <option value="ur-PK" selected>🇵🇰 Urdu</option>
                <option value="en-US">🇬🇧 English</option>
                <option value="zh-CN">🇨🇳 Chinese</option>
                <option value="ms-MY">🇲🇾 Malay</option>
                <option value="ar-SA">🇸🇦 Arabic</option>
            </select>
        </div>
        <div class="field-group">
            <label>Partner Hears</label>
            <select id="target-lang">
                <option value="en-US" selected>🇬🇧 English</option>
                <option value="ms-MY">🇲🇾 Malay</option>
                <option value="ur-PK">🇵🇰 Urdu</option>
                <option value="zh-CN">🇨🇳 Chinese</option>
                <option value="ar-SA">🇸🇦 Arabic</option>
            </select>
        </div>
    </div>

    <div class="live-captions" id="captions">
        <div id="placeholder-msg" style="text-align: center; color: #475569; font-size: 12px; margin: auto;">
            Link copy kar ke partner ko bhejein aur "Start Call" karein.
        </div>
    </div>

    <div class="call-actions">
        <button class="call-btn start-btn" id="start-call-btn" onclick="startCall()">
            📞 Start / Join Call
        </button>
        <button class="call-btn end-btn" id="end-call-btn" onclick="endCall()">
            🛑 End Call
        </button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    let roomId = urlParams.get('room');
    if (!roomId) {
        roomId = 'call-' + Math.random().toString(36).substring(2, 7);
        window.history.replaceState(null, '', window.location.pathname + '?room=' + roomId);
    }
    document.getElementById("room-display").innerText = roomId;

    const myClientId = 'user_' + Math.random().toString(36).substring(2, 9);

    let socket = null;
    let recognition = null;
    let isCallActive = false;
    let isPlayingAudio = false;
    let currentAudio = null;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function copyInviteLink() {
        navigator.clipboard.writeText(window.location.href).then(() => {
            const btn = document.getElementById("copy-btn");
            btn.innerText = "✅ Link Copied!";
            btn.style.background = "#22c55e";
            setTimeout(() => {
                btn.innerText = "📋 Copy Invite Link";
                btn.style.background = "#334155";
            }, 2000);
        });
    }

    function initSocket() {
        const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
        socket = new WebSocket(`${wsProtocol}${window.location.host}/ws/${roomId}`);

        socket.onopen = () => {
            document.getElementById("status-dot").classList.add("active");
            document.getElementById("call-status").innerText = "Call Connected";
        };

        socket.onmessage = (event) => {
            if (!isCallActive) return;
            const data = JSON.parse(event.data);
            const isMe = (data.sender_id === myClientId);

            appendCaption(data.sender_name, data.original, data.translated, isMe);

            // Audio sirf samne wale ke device par bajegi, bolne wale ke speaker par bilkul nahi!
            if (!isMe) {
                playLiveSpeech(data.translated, data.target_lang, data.gender);
            }
        };

        socket.onclose = () => {
            document.getElementById("status-dot").classList.remove("active");
            document.getElementById("call-status").innerText = "Disconnected";
        };
    }

    function appendCaption(sender, orig, trans, isMe) {
        const placeholder = document.getElementById("placeholder-msg");
        if (placeholder) placeholder.remove();

        const captions = document.getElementById("captions");
        const item = document.createElement("div");
        item.className = "transcript-item " + (isMe ? "me" : "partner");
        item.innerHTML = `
            <div class="user">${sender} ${isMe ? "(You)" : "(Partner)"}</div>
            <div class="orig">${orig}</div>
            <div class="trans">👉 ${trans}</div>
        `;
        captions.appendChild(item);
        captions.scrollTop = captions.scrollHeight;
    }

    function playLiveSpeech(text, lang, gender) {
        if (!isCallActive || !text) return;

        // Speaker se aawaz aate hi mic foran stop (taake echo/loop na banay)
        isPlayingAudio = true;
        if (recognition) {
            try { recognition.abort(); } catch(e) {}
        }

        if (currentAudio) {
            currentAudio.pause();
            currentAudio = null;
        }

        const url = `/tts?text=${encodeURIComponent(text)}&lang=${encodeURIComponent(lang)}&gender=${encodeURIComponent(gender)}`;
        currentAudio = new Audio(url);

        const resumeMic = () => {
            currentAudio = null;
            setTimeout(() => {
                isPlayingAudio = false;
                if (isCallActive && recognition) {
                    try { recognition.start(); } catch(e) {}
                }
            }, 400);
        };

        currentAudio.onended = resumeMic;
        currentAudio.onerror = resumeMic;
        currentAudio.play().catch(resumeMic);
    }

    function setupSpeechRecognition() {
        if (!SpeechRecognition) {
            alert("Please open this link in Chrome or Edge.");
            return;
        }

        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            if (!isCallActive || isPlayingAudio) return;

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    const transcript = event.results[i][0].transcript.trim();
                    if (!transcript) continue;

                    const myLang = document.getElementById("my-lang").value;
                    const partnerLang = document.getElementById("target-lang").value;

                    if (socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({
                            sender_id: myClientId,
                            sender_name: document.getElementById("username").value || "Caller",
                            gender: document.getElementById("gender").value,
                            source_lang: myLang,
                            target_lang: partnerLang,
                            text: transcript
                        }));
                    }
                }
            }
        };

        recognition.onend = () => {
            // Sirf tab dobara start ho jab call active ho aur speaker na baj raha ho
            if (isCallActive && !isPlayingAudio) {
                try {
                    recognition.lang = document.getElementById("my-lang").value;
                    recognition.start();
                } catch(e) {}
            }
        };
    }

    function startCall() {
        isCallActive = true;
        isPlayingAudio = false;
        document.getElementById("start-call-btn").style.display = "none";
        document.getElementById("end-call-btn").style.display = "flex";

        initSocket();
        setupSpeechRecognition();

        recognition.lang = document.getElementById("my-lang").value;
        try { recognition.start(); } catch(e) {}
    }

    function endCall() {
        isCallActive = false;
        isPlayingAudio = false;
        document.getElementById("start-call-btn").style.display = "flex";
        document.getElementById("end-call-btn").style.display = "none";

        if (recognition) {
            try { recognition.abort(); } catch(e) {}
        }
        if (currentAudio) {
            currentAudio.pause();
            currentAudio = null;
        }
        if (socket) {
            socket.close();
        }
    }
</script>

</body>
</html>
