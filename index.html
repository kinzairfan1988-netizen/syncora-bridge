<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncora Bilateral Bridge</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #090d16;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .call-card {
            width: 100%;
            max-width: 480px;
            background: #131d2e;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            border: 1px solid #1e293b;
        }
        .header {
            text-align: center;
            margin-bottom: 14px;
        }
        .header h2 {
            margin: 0 0 6px 0;
            color: #38bdf8;
            font-size: 20px;
        }
        .room-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0b111c;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 14px;
            border: 1px dashed #334155;
        }
        .room-info { font-size: 13px; color: #94a3b8; }
        .room-info b { color: #38bdf8; }
        .copy-btn {
            background: #334155;
            color: #f8fafc;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #0f172a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #94a3b8;
            margin: auto;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
        }
        .dot.active {
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }
        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
            background: #0b111c;
            padding: 12px;
            border-radius: 16px;
        }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .field-group label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: bold;
        }
        select, input {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            width: 100%;
        }
        
        .live-captions {
            background: #0b111c;
            border-radius: 14px;
            height: 200px;
            overflow-y: auto;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .transcript-item {
            font-size: 13px;
            line-height: 1.4;
            padding: 8px 10px;
            border-radius: 10px;
            background: #131d2e;
        }
        .transcript-item.me { border-left: 3px solid #38bdf8; }
        .transcript-item.partner { border-left: 3px solid #22c55e; }
        .transcript-item .user { font-size: 11px; font-weight: bold; margin-bottom: 2px; }
        .transcript-item.me .user { color: #38bdf8; }
        .transcript-item.partner .user { color: #22c55e; }
        .transcript-item .orig { color: #94a3b8; }
        .transcript-item .trans { color: #f8fafc; font-weight: 500; margin-top: 2px; }
        
        /* Walkie-Talkie Button */
        .ptt-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .ptt-btn {
            background: #334155;
            color: white;
            border: 4px solid #1e293b;
            border-radius: 50%;
            width: 90px;
            height: 90px;
            font-size: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.1s ease-in-out;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .ptt-btn.recording {
            background: #22c55e;
            border-color: #16a34a;
            transform: scale(0.95);
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.6);
        }
        .ptt-hint {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="call-card">
    <div class="header">
        <h2>⚡ Syncora Room</h2>
        <div class="status-badge">
            <span class="dot" id="status-dot"></span>
            <span id="call-status">Connecting...</span>
        </div>
    </div>

    <div class="room-bar">
        <div class="room-info">Room: <b id="room-display">...</b></div>
        <button class="copy-btn" id="copy-btn" onclick="copyInviteLink()">📋 Copy Link</button>
    </div>

    <div class="config-grid">
        <div class="field-group">
            <label>Name</label>
            <input type="text" id="username" value="Ali">
        </div>
        <div class="field-group">
            <label>Gender</label>
            <select id="gender">
                <option value="male" selected>👨 Male</option>
                <option value="female">👩 Female</option>
            </select>
        </div>
        <div class="field-group">
            <label>I Speak</label>
            <select id="my-lang">
                <option value="ur-PK" selected>🇵🇰 Urdu</option>
                <option value="en-US">🇬🇧 English</option>
                <option value="zh-CN">🇨🇳 Chinese</option>
                <option value="ms-MY">🇲🇾 Malay</option>
                <option value="ar-SA">🇸🇦 Arabic</option>
            </select>
        </div>
        <div class="field-group">
            <label>Partner Hears</label>
            <select id="target-lang">
                <option value="en-US" selected>🇬🇧 English</option>
                <option value="ms-MY">🇲🇾 Malay</option>
                <option value="ur-PK">🇵🇰 Urdu</option>
                <option value="zh-CN">🇨🇳 Chinese</option>
                <option value="ar-SA">🇸🇦 Arabic</option>
            </select>
        </div>
    </div>

    <div class="live-captions" id="captions">
        <div id="placeholder-msg" style="text-align: center; color: #475569; font-size: 12px; margin: auto;">
            Hold the Microphone button to speak.
        </div>
    </div>

    <div class="ptt-container">
        <div class="ptt-btn" id="ptt-btn">🎙️</div>
    </div>
    <div class="ptt-hint" id="ptt-hint">Press and hold to speak</div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    let roomId = urlParams.get('room');
    if (!roomId) {
        roomId = 'room-' + Math.random().toString(36).substring(2, 7);
        window.history.replaceState(null, '', window.location.pathname + '?room=' + roomId);
    }
    document.getElementById("room-display").innerText = roomId;

    const myClientId = 'user_' + Math.random().toString(36).substring(2, 9);
    
    let socket = null;
    let recognition = null;
    let currentAudio = null;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function copyInviteLink() {
        navigator.clipboard.writeText(window.location.href).then(() => {
            const btn = document.getElementById("copy-btn");
            btn.innerText = "✅ Link Copied!";
            btn.style.background = "#22c55e";
            setTimeout(() => {
                btn.innerText = "📋 Copy Link";
                btn.style.background = "#334155";
            }, 2000);
        });
    }

    function initSocket() {
        const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
        socket = new WebSocket(`${wsProtocol}${window.location.host}/ws/${roomId}`);

        socket.onopen = () => {
            document.getElementById("status-dot").classList.add("active");
            document.getElementById("call-status").innerText = "Connected";
            
            // Empty dummy audio to unlock browser autoplay policy (crucial fix)
            const unlockAudio = new Audio();
            unlockAudio.play().catch(e => console.log("Unlock waiting for user interaction"));
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const isMe = (data.sender_id === myClientId);

            appendCaption(data.sender_name, data.original, data.translated, isMe);

            if (!isMe) {
                playIncomingAudio(data.translated, data.target_lang, data.gender);
            }
        };

        socket.onclose = () => {
            document.getElementById("status-dot").classList.remove("active");
            document.getElementById("call-status").innerText = "Disconnected";
            setTimeout(initSocket, 3000); // auto reconnect
        };
    }

    function appendCaption(sender, orig, trans, isMe) {
        const placeholder = document.getElementById("placeholder-msg");
        if (placeholder) placeholder.remove();

        const captions = document.getElementById("captions");
        const item = document.createElement("div");
        item.className = "transcript-item " + (isMe ? "me" : "partner");
        item.innerHTML = `
            <div class="user">${sender} ${isMe ? "(You)" : "(Partner)"}</div>
            <div class="orig">${orig}</div>
            <div class="trans">👉 ${trans}</div>
        `;
        captions.appendChild(item);
        captions.scrollTop = captions.scrollHeight;
    }

    function playIncomingAudio(text, lang, gender) {
        if (!text) return;
        
        if (currentAudio) {
            currentAudio.pause();
            currentAudio = null;
        }

        const url = `/tts?text=${encodeURIComponent(text)}&lang=${encodeURIComponent(lang)}&gender=${encodeURIComponent(gender)}`;
        currentAudio = new Audio(url);
        
        currentAudio.play().catch((e) => {
            console.log("Browser blocked autoplay. User must click anywhere first.", e);
            document.getElementById("ptt-hint").innerText = "Browser blocked audio. Tap anywhere to allow.";
            document.getElementById("ptt-hint").style.color = "#ef4444";
        });
    }

    // Push To Talk Logic
    function initSpeech() {
        if (!SpeechRecognition) {
            alert("Chrome or Edge required.");
            return;
        }
        recognition = new SpeechRecognition();
        recognition.continuous = false; // Only record while holding
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript.trim();
            if (!transcript) return;

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    sender_id: myClientId,
                    sender_name: document.getElementById("username").value || "Caller",
                    gender: document.getElementById("gender").value,
                    source_lang: document.getElementById("my-lang").value,
                    target_lang: document.getElementById("target-lang").value,
                    text: transcript
                }));
            }
        };
    }

    const pttBtn = document.getElementById("ptt-btn");
    const pttHint = document.getElementById("ptt-hint");

    function startRecording() {
        if (!recognition) return;
        
        // Stop any playing audio so it doesn't feed into mic
        if (currentAudio) {
            currentAudio.pause();
        }

        pttBtn.classList.add("recording");
        pttHint.innerText = "Listening... Release to send";
        pttHint.style.color = "#22c55e";
        
        recognition.lang = document.getElementById("my-lang").value;
        try { recognition.start(); } catch(e) {}
    }

    function stopRecording() {
        if (!recognition) return;
        pttBtn.classList.remove("recording");
        pttHint.innerText = "Processing...";
        pttHint.style.color = "#38bdf8";
        
        try { recognition.stop(); } catch(e) {}
        
        setTimeout(() => {
            pttHint.innerText = "Press and hold to speak";
            pttHint.style.color = "#64748b";
        }, 1500);
    }

    // Mouse and Touch Events for Button
    pttBtn.addEventListener("mousedown", startRecording);
    pttBtn.addEventListener("mouseup", stopRecording);
    pttBtn.addEventListener("mouseleave", stopRecording);
    
    pttBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startRecording(); });
    pttBtn.addEventListener("touchend", (e) => { e.preventDefault(); stopRecording(); });
    pttBtn.addEventListener("touchcancel", (e) => { e.preventDefault(); stopRecording(); });

    // Initialize
    window.onload = () => {
        initSocket();
        initSpeech();
    };

</script>

</body>
</html>
